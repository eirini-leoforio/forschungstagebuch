function eLevel(d){const v=avg([d.eM,d.eA]);return v==null?null:v<=3.5?"niedrig":v<=6.5?"mittel":"hoch"}
function txtOf(d){return Object.values(d).map(v=>typeof v==="string"?v:Array.isArray(v)?v.map(x=>x.t||"").join(" "):"").join(" ").toLowerCase()}
function vVerlauf(){const F=view.f;
  let h=`<div><div class="eyebrow">${WK} Wochen ab ${fmtDate(startDate(),true)}</div><h1>Verlauf</h1></div>

   <div class="seg" role="group" aria-label="Art des Tages">${[["alle","Alle"],["arbeit","Arbeitstage"],["auszeit","Auszeiten"],["abbr","Abgebrochen"]].map(([k,l])=>`<button data-act="ft" data-v="${k}" aria-pressed="${F.typ===k}">${l}</button>`).join("")}</div>
   <div class="seg" role="group" aria-label="Energie">${[["alle","Energie: alle"],["niedrig","niedrig"],["mittel","mittel"],["hoch","hoch"]].map(([k,l])=>`<button data-act="fe" data-v="${k}" aria-pressed="${F.e===k}">${l}</button>`).join("")}</div></div><div id="vlist">${verlaufList()}</div>`;

function verlaufList(){const F=view.f;const q=F.q.trim().toLowerCase();

  let h="",n=0;for(let w=26;w>=1;w--){const ds=daysInWeek(w).filter(ok);if(!ds.length)continue;n+=ds.length;
    h+=`<div><div class="eyebrow" style="margin:8px 0 6px">Woche ${w} · ${weekRange(w)}</div><div class="list">${ds.slice().reverse().map(d=>`<button class="it" data-act="openDay" data-id="${d.id}"><span class="dot ${d.typ===1?(d.aArt===1?"r":"a"):d.abbr?"r":"f"}"></span><span class="l"><b>${fmtDate(d.date,true)}</b><span>${d.typ===1?"Auszeit":esc(d.fokus||(d.todos||[]).map(x=>x.t).filter(Boolean)[0]||"Promotionsarbeitstag")}${d.abbr?" · abgebrochen":""}</span></span>${d.eM||d.eA?`<span class="pill">${d.eM||"–"} / ${d.eA||"–"}</span>`:""}</button>`).join("")}</div></div>`}
  return (n?`<p class="muted" style="margin:0">${n} Tagesseite${n===1?"":"n"} · Zahlen rechts: Energie morgens / abends</p>`:"")+(h||`<div class="card"><p style="margin:0">Keine Tagesseite passt zu diesem Filter.</p></div>`)}
document.addEventListener("input",e=>{if(e.target.id==="fq"){view.f.q=e.target.value;$("#vlist").innerHTML=verlaufList()}if(e.target.id==="q"){view.q=e.target.value;$("#hits").innerHTML=hits(view.q)}});

// ================= Reflexion =================

   ${sel?`<button class="btn" data-act="openSub" data-t="karte" data-n="${sel}">Hilfekarte „${HILFE.find(x=>x.id===sel).t}“ öffnen</button>`:""}

// ================= Statistik =================
function stats(ds){const r={n:ds.length,f:0,a:0,aS:0,aF:0,faS:0,faF:0,td:0,tp:0,h:0,hn:0,abbr:0};
  ds.forEach(d=>{if(d.typ===1){r.a++;if(d.aArt===0)r.aS++;if(d.aArt===1)r.aF++}else{r.f++;if(d.abbr)r.abbr++;if(d.fa===0)r.faS++;if(d.fa===1)r.faF++;(d.todos||[]).forEach(t=>{if(t.t&&t.t.trim()){r.tp++;if(t.d)r.td++}});if(d.std!=null){r.h+=STD_MID[d.std];r.hn++}}});return r}
function periodDays(){const ds=sortedDays();if(view.period==="gesamt")return ds;const lim=addDays(today(),view.period==="woche"?-6:-29);return ds.filter(d=>d.date>=lim)}
function vStatistik(){const ds=periodDays();const st=stats(ds);
  let h=`<div><div class="eyebrow">Deine Zahlen</div><h1>Statistik</h1><p class="lead">Nur das, was du selbst eingetragen hast. Kein Zählen von Tagen am Stück, keine Wertung.</p></div>
  <div class="seg" role="group" aria-label="Zeitraum">${[["woche","7 Tage"],["monat","30 Tage"],["gesamt","Gesamt"]].map(([k,l])=>`<button data-act="period" data-p="${k}" aria-pressed="${view.period===k}">${l}</button>`).join("")}</div>`;
  if(!ds.length)return h+`<div class="card"><p style="margin:0">Für diesen Zeitraum gibt es noch keine Tagesseiten. Sobald du einträgst, erscheinen hier Energie, Schlaf, Stunden und Feierabende.</p></div>`+vSuche();
  h+=`<div class="tiles">${tile(st.n,"Tagesseiten")}${tile(st.f,"Promotionsarbeitstage")}${tile(st.a,"bewusste Auszeiten")}${tile(st.hn?"ca. "+Math.round(st.h):"–","Stunden am Projekt")}</div>`;
  h+=`<div class="card stack"><h3>Energielevel</h3>${energyChart(ds)}<div class="legend"><span><i style="background:var(--faden)"></i>morgens</span><span><i style="background:var(--petrol)"></i>abends</span></div>${energyNote(ds)}</div>`;
  h+=`<div class="card stack"><h3>Schlaf und Energie</h3>${sleepBars(ds)}</div>`;
  h+=`<div class="card stack"><h3>Was dich rausreißt</h3>${stoerBars(ds)}</div>`;
  h+=`<div class="card stack"><h3>Stunden am Projekt</h3>${distBars(ds.filter(d=>d.typ!==1),"std",STUNDEN)}<p class="muted" style="margin:0">Summe geschätzt aus deinen Stufen (unter 1 = 0,5 · 1–4 = 2,5 · über 4 = 5 Stunden).</p></div>`;
  h+=`<div class="card stack"><h3>Selbst gewählt oder fremdbestimmt?</h3><div class="bars">${split("Feierabend",st.faS,st.faF)}${split("Auszeiten",st.aS,st.aF)}</div><div class="legend"><span><i style="background:var(--petrol)"></i>selbst gewählt</span><span><i style="background:var(--faden)"></i>fremdbestimmt</span></div><p class="muted" style="margin:0">${st.abbr} von ${st.f} Promotionsarbeitstagen wurden fremdbestimmt abgebrochen oder nicht umgesetzt.</p></div>`;
  h+=`<div class="card stack"><h3>Geplante Schritte</h3>${st.tp?`<div class="bars">${bar("erledigt",st.td,st.tp)}</div><p class="muted" style="margin:0">${st.td} von ${st.tp} geplanten Schritten erledigt.</p>`:'<p class="muted" style="margin:0">Noch keine Schritte eingetragen.</p>'}</div>`;
  h+=`<div class="card stack"><h3>Promotionsarbeitstage und Auszeiten</h3>${calendar(ds)}<div class="legend"><span><i style="background:var(--petrol)"></i>Arbeitstag</span><span><i style="background:var(--gold)"></i>Auszeit selbst gewählt</span><span><i style="background:var(--faden)"></i>Auszeit fremdbestimmt</span></div></div>`;
  return h+monthTable()+standCompare()+vSuche()}
function energyChart(ds){const W=600,H=190,pl=26,pr=8,pt=10,pb=24;const n=ds.length;const x=i=>pl+(n<2?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));const y=v=>pt+(9-v)*(H-pt-pb)/8;
  let g="";for(const v of [1,3,5,7,9])g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const path=k=>{let p="",on=false;ds.forEach((d,i)=>{if(d[k]){p+=(on?"L":"M")+x(i).toFixed(1)+" "+y(d[k]).toFixed(1);on=true}else on=false});return p};
  const pts=(k,c)=>ds.map((d,i)=>d[k]?`<circle cx="${x(i).toFixed(1)}" cy="${y(d[k]).toFixed(1)}" r="${i===n-1?4.5:2.6}" fill="${c}"/>`:"").join("");
  const lbl=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i&&n>0).map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${new Date(ds[i].date+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Energielevel morgens und abends">${g}<path d="${path("eM")}" fill="none" stroke="var(--faden)" stroke-width="2.2"/><path d="${path("eA")}" fill="none" stroke="var(--petrol)" stroke-width="2.2"/>${pts("eM","var(--faden)")}${pts("eA","var(--petrol)")}${lbl}</svg>`}
function avg(a){a=a.filter(v=>v);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null}
function f1(v){return v==null?"–":v.toFixed(1).replace(".",",")}
function energyNote(ds){const mf=avg(ds.filter(d=>d.typ!==1).map(d=>d.eM)),ma=avg(ds.filter(d=>d.typ===1).map(d=>d.eM)),m=avg(ds.map(d=>d.eM)),a=avg(ds.map(d=>d.eA));
  return `<div class="tiles">${tile(f1(m),"Ø morgens")}${tile(f1(a),"Ø abends")}</div>${mf&&ma?`<p class="muted" style="margin:0">An Promotionsarbeitstagen startest du im Schnitt mit ${f1(mf)}, an Auszeiten mit ${f1(ma)}.</p>`:""}`}
function sleepBars(ds){const rows=SCHLAF.map((l,i)=>{const g=ds.filter(d=>d.schlaf===i);return {l,c:g.length,e:avg(g.map(d=>d.eM))}});const tot=rows.reduce((s,r)=>s+r.c,0);
  if(!tot)return '<p class="muted" style="margin:0">Noch keine Schlafangaben.</p>';const best=rows.filter(r=>r.e).sort((a,b)=>b.e-a.e)[0];
  return `<div class="bars">${rows.map(r=>`<div class="bar"><span>${r.l}</span><span class="tr"><i style="width:${(r.e||0)/9*100}%"></i></span><span class="n">${f1(r.e)}</span></div>`).join("")}</div><p class="muted" style="margin:0">Balken: dein Energielevel am Morgen im Schnitt nach so viel Schlaf (Nächte: ${rows.map(r=>r.c).join(" · ")}).${best?` Am meisten Energie hattest du nach ${best.l.replace("Std.","Stunden")}.`:""} Empfohlen für Erwachsene sind mindestens 7 Stunden.</p>`}
function stoerBars(ds){const g={};ds.forEach(d=>{if(d.st==null||d.st===6)return;const k=d.st===7?(d.stE&&d.stE.trim()?d.stE.trim():"Eigener Störfaktor"):STOER[d.st];(g[k]=g[k]||[]).push(d)});
  const rows=Object.entries(g).sort((a,b)=>b[1].length-a[1].length);const none=ds.filter(d=>d.st===6);
  if(!rows.length)return '<p class="muted" style="margin:0">Noch keine Störfaktoren eingetragen. Du findest das Feld auf der Abendseite.</p>';const m=rows[0][1].length;
  return `<div class="bars">${rows.map(([k,a])=>`<div class="bar"><span>${esc(k)}</span><span class="tr"><i class="r" style="width:${a.length/m*100}%"></i></span><span class="n">${a.length}×</span></div>`).join("")}</div><p class="muted" style="margin:0">Am häufigsten: ${esc(rows[0][0])}. An diesen Tagen lag deine Energie abends im Schnitt bei ${f1(avg(rows[0][1].map(d=>d.eA)))}${none.length?`, an Tagen ohne Störfaktor bei ${f1(avg(none.map(d=>d.eA)))}`:""}.</p>`}
function distBars(ds,k,labels){const c=labels.map((_,i)=>ds.filter(d=>d[k]===i).length);const m=Math.max(1,...c);return `<div class="bars">${labels.map((l,i)=>`<div class="bar"><span>${l}</span><span class="tr"><i style="width:${c[i]/m*100}%"></i></span><span class="n">${c[i]}</span></div>`).join("")}</div>`}
function split(l,a,b){const t=a+b;return `<div class="bar"><span>${l}</span><span class="tr">${t?`<i style="width:${a/t*100}%"></i><i class="r" style="width:${b/t*100}%"></i>`:""}</span><span class="n">${t?a+" / "+b:"–"}</span></div>`}
function bar(l,a,t){return `<div class="bar"><span>${l}</span><span class="tr"><i style="width:${t?a/t*100:0}%"></i></span><span class="n">${t?Math.round(a/t*100)+" %":"–"}</span></div>`}
function calendar(ds){if(!ds.length)return"";const map={};ds.forEach(d=>map[d.date]=d);let s=ds[0].date;const wd=(new Date(s+"T12:00:00").getDay()+6)%7;s=addDays(s,-wd);const last=ds[ds.length-1].date;
  let h='<div class="cal">'+"MDMDFSS".split("").map(c=>`<div class="h">${c}</div>`).join("");
  for(let c=s;c<=last;c=addDays(c,1)){const e=map[c];const k=!e?"":e.typ===1?(e.aArt===1?"af":"as"):"f";h+=`<div class="${k}" title="${c}">${+c.slice(8)}</div>`}return h+"</div>"}
function monthTable(){const ms=Object.keys(S.months).filter(m=>S.months[m].r&&Object.keys(S.months[m].r).length).sort();if(!ms.length)return"";
  return `<div class="card stack"><h3>Monatsreflexionen im Vergleich</h3><div class="mtab"><table><tr><th>Bereich</th>${ms.map(m=>`<th>M${m}</th>`).join("")}</tr>${RATE_ITEMS.flatMap(g=>g[1]).map(it=>`<tr><td>${it}</td>${ms.map(m=>{const v=S.months[m].r[it];return `<td class="${v&&v<5?"lo":""}">${v||"–"}</td>`}).join("")}</tr>`).join("")}</table></div><p class="muted" style="margin:0">Rot: Werte unter 5.</p></div>`}
function standCompare(){const ks=["start","mitte","ende"].filter(k=>S.stand[k]);if(!ks.length)return"";const cnt=a=>(a||[]).filter(x=>x.t&&x.t.trim()).length;const lab={start:"Anfang",mitte:"Halbzeit",ende:"Ende"};
  return `<div class="card stack"><h3>Mein Stand im Vergleich</h3><div class="mtab"><table><tr><th></th>${ks.map(k=>`<th>${lab[k]}</th>`).join("")}</tr><tr><td>fertig</td>${ks.map(k=>`<td>${cnt(S.stand[k].fertig)}</td>`).join("")}</tr><tr><td>im Entwurf</td>${ks.map(k=>`<td>${cnt(S.stand[k].entwurf)}</td>`).join("")}</tr><tr><td>noch offen</td>${ks.map(k=>`<td>${cnt(S.stand[k].offen)}</td>`).join("")}</tr></table></div></div>`}
function vSuche(){return `<div class="card stack" id="search"><h3>In allen Einträgen suchen</h3><input type="text" id="q" placeholder="z. B. Interview, Betreuung, Methodenkapitel" value="${esc(view.q)}" aria-label="Suchbegriff"><div id="hits">${hits(view.q)}</div></div>`}
function hits(q){q=(q||"").trim().toLowerCase();if(q.length<2)return"";const out=[];
  sortedDays().forEach(d=>{const s=txtOf(d);const i=s.indexOf(q);if(i>=0)out.push(`<button class="it" data-act="openDay" data-id="${d.id}"><span class="dot f"></span><span class="l"><b>${fmtDate(d.date,true)}</b><span>${snip(s,i,q.length)}</span></span></button>`)});
  for(const [w,o] of Object.entries(S.weeks)){const s=Object.values(o).map(v=>typeof v==="string"?v:Array.isArray(v)?v.map(x=>x.t).join(" "):"").join(" · ");const i=s.toLowerCase().indexOf(q);if(i>=0)out.push(`<button class="it" data-act="openSub" data-t="woche" data-n="${w}"><span class="dot r"></span><span class="l"><b>Wochenreflexion ${w}</b><span>${snip(s,i,q.length)}</span></span></button>`)}
  return out.length?`<div class="list">${out.join("")}</div>`:'<p class="muted" style="margin:0">Nichts gefunden.</p>'}
function snip(s,i,l){const a=Math.max(0,i-30);return (a?"…":"")+esc(s.slice(a,i))+`<span class="hit">${esc(s.slice(i,i+l))}</span>`+esc(s.slice(i+l,i+l+50))+"…"}

// ================= Kalenderdatei =================
function buildIcs(){const st=startDate(),m=(S.rem.m||"08:30").replace(":",""),a=(S.rem.a||"20:00").replace(":","");const d=x=>x.replace(/-/g,"");const now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";const uid=k=>k+"-"+st+"-"+Math.random().toString(36).slice(2,8)+"@forschungstagebuch";
  const ev=(k,date,time,sum,desc,rule)=>["BEGIN:VEVENT","UID:"+uid(k),"DTSTAMP:"+now,"DTSTART:"+d(date)+"T"+time+"00","DURATION:PT15M","SUMMARY:"+sum,"DESCRIPTION:"+desc,rule,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+sum,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].join("\r\n");
  const mEnds=Object.keys(MONATE).map(w=>addDays(st,w*7-1));
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Forschungstagebuch//DE","CALSCALE:GREGORIAN",
   ev("morgen",st,m,"Forschungstagebuch: Morgenseite","Fünf Minuten für deinen Start in den Tag.","RRULE:FREQ=DAILY;COUNT="+WK*7),
   ev("abend",st,a,"Forschungstagebuch: Abendseite","Fünf Minuten Rückblick auf deinen Tag.","RRULE:FREQ=DAILY;COUNT="+WK*7),
   ev("woche",addDays(st,6),a,"Forschungstagebuch: Wochenreflexion","Zeit für deinen Wochenrückblick.","RRULE:FREQ=WEEKLY;COUNT="+WK),
   ev("monat",mEnds[0],a,"Forschungstagebuch: Monatsreflexion","Zeit für deine Monatsreflexion.",mEnds.length>1?"RDATE:"+mEnds.slice(1).map(x=>d(x)+"T"+a+"00").join(","):"RRULE:FREQ=DAILY;COUNT=1"),
   "END:VCALENDAR"].join("\r\n")}
function download(name,txt,type){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}catch(e){}}

   if(S.rem.on){download("forschungstagebuch-erinnerungen.ics",buildIcs(),"text/calendar");toast("Kalenderdatei erstellt")}
   go("heute",{sub:{t:"stand",n:"start",first:true}})},

 ics(){S.rem.m=$("#rm2").value||"08:30";S.rem.a=$("#ra2").value||"20:00";S.rem.on=true;save();download("forschungstagebuch-erinnerungen.ics",buildIcs(),"text/calendar");
   $("#icsbox").innerHTML=`<p class="muted" style="margin:0">Die Datei wurde erstellt. Öffne sie und tippe auf „Alle hinzufügen“. Falls nichts passiert, ist das Herunterladen hier gesperrt: In der installierten App funktioniert es.</p>`},
 newDay(t){const date=($("#nd0")&&$("#nd0").value)||today();if(testOver(date)){toast("Die Testversion umfasst die ersten vier Wochen.");return}const ex=dayOf(date);if(ex){go("heute",{day:ex.id,edit:true});return}
   const id=Date.now();S.days.push({id,date,typ:+t.dataset.typ});save();go("heute",{day:id,edit:true})},
 openDay(t){const id=+t.dataset.id;if(!id)return;go("heute",{day:id})},
 edit(t){const part=t.dataset.part;go("heute",{day:+t.dataset.id,edit:true});if(part==="abend"){const el=$("#abend");el&&el.scrollIntoView()}},

 tbDay(t){tbKeep();const f=view.sub.f;const v=+t.dataset.v;if(view.sub.edit)f.days=[v];else f.days=f.days.includes(v)?f.days.filter(x=>x!==v):f.days.concat(v).sort();keepScroll(render)},

  else{f.days.forEach(wd=>T.blocks.push({id:T.bid++,wd,s:f.s,e:f.e,cat:f.cat,t:(f.t||"").trim()}));toast(f.days.length>1?f.days.length+" Blöcke eingetragen":"Eingetragen")}
  f.t="";save();keepScroll(render)},
 tbEdit(t){const b=tb().blocks.find(x=>x.id===+t.dataset.id);view.sub.edit=b.id;view.sub.f={days:[b.wd],cat:b.cat,s:b.s,e:b.e,t:b.t};render();const el=$("#tbform");el&&el.scrollIntoView({behavior:"smooth",block:"start"})},

 tbEx(){const T=tb();T.blocks=tbExample();T.bid=T.blocks.length+1;save();keepScroll(render);toast("Beispielwoche geladen. Du kannst alles ändern oder löschen.")},
 tbClear(){$("#tbcl").innerHTML=`<div class="card stack"><p style="margin:0">Wirklich alle Blöcke löschen?</p><div class="row"><button class="btn small" data-act="tbClearOk">Ja, Woche leeren</button></div></div>`},
 tbClearOk(){tb().blocks=[];view.sub.edit=null;view.sub.f=null;save();keepScroll(render)},
 openSub(t){const n=t.dataset.n;go(view.tab,{sub:{t:t.dataset.t,n:n==null?undefined:isNaN(+n)?n:+n,first:!!t.dataset.first},back:{tab:view.tab,day:view.day,sub:view.sub}})},

 done(t){const wk=t.dataset.t==="woche"?+t.dataset.n:0;const o=(t.dataset.t==="woche"?S.weeks:S.months)[+t.dataset.n];o.done=true;save();if(TESTV&&wk===2&&!S.fb.sent){go("heute",{sub:{t:"testdone"}});return}toast("Gespeichert. Gut gemacht.");render()},

 backup(){const txt=JSON.stringify(S);download("forschungstagebuch-sicherung-"+today()+".json",txt,"application/json");

// ================= PDF =================
function buildPrint(){const L=(l,v)=>v&&String(v).trim()?`<p><b>${l}:</b> ${esc(v).replace(/\n/g,"<br>")}</p>`:"";const T=(l,a)=>(a||[]).filter(x=>x.t).length?`<p><b>${l}:</b> ${(a||[]).filter(x=>x.t).map(x=>(x.d?"☑ ":"☐ ")+esc(x.t)).join(" · ")}</p>`:"";
  let h=`<h1>Forschungstagebuch Promotion</h1><p>Export vom ${fmtDate(today(),true)} · Start am ${fmtDate(startDate(),true)} · ${S.days.length} Tagesseiten</p>`;
  if(S.warum.satz)h+=`<h2>Mein Warum</h2><p>${esc(S.warum.satz)}</p>`;
  const st=stats(sortedDays());h+=`<h2>Überblick</h2><p>Promotionsarbeitstage ${st.f} (davon fremdbestimmt abgebrochen ${st.abbr}) · Auszeiten ${st.a} (selbst gewählt ${st.aS}, fremdbestimmt ${st.aF}) · Feierabend selbst gewählt ${st.faS}, fremdbestimmt ${st.faF} · Stunden ca. ${Math.round(st.h)} · Schritte erledigt ${st.td} von ${st.tp}</p>`;
  for(let w=1;w<=curWeek();w++){const ds=daysInWeek(w);const o=S.weeks[w];if(!ds.length&&!o)continue;h+=`<h2 class="pw">Woche ${w} · ${weekRange(w)}</h2>`;ds.forEach(d=>{h+=`<div class="pd"><h3>${fmtDate(d.date,true)} · ${TYP[d.typ===1?1:0]}${d.abbr?" · fremdbestimmt abgebrochen":""}</h3>${d.eM||d.eA?`<p>Energie morgens ${d.eM||"–"}, abends ${d.eA||"–"} · Schlaf ${d.schlaf!=null?SCHLAF[d.schlaf]:"–"}${d.std!=null?" · Projekt "+STUNDEN[d.std]:""}${d.st!=null&&d.st!==6?" · Störfaktor "+(d.st===7?esc(d.stE||""):STOER[d.st]):""}</p>`:""}${L("Fokus",d.fokus)}${T("Schritte",d.todos)}${L("Affirmation",d.aff)}${L("Energie gegeben",d.plus)}${L("Energie gezogen",d.minus)}${L("Geschafft",d.geschafft)}${L("Daran hänge ich",d.haenge)}${L("Erkenntnis",d.erk)}</div>`});
   if(o)h+=`<div class="pd"><h3>Wochenreflexion</h3>${L("Vorangebracht",o.frage)}${L("Das hat mich vorangebracht",o.voran)}${L("Ausgebremst",o.bremse)}${L("Wer hat entschieden",o.wer)}${L("Grenzen",o.grenzen)}${T("Nächste Schritte",o.schritte)}${L("Notizen",o.notiz)}</div>`}
  $("#print").innerHTML=h}

    s.days.push({id:id++,date,typ:a?1:0,aArt:a?(i%2):null,schlaf:sl,eM:Math.max(2,Math.min(9,[4,6,6,3,7,8,5][i%7]+(i>12?1:0))),eA:Math.max(1,Math.min(9,[3,5,6,2,6,7,4][i%7]+(i>12?1:0))),std:a?null:[1,1,2,0,1,2][i%6],fa:a?null:(i%3===0?1:0),abbr:!a&&i%9===2,abbrW:!a&&i%9===2?"Projektbericht für den Job":"",st:[0,1,6,2,0,6,5][i%7],fokus:a?"":fok[i%6],todos:a?[]:[{t:step[i%6],d:i%4!==0},{t:"Fokusblock 90 Minuten",d:i%3!==0},{t:"Notizen ordnen",d:false}],geschafft:a?"":"Zwei Fokusblöcke durchgezogen.",erk:i%5===0?"Morgens vor den Mails schreibe ich am besten.":"",plus:i%4===0?"Spaziergang mit dem Hund in der Mittagspause":""})}

  s.months[1]={r:{"Fortschritt im Text":6,"Klarheit meiner Argumentation":5,"Zuversicht":7,"Freude am Thema":8,"Energie":5,"Schlaf und Erholung":4,"Störungsfreie Arbeitsumgebung":6,"Social Media im Griff":3,"Grenzen bei Familie und Freunden":6,"Grenzen im Job, Feierabend":4,"Promotion fest im Kalender":7}};
  return s}
