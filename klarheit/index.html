<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Reset &amp; Flow</title>
<meta name="theme-color" content="#A3402F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reset &amp; Flow">
<style>
@font-face{font-family:"Source Sans 3";src:url(fonts/source-sans-3-latin-wght-normal.woff2) format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Source Sans 3";src:url(fonts/source-sans-3-latin-ext-wght-normal.woff2) format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0100-024F,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Source Serif 4";src:url(fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:"Source Serif 4";src:url(fonts/source-serif-4-latin-opsz-italic.woff2) format("woff2");font-weight:200 900;font-style:italic;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
/* Layout: eine Spalte wie eine Buchseite, rote Faden-Linie links am Innenrand, Navigation unten */
:root{
  --paper:#FAF8F4; --sheet:#FFFFFF; --ink:#1F2E2D; --soft:#4F625F; --muted:#7A8A87;
  --petrol:#2E5D5B; --petrol-dark:#24504E; --nebel:#EEF3F2; --line:#D6DEDC;
  --faden:#A3402F; --faden-soft:#F3E3DE; --gold:#E9C9A6;
  --good:#3B7A57; --warn:#B7791F;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14201F; --sheet:#1B2928; --ink:#E7EEEC; --soft:#B5C4C1; --muted:#8FA19E;
  --petrol:#7FB3AE; --petrol-dark:#9CC7C2; --nebel:#22312F; --line:#33464390;
  --faden:#E07B66; --faden-soft:#3A2622; --gold:#E9C9A6; --good:#7CC39A; --warn:#E0B060; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14201F; --sheet:#1B2928; --ink:#E7EEEC; --soft:#B5C4C1; --muted:#8FA19E;
  --petrol:#7FB3AE; --petrol-dark:#9CC7C2; --nebel:#22312F; --line:#33464390;
  --faden:#E07B66; --faden-soft:#3A2622; --gold:#E9C9A6; --good:#7CC39A; --warn:#E0B060; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--faden);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--petrol-dark);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faden)}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--petrol-dark);background:var(--nebel);border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--faden)}
h1,h2,h3{font-family:var(--serif);color:var(--petrol-dark);text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15;font-weight:600}
h2{font-size:21px;line-height:1.25;font-weight:600}
h3{font-size:17px;font-weight:600}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faden);margin-bottom:4px}
.lead{color:var(--soft);font-size:16px;margin:6px 0 0}
.muted{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.page{background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--faden);border-radius:4px;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.sec{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--petrol)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec svg{width:20px;height:20px;stroke:var(--petrol);fill:none;stroke-width:1.5}
.q{font-weight:600;color:var(--petrol-dark);font-size:15px;margin-bottom:6px;display:block}
.q .hn{display:block;font-weight:400;color:var(--muted);font-size:13px}
textarea,input[type=text],input[type=date]{width:100%;background:var(--nebel);border:1px solid transparent;border-bottom:1px solid var(--line);border-radius:3px;padding:9px 10px;font-size:16px;line-height:1.45;resize:vertical}
textarea{min-height:64px}
textarea:focus,input:focus{border-color:var(--petrol);outline:none;background:var(--sheet)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;color:var(--soft);min-height:40px}
.chip[aria-pressed="true"]{background:var(--petrol-dark);border-color:var(--petrol-dark);color:var(--sheet)}
.scale{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.scale.s10{grid-template-columns:repeat(10,1fr)}
.scale button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:50%;font-weight:700;font-size:15px;color:var(--soft);padding:0;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--faden);border-color:var(--faden);color:#fff}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.todo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.todo input[type=text]{flex:1;min-width:0}
.cbx{width:28px;height:28px;flex:none;border:1.5px solid var(--petrol);border-radius:4px;background:var(--sheet);display:grid;place-items:center;padding:0}
.cbx[aria-pressed="true"]{background:var(--petrol);}
.cbx[aria-pressed="true"]::after{content:"";width:7px;height:13px;border:solid var(--sheet);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.band{background:var(--petrol-dark);color:#fff;border-radius:3px;padding:16px 16px 18px;position:relative}
:root[data-theme="dark"] .band{background:#0E1918}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .band{background:#0E1918}}
.band .k{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.band p{margin:0;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.45}
.band .src{display:block;margin-top:8px;font-family:var(--sans);font-style:normal;font-size:12px;color:#C9D8D5}
.fact{background:var(--nebel);border-radius:3px;padding:14px 16px}
.fact .k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faden);margin-bottom:4px}
.fact h3{margin-bottom:4px}
.fact p{margin:0;color:var(--ink)}
.fact .src{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:4px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--faden);color:#fff;min-height:46px;text-decoration:none}
.btn.sec2{background:var(--nebel);color:var(--petrol-dark)}
.btn.ghost{background:none;color:var(--petrol-dark);border:1px solid var(--line)}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .t{flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;color:var(--petrol-dark);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn:disabled{opacity:.35}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--sheet);overflow:hidden}
.list button.it{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;width:100%}
.list button.it:first-child{border-top:0}
.list .it .l{flex:1;min-width:0}
.list .it .l b{display:block;font-weight:600;color:var(--ink)}
.list .it .l span{font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.dot.f{background:var(--petrol)} .dot.a{background:var(--gold)} .dot.r{background:var(--faden)}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--faden-soft);color:var(--faden);white-space:nowrap}
.tag.ok{background:var(--nebel);color:var(--petrol)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.tile .v{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--petrol-dark);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--nebel);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--petrol-dark);box-shadow:0 1px 2px #0002}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--sans);font-size:11px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.bar .tr{height:14px;background:var(--nebel);border-radius:2px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%;background:var(--petrol)}
.bar .tr i.r{background:var(--faden)} .bar .tr i.g{background:var(--gold)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1;border-radius:3px;background:var(--nebel);font-size:11px;display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums}
.cal div.f{background:var(--petrol);color:var(--sheet)} .cal div.as{background:var(--gold);color:#3b2a12} .cal div.af{background:var(--faden);color:#fff}
.cal div.h{background:none}
.mtab{overflow-x:auto}
.mtab table{border-collapse:collapse;font-size:14px;min-width:100%}
.mtab th,.mtab td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.mtab th:first-child,.mtab td:first-child{text-align:left}
.mtab td.lo{color:var(--faden);font-weight:700}
.rateitem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:6px}
.rateitem input{min-width:0}
.rsel{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.rsel button{border:0;background:var(--sheet);padding:6px 9px;font-weight:700;color:var(--soft);font-size:14px;min-width:34px}
.rsel button[aria-pressed="true"]{background:var(--petrol-dark);color:var(--sheet)}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px}
.ms{background:linear-gradient(var(--faden-soft),var(--sheet));border:1px solid var(--line);border-left:3px solid var(--faden);border-radius:4px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.ms h1{font-size:34px}
.story{border-left:3px solid var(--gold);padding-left:12px;color:var(--soft)}
.story .k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faden)}
.story p{margin:6px 0 0;font-family:var(--serif);font-style:italic}
.offer{background:var(--nebel);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:8px}
.offer .k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faden)}
.offer p{margin:0}
a{color:var(--petrol-dark)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.hit{background:var(--faden-soft);border-radius:2px;padding:0 2px}
.demo{background:var(--faden-soft);color:var(--faden);border-radius:4px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero{padding:22px 0 6px}
.hero h1{font-size:34px}
.thread{height:3px;width:72px;background:var(--faden);margin:14px 0}
details.help{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
details.help summary{font-weight:600;color:var(--petrol-dark);cursor:pointer}
details.help ol{margin:8px 0 0;padding-left:20px;color:var(--soft)}
#print{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  header.top,nav.tabs,.wrap,.toast,body::before{display:none!important}
  #print{display:block;font-family:var(--sans);font-size:11pt;color:#000}
  #print h1,#print h2{color:#24504E}
  #print .pd{break-inside:avoid;border-left:2px solid #A3402F;padding-left:10px;margin:0 0 14px}
  #print .pw{break-before:page}
}
@font-face{font-family:"Caveat";src:url(fonts/caveat-latin.woff2) format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2191,U+2193}
@font-face{font-family:"Caveat";src:url(fonts/caveat-latin-ext.woff2) format("woff2");font-weight:400 600;font-display:swap;unicode-range:U+0100-02BA,U+1E00-1E9F,U+2020,U+20A0-20AB}
:root{--hand:"Caveat","Segoe Print","Bradley Hand",cursive;--handink:var(--ink);--rule:#DCE4E8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rule:#2C3D3B}}
:root[data-theme="dark"]{--rule:#2C3D3B}
nav.tabs .in{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:11px}
.pill{text-align:right;line-height:1.25}
.pill small{display:block;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
body.writing nav.tabs{display:none}
/* Buchansicht */
.paperpage{background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);background-position:0 12px;border:1px solid var(--line);border-radius:3px;padding:12px 16px 20px 30px;position:relative;box-shadow:0 1px 0 var(--line),0 6px 18px -12px #0003}
.paperpage::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--faden);opacity:.75}
.paperpage .date{font-family:var(--serif);font-size:20px;color:var(--petrol-dark);line-height:34px;font-weight:600}
.paperpage .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:17px;margin-top:17px}
.paperpage .hw{font-family:var(--hand);font-size:23px;line-height:34px;color:var(--handink);white-space:pre-wrap;overflow-wrap:anywhere}
.paperpage .hw.s{font-size:21px}
.paperpage .meta{font-family:var(--hand);font-size:22px;line-height:34px;color:var(--handink)}
.paperpage .circ{display:inline-block;border:1.5px solid var(--handink);border-radius:50%;padding:0 7px;line-height:24px;margin:0 2px}
.paperpage .tick{font-family:var(--hand);font-size:22px;line-height:34px;color:var(--handink)}
.paperpage .band{margin:17px -4px 0}
.paperpage .moonsun{display:flex;align-items:center;gap:8px;margin-top:17px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--petrol);line-height:17px}
.paperpage .tick{display:flex;align-items:center;gap:8px}
.paperpage .hbox{width:24px;height:24px;transform:rotate(-2.5deg);flex:none;fill:none;stroke:var(--handink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.paperpage .hbox .hk{stroke-width:2.2}
.paperpage .penbtn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px;min-height:32px;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--soft)}
.paperpage .moonsun .penbtn svg{width:14px;height:14px;stroke:currentColor}
.paperpage .moonsun svg{width:18px;height:18px;stroke:var(--petrol);fill:none;stroke-width:1.5}
.paperpage .empty{font-size:14px;color:var(--muted);line-height:34px;font-style:italic}
.startday{display:flex;flex-direction:column;gap:14px}
.bigchoice{display:grid;grid-template-columns:1fr;gap:10px}
.bigchoice button{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:16px;text-align:left;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--petrol-dark);display:flex;justify-content:space-between;align-items:center;min-height:60px}
.bigchoice button span{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted);display:block}
.bigchoice button svg{width:22px;height:22px;stroke:var(--faden);fill:none;stroke-width:1.8;flex:none}
.switch{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--sheet);text-align:left;width:100%}
.switch .tr{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:left .2s}
.switch[aria-checked="true"] .tr{background:var(--faden)}
.switch[aria-checked="true"] .tr::after{left:21px}
.switch b{display:block;color:var(--ink);font-weight:600}
.switch small{color:var(--muted);font-size:13px}
.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--sheet);border-radius:4px;padding:10px 14px;width:100%;text-align:left;font-weight:600;color:var(--petrol-dark)}

<script>
"use strict";
// ================= Grunddaten =================
const KEY="ftb-klarheit-v1";
const TESTV=true;
const LINKS={gespraech:"https://drmaschakoerner.de/erstgespraech/#formular",gantt:"https://drmaschakoerner.de/gantt-vorlagen/",sos:"https://drmaschakoerner.de/schnelle-hilfe/",ki:"https://drmaschakoerner.de/ki-in-der-abschlussarbeit/",maxqda:"https://drmaschakoerner.mytentary.com/p/Bvukys",nl:"https://drmaschakoerner.de/#newsletter"};
const NL_CARD=`<div class="offer"><div class="k">Danke für dein Feedback!</div><p style="margin:0">Dein Dankeschön, den Gutschein über 30 Prozent auf eine Coaching-Einzelstunde, schicke ich dir per E-Mail. Wenn du nichts verpassen möchtest: In meinem Newsletter „Post mit rotem Faden“ erfährst du von neuen Angeboten und Rabatten, dazu kommen alle drei Wochen Tipps für dein Forschungsprojekt.</p><div class="row"><a class="btn small" href="${LINKS.nl}" target="_blank" rel="noopener">Zum Newsletter</a></div></div>`;
const SCHLAF=["unter 6 Std.","6–7 Std.","7–9 Std.","über 9 Std."];
const GUT=["gut","geht so","kaum"];
const STUNDEN=["unter 1 Std.","1–2 Std.","2–4 Std.","über 4 Std."];
const ART={d:"Denkaufgabe",k:"Klärungsaufgabe",f:"Fleißaufgabe"};
const ARTK={d:"Denken",k:"Klären",f:"Fleiß"};
const ARTH={d:"braucht einen klaren Kopf",k:"in 10 bis 15 Minuten erledigt",f:"viel Arbeit, wenig Kopf"};
const AMPEL=["offen","begonnen","fertig"];
const LAGE=["Ich habe vor allem Chaos.","Ein großer inhaltlicher Teil ist noch nicht fertig, z. B. die Auswertung.","Die Rohfassung steht weitgehend."];
const TEST_OPT=["trifft nicht zu","eher nicht","eher ja","trifft voll zu"];
const R5=["1","2","3","4","5"];

function blank(){return {v:1,started:false,goal:null,start:today(),deadline:"",lage:[],ki:null,warum:"",braindump:"",bdDone:false,tasks:[],nid:1,park:[],gl:[],gid:1,days:{},pd:{},formalOff:false,fb:{},test:{},demo:false,created:today()}}
let S=blank();let storageOK=true;
function load(){try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(blank(),JSON.parse(r))}}catch(e){storageOK=false}}
let saveT=null;
function save(){if(S.demo)return;clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}},250)}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

// ================= Datum =================
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function fmtDate(s,long){if(!s)return"";const d=new Date(s+"T12:00:00");return d.toLocaleDateString("de-DE",long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"})}
function fmtShort(s){return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"})}
function diffDays(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const $=s=>document.querySelector(s);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2000)}

// ================= Der Monat =================
function plan(){const st=S.start||today();const end=S.goal==="abgeben"&&S.deadline?S.deadline:addDays(st,29);
  const N=Math.max(1,diffDays(st,end)+1);const p3=Math.min(5,N),p1=Math.min(5,Math.max(0,N-p3)),p2=N-p3-p1,buf=Math.min(2,p2);
  return {st,end,N,p1,p2,p3,buf,p2s:addDays(st,p1),p3s:addDays(st,p1+p2),roh:addDays(st,p1+p2-1),bufS:addDays(st,p1+p2-buf)}}
function where(date){const P=plan();const i=diffDays(P.st,date);
  if(i<0)return {pre:true,rest:-i,i};if(i>=P.N)return {post:true,i};
  if(i<P.p1)return {ph:1,n:i+1,of:P.p1,i};
  if(i<P.p1+P.p2){const n=i-P.p1+1;return {ph:2,n,of:P.p2,buf:n>P.p2-P.buf,i}}
  const n=i-P.p1-P.p2+1;return {ph:3,n,of:P.p3,c:n-1+(5-P.p3),i}}
function phName(ph){return ph===1?"Aufräumen":ph===2?(S.goal==="spur"?"Aufgaben erledigen":"Lücken schließen"):(S.goal==="spur"?"In die Spur":"Feinschliff und Abgabe")}
function phShort(ph){return ph===3?(S.goal==="spur"?"In die Spur":"Feinschliff"):phName(ph)}
function slogan(){return S.goal==="spur"?"In einem Monat zurück in die Spur":"In einem Monat sicher zur Abgabe"}

// ================= Bindungen =================
let BIND={},bindId=0;
function bindObj(o){const id="o"+(++bindId);BIND[id]=o;return id}
function ta(o,key,label,hint,rows,ph){const id=bindObj(o);const fid="f_"+id+"_"+key;return `<div><label class="q" for="${fid}">${label}${hint?`<span class="hn">${hint}</span>`:""}</label><textarea id="${fid}" rows="${rows||2}" placeholder="${esc(ph||"")}" data-b="${id}" data-k="${key}">${esc(o[key])}</textarea></div>`}
function inp(o,key,label,ph,hint){const id=bindObj(o);const fid="f_"+id+"_"+key;return `<div><label class="q" for="${fid}">${label}${hint?`<span class="hn">${hint}</span>`:""}</label><input type="text" id="${fid}" placeholder="${esc(ph||"")}" data-b="${id}" data-k="${key}" value="${esc(o[key])}"></div>`}
function chips(o,key,opts,label,hint){const id=bindObj(o);return `<div>${label?`<span class="q">${label}${hint?`<span class="hn">${hint}</span>`:""}</span>`:""}<div class="chips" role="group">${opts.map((t,i)=>`<button class="chip" data-b="${id}" data-k="${key}" data-v="${i}" aria-pressed="${o[key]===i}">${t}</button>`).join("")}</div></div>`}
function scale(o,key,label){const id=bindObj(o);return `<div><span class="q">${label}</span><div class="scale" role="group" aria-label="${label}">${Array.from({length:9},(_,i)=>`<button data-b="${id}" data-k="${key}" data-v="${i+1}" aria-pressed="${o[key]===i+1}" aria-label="${i+1}">${i+1}</button>`).join("")}</div><div class="scale-l"><span>leer</span><span>voller Energie</span></div></div>`}
function checklist(o,items,label){const id=bindObj(o);return `<div>${label?`<span class="q">${label}</span>`:""}${items.map((t,i)=>`<button class="ck" data-b="${id}" data-ck="${i}" aria-pressed="${!!o[i]}"><span class="cbx" aria-hidden="true"></span><span>${esc(t)}</span></button>`).join("")}</div>`}
function todos(o,key,label,n){if(!Array.isArray(o[key]))o[key]=[];while(o[key].length<n)o[key].push({t:"",d:false});const id=bindObj(o[key]);return `<div><span class="q">${label}</span>${o[key].map((t,i)=>`<div class="todo"><button class="cbx" aria-label="erledigt" data-b="${id}" data-i="${i}" data-todo="1" aria-pressed="${!!t.d}"></button><input type="text" aria-label="${label} ${i+1}" data-b="${id}" data-i="${i}" data-todot="1" value="${esc(t.t)}"></div>`).join("")}</div>`}
function dateIn(o,key,label,hint){const id=bindObj(o);const fid="f_"+id+"_"+key;return `<div><label class="q" for="${fid}">${label}${hint?`<span class="hn">${hint}</span>`:""}</label><input type="date" id="${fid}" data-b="${id}" data-k="${key}" data-re="1" value="${esc(o[key])}"></div>`}

document.addEventListener("input",e=>{const t=e.target;const o=BIND[t.dataset.b];if(!o)return;
  if(t.dataset.todot){o[+t.dataset.i].t=t.value}else if(t.dataset.k){o[t.dataset.k]=t.value}save()});
document.addEventListener("change",e=>{if(e.target.dataset.re){save();keepScroll(render)}});
document.addEventListener("focusin",e=>{if(e.target.matches("textarea,input[type=text]"))document.body.classList.add("writing")});
document.addEventListener("focusout",e=>{if(e.target.matches("textarea,input[type=text]"))document.body.classList.remove("writing")});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newtask"){e.preventDefault();ACT.addTask()}});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  const o=BIND[t.dataset.b];
  if(o){
    if(t.dataset.todo){const it=o[+t.dataset.i];it.d=!it.d;t.setAttribute("aria-pressed",it.d);save();return}
    if(t.dataset.ck!=null){const i=t.dataset.ck;o[i]=!o[i];t.setAttribute("aria-pressed",!!o[i]);save();return}
    if(t.dataset.k){const v=+t.dataset.v;o[t.dataset.k]=o[t.dataset.k]===v?null:v;save();keepScroll(render);return}
  }
  const a=t.dataset.act;if(a&&ACT[a])ACT[a](t);
});
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}

// ================= Ansicht =================
let view={tab:"heute",date:null,sub:null,open:null,bulk:false,f:{art:"alle",st:"offen",mk:"alle",kap:"alle"}};
function go(tab,extra){view=Object.assign({tab,date:null,sub:null,open:null,bulk:false,f:view.f},extra||{});render();window.scrollTo(0,0)}
function render(){BIND={};bindId=0;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===view.tab?"page":"false"));
  const w=S.started?where(today()):null;
  $("#prog").innerHTML=!S.started?"Start":w.pre?`Start in ${w.rest} ${w.rest===1?"Tag":"Tagen"}`:w.post?"Geschafft":`Tag ${w.i+1} von ${plan().N}`;
  $("#parkbtn").hidden=!S.started;
  document.body.classList.toggle("setup",!S.started);
  const demo=S.demo?`<div class="demo">Du siehst Beispieldaten. Änderungen werden nicht gespeichert.<button class="btn small" data-act="clearDemo">Selbst starten</button></div>`:"";
  const fn=!S.started?vEinrichten:{heute:vHeute,aufgaben:vAufgaben,fortschritt:vFortschritt,hilfe:vHilfe,mehr:vMehr}[view.tab];
  $("#app").innerHTML=`<div class="stack">${demo}${view.sub?SUB[view.sub.t](view.sub):fn()}</div>`;
}
function back(){return `<button class="btn ghost small" data-act="back" style="align-self:flex-start">${ICON.l} Zurück</button>`}
function tile(v,l){return `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`}
const ICON={l:'<svg width="18" height="18" viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8"><path d="M15 5l-7 7 7 7"/></svg>',
 r:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/></svg>',
 brain:'<svg viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></svg>'};

// ================= Einrichten =================
function vEinrichten(){const ab=S.goal==="abgeben",sp=S.goal==="spur";let prev="";
  if(S.goal&&(sp||S.deadline)){const P=plan();const w=[];
    if(ab&&P.N<10)w.push("Bis zur Abgabe sind es weniger als zehn Tage. Das ist sehr knapp. Konzentrier dich auf die Muss-Aufgaben, und wenn du Unterstützung brauchst, melde dich bei mir.");
    else if(ab&&P.N<30)w.push(`Bis zur Abgabe sind es ${P.N} Tage. Phase 2 wird entsprechend kürzer, Phase 1 und Phase 3 bleiben.`);
    if(ab&&P.N>30)w.push(`Deine Frist ist mehr als einen Monat entfernt. Phase 2 wird länger. Wenn du lieber genau einen Monat möchtest, starte am ${fmtDate(addDays(S.deadline,-29),true)}.`);
    if(ab&&P.N<1)w.length=0;
    prev=diffDays(S.start,ab?S.deadline:S.start)<0?`<p class="tag" style="align-self:flex-start">Die Frist liegt vor dem Start</p>`:`<div class="stack" style="gap:8px"><span class="q" style="margin:0">Dein Monat</span>${phaseBar(null)}${w.map(x=>`<p class="muted" style="margin:0">${x}</p>`).join("")}</div>`}
  return `<div class="hero"><img class="logo" src="icons/icon-192.png" alt=""><div class="eyebrow">30 Tage aus der Blockade</div><h1>Reset &amp; Flow</h1><div class="thread"></div>
  <p class="lead">In einem Monat wird aus dem Durcheinander eine Liste, die du Schritt für Schritt abarbeitest. Mit wenigen klaren Werkzeugen und Hilfe für die Momente, in denen der Kopf blockiert.${TESTV?" <b>Testversion.</b>":""}</p></div>
  <div class="page">
   <div><span class="q">1. Was ist dein Ziel für diesen Monat?</span>
   <div class="bigchoice"><button data-act="goal" data-v="abgeben" aria-pressed="${ab}"><div>Ich will abgeben<span>In einem Monat sicher zur Abgabe</span></div></button>
   <button data-act="goal" data-v="spur" aria-pressed="${sp}"><div>Ich will wieder in die Spur<span>In einem Monat zurück in die Spur</span></div></button></div></div>
   ${ab?`<div class="two">${dateIn(S,"deadline","Meine Abgabefrist","Bei einer Verlängerung änderst du sie später einfach.")}${dateIn(S,"start","Ich starte am")}</div>`:sp?dateIn(S,"start","Mein Starttag","Ab hier läuft dein Monat."):""}
   ${prev}
   <div><span class="q">2. Wo stehst du gerade?<span class="hn">Mehrfachauswahl</span></span><div class="chips">${LAGE.map((l,i)=>`<button class="chip wide" data-act="lage" data-v="${i}" aria-pressed="${S.lage.includes(i)}">${l}</button>`).join("")}</div></div>
   ${S.lage.includes(1)?lageHint():""}
   ${chips(S,"ki",["Ohne KI","Mit KI"],"3. Arbeitest du mit KI?","Das kannst du später ändern.")}
   ${S.ki===1?kiHint():""}
   <button class="btn" data-act="start">Los geht’s</button>
  </div>
  <button class="btn ghost" data-act="demo">Erst ein Beispiel ansehen</button>
  ${installHelp()}
  <p class="muted">Deine Einträge bleiben nur auf diesem Gerät. Es gibt kein Konto und keine Cloud.</p>`}
function lageHint(){return `<div class="offer"><p>Dafür ist dieser Monat knapp. Plane den Teil als ersten Block ein. Wenn du dabei feststeckst, hilft mein MAXQDA-Paket oder ein Coaching.</p><div class="row"><a class="btn small" href="${LINKS.maxqda}" target="_blank" rel="noopener">MAXQDA-Paket</a><a class="btn ghost small" href="${LINKS.gespraech}" target="_blank" rel="noopener">Erstgespräch</a></div></div>`}
function kiHint(){return `<p class="muted" style="margin:0">Was erlaubt ist und wie du KI sauber dokumentierst, steht in meinem kostenlosen <a href="${LINKS.ki}" target="_blank" rel="noopener">KI-Guide für die Abschlussarbeit</a>. In Phase 3 bekommst du dazu eine kurze Checkliste.</p>`}
function installHelp(){return `<details class="help"><summary>Auf den Home-Bildschirm legen</summary><ol><li><b>iPhone (Safari):</b> unten auf das Teilen-Symbol tippen, dann „Zum Home-Bildschirm“.</li><li><b>Android (Chrome):</b> oben rechts auf die drei Punkte, dann „App installieren“.</li><li>Öffne die App danach immer über das neue Symbol. Auf dem iPhone bleiben deine Daten nur so dauerhaft gespeichert.</li></ol></details>`}

// ================= Phasenleiste =================
function phaseBar(date){const P=plan();const w=date?where(date):null;const seg=(ph,d)=>d?`<div class="ph ph${ph} ${w&&w.ph===ph?"on":""}" style="flex:${d}"><b>${ph}</b><span>${phShort(ph)}</span><small>${d} ${d===1?"Tag":"Tage"}</small>${ph===2&&P.buf?`<i class="buf" style="width:${P.buf/d*100}%" title="Puffer"></i>`:""}</div>`:"";
  const mk=w&&!w.pre&&!w.post?`<div class="mk" style="left:calc(${(w.i+.5)/P.N*100}% - 1px)"></div>`:"";
  return `<div class="phbar" aria-label="Phasen">${seg(1,P.p1)}${seg(2,P.p2)}${seg(3,P.p3)}${mk}</div>
  <div class="phdates"><span>${fmtShort(P.st)}</span>${P.buf?`<span class="pb">Puffer ab ${fmtShort(P.bufS)}</span>`:""}<span>${S.goal==="abgeben"?"Abgabe ":""}${fmtShort(P.end)}</span></div>`}
function countdown(){const P=plan(),t=today();const w=where(t);if(w.pre||w.post)return"";
  const r=diffDays(t,P.end);const parts=[];
  if(S.goal==="abgeben"){parts.push(r===0?"<b>Heute ist Abgabe.</b>":`<b>Noch ${r} ${r===1?"Tag":"Tage"}</b> bis zur Abgabe`);if(w.ph<3){const rr=diffDays(t,P.roh);parts.push(rr>0?`Rohfassung fertig in ${rr} ${rr===1?"Tag":"Tagen"} (${fmtShort(P.roh)})`:rr===0?"Heute: Rohfassung fertig":"")}}
  else{parts.push(`<b>Noch ${r} ${r===1?"Tag":"Tage"}</b> in deinem Monat`);if(w.ph<3){const d=diffDays(t,P.p3s);parts.push(`Phase 3 beginnt in ${d} ${d===1?"Tag":"Tagen"}`)}}
  return `<p class="cd">${parts.filter(Boolean).join(" · ")}</p>`}

// ================= Heute =================
function dayObj(date){return S.days[date]||(S.days[date]={pick:[]})}
function pdObj(k){return S.pd[k]||(S.pd[k]={})}
function vHeute(){const date=view.date||today();const isToday=date===today();const w=where(date);
  let nav="";if(view.date&&!isToday)nav=`<div class="row">${back()}<span class="muted">Du siehst ${fmtDate(date,true)}.</span></div>`;
  const head=`${nav}<div class="stack" style="gap:6px">${phaseBar(date)}${isToday?countdown():""}</div>`;
  if(w.pre)return head+`<div class="page"><div class="eyebrow">Bald geht’s los</div><h1>Dein Monat startet ${w.rest===1?"morgen":"am "+fmtDate(plan().st,true)}.</h1><p style="margin:0">Bis dahin musst du nichts tun. Wenn dir schon etwas einfällt, park es mit dem Knopf oben rechts. Es wartet dann in deiner Aufgabenliste.</p>${S.warum?"":ta(S,"warum","Schon mal vorab: Warum ist mir das wichtig?",null,2)}</div>`;
  if(w.post)return head+vEnde();
  const d=dayObj(date);
  const body=w.ph===1?dayP1(w,d):w.ph===2?dayP2(w,d,date):dayP3(w,d);
  const fbN=TESTV&&isToday&&w.i>=plan().N-3&&!S.fb.sent?`<button class="notice" data-act="openSub" data-t="feedback">Testphase: Dein Monat ist fast geschafft. Magst du mir dein Feedback geben?${ICON.r}</button>`:"";
  const prevOpen=isToday&&w.i>0?prevNotice(addDays(date,-1)):"";
  return head+fbN+prevOpen+body+`<button class="notice help2" data-act="go" data-tab="hilfe"><span>${ICON.brain}Was passiert da gerade?<small>Wenn der Kopf blockiert: kurze Karten mit Mini-Übung</small></span>${ICON.r}</button>`}
function prevNotice(y){const w=where(y);if(w.ph!==1)return"";const d=S.days[y];if(!d||d.status==null||d.status===0)return"";return `<button class="notice" data-act="openDay" data-d="${y}">Gestern (${INHALT.p1[w.n-1].t}) ist noch offen. Ansehen${ICON.r}</button>`}
function morning(d){return `<div class="sec">Morgens</div>${scale(d,"e","Wie viel Energie habe ich heute?")}
  <div class="stack" style="gap:10px"><span class="q" style="margin:0">Treibstoff-Check</span>${fuel(d,"schlaf",SCHLAF,"Schlaf")}${fuel(d,"essen",GUT,"Essen")}${fuel(d,"trinken",GUT,"Trinken")}</div>
  ${fuelNote(d)}`}
function fuel(o,key,opts,label){const id=bindObj(o);return `<div class="fuel"><span>${label}</span><div class="chips">${opts.map((t,i)=>`<button class="chip sm" data-b="${id}" data-k="${key}" data-v="${i}" aria-pressed="${o[key]===i}">${t}</button>`).join("")}</div></div>`}
function fuelNote(d){const low=(d.e!=null&&d.e<=3)||d.schlaf===0||d.essen===2||d.trinken===2;return low?`<p class="hint">Dein Tank ist heute eher leer. Erst etwas essen und trinken, dann eine Klärungs- oder Fleißaufgabe. Das ist kein verlorener Tag.</p>`:""}
function dayP1(w,d){const c=INHALT.p1[w.n-1];const o=pdObj("p1d"+w.n);let extra="";
  if(w.n===1)extra=`<div class="fact"><div class="k">Dein Ziel</div><p><b>${S.goal==="spur"?"Ich will wieder in die Spur.":"Ich will abgeben, am "+fmtDate(S.deadline,true)+"."}</b></p></div>${ta(S,"warum","Warum ist mir das wichtig? Ein Satz.",null,2)}${ta(S,"braindump","Mein Braindump","Hier oder auf Papier. Eine Aufgabe pro Zeile macht das Übertragen an Tag 3 leichter.",10,"Kapitel 2: Theorie kürzen\nKapitel 4: Interviews 5 bis 8 auswerten\nLiteraturverzeichnis prüfen\nFrage an Betreuung: Umfang Anhang?")}`;
  if(w.n===2)extra=checklist(o,c.check,"Abhaken");
  if(w.n===3){const lines=bdLines();extra=`<div class="row"><button class="btn sec2" data-act="go" data-tab="fortschritt">Gliederung eintragen</button><button class="btn sec2" data-act="goBulk">Aufgaben übertragen</button></div>${lines.length&&!S.bdDone?`<div class="offer"><p>In deinem Braindump stehen ${lines.length} Zeilen. Soll ich sie als Aufgaben übernehmen? Du kannst danach alles bearbeiten oder löschen.</p><button class="btn small" data-act="importBD" style="align-self:flex-start">${lines.length} Aufgaben übernehmen</button></div>`:""}<p class="muted" style="margin:0">Bisher: ${S.gl.length} Kapitel, ${S.tasks.length} Aufgaben.</p>`}
  if(w.n===4){const noArt=S.tasks.filter(t=>!t.art).length,noM=S.tasks.filter(t=>t.muss==null).length;extra=`${artTable()}<div class="tiles">${tile(noArt,"Aufgaben ohne Art")}${tile(noM,"ohne Muss oder Kann")}</div><button class="btn sec2" data-act="goFilter" data-art="ohne">Unsortierte Aufgaben ansehen</button>`}
  if(w.n===5){const z=zeitCheck();extra=`${zeitCard(z)}<p class="muted" style="margin:0">Mit Stern markiert: ${S.tasks.filter(t=>t.star&&!t.done).length} Aufgaben.</p>${formalCard()}<button class="btn sec2" data-act="go" data-tab="aufgaben">Zur Aufgabenliste</button>`}
  return `<div class="page"><div class="eyebrow">Phase 1 · Aufräumen · Tag ${w.n} von ${w.of}</div><h1>${c.t}</h1><p class="muted" style="margin:0">Heute etwa ${c.dauer}</p>
  <div class="band"><div class="k">Impuls</div><p>${esc(c.impuls)}</p></div>
  ${morning(dayObj(view.date||today()))}
  <div class="sec">Deine Aufgabe heute</div><ol class="steps">${c.schritte.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${extra}
  <div class="sec">Abends</div>${chips(d,"status",["erledigt","teilweise","morgen weiter"],"Wie weit bin ich gekommen?")}
  ${w.n===5&&d.status===0?`<div class="ms"><h1>${c.ende}</h1><p style="margin:0">Alles ist aus deinem Kopf und hat einen Platz. Ab morgen arbeitest du deine Liste ab.</p></div>${offerBox("Du siehst den Wald vor lauter Bäumen nicht?","Lass uns gemeinsam sortieren. In einem Coaching schauen wir auf deine Liste und deinen Zeitplan.")}`:""}</div>`}
function bdLines(){return (S.braindump||"").split("\n").map(x=>x.replace(/^[\s\-–•*·]+/,"").trim()).filter(Boolean)}
function artTable(){return `<div class="arts">${Object.keys(ART).map(k=>`<div class="art a-${k}"><b>${ART[k]}</b><span>${ARTH[k]}</span></div>`).join("")}</div>`}
function dayP2(w,d,date){const open=S.tasks.filter(t=>!t.done);const picks=d.pick.map(id=>S.tasks.find(t=>t.id===id)).filter(Boolean);
  const low=d.e!=null&&d.e<=4;
  const cand=open.filter(t=>!d.pick.includes(t.id)).sort((a,b)=>score(b,low)-score(a,low)).slice(0,view.more?999:8);
  const intro=w.n===1?`<div class="band"><div class="k">Phase 2 beginnt</div><p>Ab heute arbeitest du deine Liste ab. Zwei bis drei Aufgaben am Tag reichen. Die großen Denkaufgaben zuerst.</p></div>`:"";
  return `<div class="page"><div class="eyebrow">Phase 2 · ${phName(2)} · Tag ${w.n} von ${w.of}</div><h1>${w.buf?"Puffertag":fmtDate(date,true)}</h1>
  ${w.buf?`<p style="margin:0">Heute fängst du auf, was liegen geblieben ist. Ist alles erledigt, darfst du schon mit Phase 3 beginnen oder dir frei nehmen.</p>`:""}${intro}
  ${morning(d)}
  <div class="sec">Heute dran</div>
  ${picks.length?`<div class="tlist">${picks.map(t=>taskRow(t,{pick:date})).join("")}</div>`:`<p class="muted" style="margin:0">Wähl zwei bis drei Aufgaben aus deiner Liste.</p>`}
  ${low?`<p class="hint">Wenig Energie heute? Dann passen Klärungs- und Fleißaufgaben besonders gut. Sie stehen unten oben.</p>`:""}
  ${open.length>picks.length?`<details class="help" ${picks.length<2?"open":""}><summary>Aufgaben auswählen</summary><div class="tlist" style="margin-top:8px">${cand.map(t=>`<button class="pickrow" data-act="pick" data-id="${t.id}" data-d="${date}"><span class="plus">+</span>${taskLabel(t)}</button>`).join("")}</div>${!view.more&&open.length-picks.length>8?`<button class="btn ghost small" data-act="more" style="margin-top:8px">Alle ${open.length-picks.length} anzeigen</button>`:""}</details>`:S.tasks.length?`<p class="tag ok" style="align-self:flex-start">Alle Aufgaben erledigt</p>`:`<button class="btn sec2" data-act="go" data-tab="aufgaben">Aufgaben anlegen</button>`}
  ${formalCard()}
  ${ta(d,"liegen","Was bleibt heute bewusst liegen?",null,2)}
  <div class="sec">Abends</div>
  ${chips(d,"std",STUNDEN,"Wie lange habe ich gearbeitet?")}
  ${ta(d,"half","Was hat heute geholfen?",null,2)}
  ${zeitMini()}</div>`}
function score(t,low){let s=0;if(t.star)s+=100;if(t.muss!==false)s+=10;if(low){if(t.art==="k")s+=8;if(t.art==="f")s+=7}else{if(t.art==="d")s+=t.auf==="+"?9:t.auf==="o"?7:5}return s-t.id/1000}
function zeitMini(){const z=zeitCheck();return z.level==="eng"?`<button class="notice warn" data-act="go" data-tab="fortschritt">Zeit-Check: Das wird eng. Ansehen${ICON.r}</button>`:""}
function dayP3(w,d){const sp=S.goal==="spur";const c=(sp?INHALT.p3s:INHALT.p3a)[w.c];const o=pdObj("p3"+(sp?"s":"a")+(w.c+1));let body="";
  if(sp){body=(c.felder||[]).map(([k,l])=>ta(o,k,l,null,k==="plan"?4:2)).join("")+(c.todos?todos(o,c.todos,"Meine nächsten drei Schritte",3):"")+(w.c===2?`<a class="btn sec2" href="${LINKS.gantt}" target="_blank" rel="noopener">Gantt-Vorlagen</a>`:"")+(w.c===1?`<button class="btn sec2" data-act="go" data-tab="fortschritt">Zur Gliederung</button>`:"")}
  else{body=checklist(o,c.check,"Checkliste")+(c.ki&&S.ki===1?checklist(pdObj("p3ki"),c.ki,"KI"):"")+(c.ki&&S.ki!==1?`<p class="muted" style="margin:0">Du arbeitest ohne KI. Prüf trotzdem kurz, ob deine Eigenständigkeitserklärung dazu passt.</p>`:"")}
  const wechsel=!sp&&w.c===0?`<div class="band"><div class="k">Phase 3 beginnt</div><p>Ab jetzt schreibst du nichts Neues mehr. Jetzt machst du gut, was da ist.</p></div>`:"";
  const fin=c.ende?`<div class="ms"><h1>${c.ende}</h1><p style="margin:0">${sp?"Du hast einen Plan, eine Routine und weißt, womit du weitermachst.":"Du hast es geschafft. Gönn dir etwas Schönes."}</p></div>${sp?offerBox("Wie geht es weiter?","Für eine qualitative Abschlussarbeit begleitet dich bald die 12-Wochen-App. Für Promovierende gibt es „Promotion im Fokus“, und für alles andere ein Coaching."):""}`:"";
  const lekt=!sp&&w.c===0?offerBox("Ein zweiter Blick?","Wenn du dir bei einem Kapitel unsicher bist, zum Beispiel beim Methodenteil oder der Diskussion: Ein punktuelles Fachlektorat schaut genau dort hin."):"";
  return `<div class="page"><div class="eyebrow">Phase 3 · ${phName(3)} · Tag ${w.n} von ${w.of}</div><h1>${c.t}</h1>${wechsel}
  ${morning(d)}
  <div class="sec">Schwerpunkt heute</div><ol class="steps">${c.schritte.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${body}${lekt}
  <div class="sec">Abends</div>${chips(d,"std",STUNDEN,"Wie lange habe ich gearbeitet?")}${ta(d,"half","Was hat heute geholfen?",null,2)}${fin}</div>`}
function vEnde(){const st=stats();return `<div class="ms"><div class="eyebrow">Dein Monat ist vorbei</div><h1>${S.goal==="spur"?"Du bist wieder in der Spur.":"Geschafft."}</h1>
  <div class="tiles">${tile(st.done,"Aufgaben erledigt")}${tile(st.days,"Tage eingetragen")}${tile(st.green+"/"+S.gl.length,"Kapitel grün")}${tile(st.h?"ca. "+Math.round(st.h):"–","Stunden")}</div>
  <p style="margin:0">Alles bleibt dir erhalten. Schau gern unter „Fortschritt“ zurück, wie viel du in diesem Monat bewegt hast.</p></div>
  ${offerBox("Wie geht es weiter?","Wenn du für die nächste Etappe Begleitung möchtest: Im kostenlosen Erstgespräch schauen wir, was zu dir passt.")}
  ${TESTV&&!S.fb.sent?`<button class="btn" data-act="openSub" data-t="feedback">Feedback geben</button>`:""}`}
function offerBox(k,t){return `<div class="offer"><div class="k">${k}</div><p>${t}</p><div class="row"><a class="btn small" href="${LINKS.gespraech}" target="_blank" rel="noopener">Erstgespräch anfragen</a></div></div>`}

// ================= Aufgaben =================
function taskLabel(t){const kap=t.kap&&S.gl.find(g=>g.id===t.kap);return `<span class="tl"><b>${esc(t.t)}</b><span class="tags">${t.art?`<i class="a-${t.art}">${ARTK[t.art]}${t.art==="d"&&t.auf?" "+t.auf:""}</i>`:`<i class="none">ohne Art</i>`}${kap?`<i>${esc(kap.t)}</i>`:""}${t.muss===false?`<i class="kann">Kann</i>`:""}</span></span>`}
function taskRow(t,o){o=o||{};const op=view.open===t.id&&!o.pick;
  return `<div class="task ${t.done?"done":""}"><div class="trow"><button class="cbx" aria-label="erledigt" data-act="togTask" data-id="${t.id}" aria-pressed="${t.done}"></button>
  <button class="tbody" data-act="${o.pick?"unpick":"openTask"}" data-id="${t.id}" ${o.pick?`data-d="${o.pick}" aria-label="Aus Heute entfernen"`:""}>${taskLabel(t)}</button>
  <button class="starb" data-act="star" data-id="${t.id}" aria-pressed="${!!t.star}" aria-label="Stern">${ICON.star}</button></div>
  ${op?taskEdit(t):""}</div>`}
function taskEdit(t){const id=bindObj(t);const seg=(k,opts)=>`<div class="chips">${opts.map(([v,l])=>`<button class="chip" data-act="setT" data-id="${t.id}" data-k="${k}" data-v="${v}" aria-pressed="${t[k]===(v==="true"?true:v==="false"?false:v)}">${l}</button>`).join("")}</div>`;
  return `<div class="tedit"><input type="text" aria-label="Aufgabe" data-b="${id}" data-k="t" value="${esc(t.t)}">
  <span class="q">Art</span>${seg("art",Object.keys(ART).map(k=>[k,ART[k]]))}
  ${t.art==="d"?`<span class="q">Aufwand</span>${seg("auf",[["+","+ groß"],["o","o mittel"],["-","– klein"]])}`:""}
  <span class="q">Muss oder Kann?</span>${seg("muss",[["true","Muss"],["false","Kann"]])}
  ${S.gl.length?`<span class="q">Kapitel</span><div class="chips">${S.gl.map(g=>`<button class="chip" data-act="setT" data-id="${t.id}" data-k="kap" data-v="${g.id}" aria-pressed="${t.kap===g.id}">${esc(g.t||"Kapitel")}</button>`).join("")}</div>`:""}
  <div class="row"><button class="btn small" data-act="closeTask">Fertig</button><button class="btn ghost small" data-act="delTask" data-id="${t.id}">Löschen</button></div></div>`}
function typeBars(){const r=Object.keys(ART).map(k=>{const a=S.tasks.filter(t=>t.art===k);return [k,a.filter(t=>t.done).length,a.length]});const no=S.tasks.filter(t=>!t.art);
  return `<div class="bars">${r.map(([k,d,n])=>`<div class="bar"><span>${ARTK[k]}</span><span class="tr"><i class="a-${k}" style="width:${n?d/n*100:0}%"></i></span><span class="n">${d}/${n}</span></div>`).join("")}${no.length?`<div class="bar"><span>ohne Art</span><span class="tr"><i style="width:${no.filter(t=>t.done).length/no.length*100}%"></i></span><span class="n">${no.filter(t=>t.done).length}/${no.length}</span></div>`:""}</div>`}
function vAufgaben(){const F=view.f;const done=S.tasks.filter(t=>t.done).length;
  let ts=S.tasks.slice();
  if(F.st==="offen")ts=ts.filter(t=>!t.done);else if(F.st==="erledigt")ts=ts.filter(t=>t.done);
  if(F.art==="ohne")ts=ts.filter(t=>!t.art||t.muss==null);else if(F.art!=="alle")ts=ts.filter(t=>t.art===F.art);
  if(F.mk==="muss")ts=ts.filter(t=>t.muss!==false);else if(F.mk==="kann")ts=ts.filter(t=>t.muss===false);
  if(F.kap!=="alle")ts=ts.filter(t=>String(t.kap)===F.kap);
  ts.sort((a,b)=>(a.done-b.done)||((b.star?1:0)-(a.star?1:0))||a.id-b.id);
  const fseg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-act="filt" data-k="${k}" data-v="${v}" aria-pressed="${F[k]===v}">${l}</button>`).join("")}</div>`;
  return `<div><div class="eyebrow">Herzstück</div><h1>Meine Aufgaben</h1></div>
  <div class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between"><b>${done} von ${S.tasks.length} erledigt</b><span class="muted">${S.tasks.length?Math.round(done/S.tasks.length*100):0} %</span></div>${typeBars()}</div>
  <div class="card stack" style="gap:10px"><div class="addrow"><input type="text" id="newtask" placeholder="Neue Aufgabe" aria-label="Neue Aufgabe"><button class="btn small" data-act="addTask">Hinzufügen</button></div>
  <details class="sub" ${view.bulk?"open":""}><summary>Mehrere auf einmal einfügen</summary><textarea id="bulk" rows="6" placeholder="Eine Aufgabe pro Zeile"></textarea><button class="btn small" data-act="bulkAdd" style="margin-top:8px">Alle hinzufügen</button></details></div>
  ${bdLines().length&&!S.bdDone?`<div class="offer"><p>In deinem Braindump stehen ${bdLines().length} Zeilen. Als Aufgaben übernehmen?</p><button class="btn small" data-act="importBD" style="align-self:flex-start">Aus meinem Braindump übernehmen</button></div>`:""}
  ${parkBox()}
  ${formalCard(true)}
  <div class="filters">${fseg("st",[["offen","Offen"],["erledigt","Erledigt"],["alle","Alle"]])}${fseg("art",[["alle","Alle"],["d","Denken"],["k","Klären"],["f","Fleiß"],["ohne","Unsortiert"]])}${fseg("mk",[["alle","Muss + Kann"],["muss","Muss"],["kann","Kann"]])}
  ${S.gl.length?`<div class="seg">${[["alle","Alle Kapitel"]].concat(S.gl.map(g=>[String(g.id),g.t||"Kapitel"])).map(([v,l])=>`<button data-act="filt" data-k="kap" data-v="${v}" aria-pressed="${F.kap===v}">${esc(l)}</button>`).join("")}</div>`:""}</div>
  ${ts.length?`<div class="tlist">${ts.map(t=>taskRow(t)).join("")}</div>`:`<p class="muted">${S.tasks.length?"Keine Aufgaben für diesen Filter.":"Noch keine Aufgaben. Leg los mit deinem Braindump."}</p>`}
  <p class="muted">Tippe auf eine Aufgabe, um Art, Aufwand, Kapitel und Muss oder Kann festzulegen. Der Stern holt sie nach oben.</p>`}
function parkBox(){if(!S.park.length)return"";return `<div class="card stack" style="gap:8px;border-left:3px solid var(--gold)"><b>Geparkte Gedanken</b>${S.park.map((p,i)=>`<div class="parkit"><span>${esc(p.t)}<small>${fmtShort(p.d)}</small></span><button class="btn ghost small" data-act="parkToTask" data-i="${i}">Als Aufgabe</button><button class="x" data-act="parkDel" data-i="${i}" aria-label="Löschen">×</button></div>`).join("")}</div>`}
function formalCard(always){const miss=INHALT.formal.filter(f=>!S.tasks.some(t=>t.t===f));if(!miss.length||S.formalOff&&!always)return"";const w=S.started?where(today()):{};
  if(!always&&!(w.ph===2||(w.ph===1&&w.n>=4)))return"";
  return `<details class="help"><summary>Vorschlag: formale Fleißaufgaben schon jetzt einplanen (${miss.length})</summary><p class="muted" style="margin:8px 0">Dann bleiben die letzten fünf Tage frei fürs Überarbeiten.</p><div class="tlist">${miss.map(f=>`<button class="pickrow" data-act="addFormal" data-t="${esc(f)}"><span class="plus">+</span><span class="tl"><b>${esc(f)}</b></span></button>`).join("")}</div><div class="row" style="margin-top:8px"><button class="btn small" data-act="addAllFormal">Alle übernehmen</button>${always?"":`<button class="btn ghost small" data-act="formalOff">Nicht mehr zeigen</button>`}</div></details>`}

// ================= Fortschritt =================
function zeitCheck(){const P=plan(),t=today();const w=where(t);
  const om=S.tasks.filter(x=>!x.done&&x.muss!==false);const kann=S.tasks.filter(x=>!x.done&&x.muss===false).length;
  const u=x=>x.art==="d"?(x.auf==="+"?1:x.auf==="-"?.25:.5):x.art==="f"?.5:x.art==="k"?.1:.3;
  const need=om.reduce((s,x)=>s+u(x),0);
  let from=w.pre||w.ph===1?P.p2s:t;const to=addDays(P.bufS,-1);let avail=w.post||w.ph===3?0:Math.max(0,diffDays(from,to)+1);
  const level=!S.tasks.length?"leer":w.ph===3||w.post?"p3":need>avail?"eng":need>avail*.8?"knapp":"ok";

function zeitCard(z){if(z.level==="leer")return `<div class="fact"><div class="k">Zeit-Check</div><p>Sobald deine Aufgaben in der Liste stehen, schätzt die App hier, ob die Zeit reicht.</p></div>`;

 export(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="reset-und-flow-sicherung-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)},
 import(){const f=$("#imp");f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!Array.isArray(d.tasks))throw 0;S=Object.assign(blank(),d);S.demo=false;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}toast("Sicherung geladen");go("heute")}catch(e){toast("Diese Datei passt nicht.")}};r.readAsText(f.files[0])};f.click()},
 reset(){if(!confirm("Wirklich alles löschen? Das lässt sich nicht rückgängig machen."))return;try{localStorage.removeItem(KEY)}catch(e){}S=blank();go("heute")},
