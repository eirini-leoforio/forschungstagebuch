<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Reset &amp; Flow</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reset &amp; Flow">
<style>
/* Reset & Flow · minimalistischer Stil (Fassung 2, 21.11.2026)
   Eine Schrift (Source Sans 3), drei Größen (13/15/22), eine Akzentfarbe (Rot). */
@font-face{font-family:"Source Sans 3";src:url(fonts/source-sans-3-latin-wght-normal.woff2) format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Source Sans 3";src:url(fonts/source-sans-3-latin-ext-wght-normal.woff2) format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--bg:#FFFFFF;--ink:#1C2423;--mute:#6E7876;--line:#E4E7E6;--soft:#F5F5F3;--red:#A3402F;--redsoft:#F6E9E6;--redmid:#E7C8C1;--reddark:#5C2219;--onink:#FFFFFF;--onred:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--ink:#E9EDEC;--mute:#98A3A1;--line:#2A3231;--soft:#1B2120;--red:#D0674F;--redsoft:#33201B;--redmid:#6A3A30;--reddark:#F0B6A8;--onink:#121615;--onred:#FFFFFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121615;--ink:#E9EDEC;--mute:#98A3A1;--line:#2A3231;--soft:#1B2120;--red:#D0674F;--redsoft:#33201B;--redmid:#6A3A30;--reddark:#F0B6A8;--onink:#121615;--onred:#FFFFFF;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.setup,body.full{padding-bottom:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--red)}
b,strong{font-weight:700}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Kopfzeile */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
header.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
header.top .ttl{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .day{font-size:13px;color:var(--mute);white-space:nowrap}
.hbtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-height:34px;padding:4px 10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.hbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.hbtn.ico{width:34px;padding:0;justify-content:center}
body.setup header.top,body.full header.top{display:none}

/* Seite */
main.wrap{max-width:560px;margin:0 auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:18px}
body.setup main.wrap,body.full main.wrap{min-height:100svh;padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:18px}
.q{display:flex;flex-direction:column;gap:7px}
.k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.k.r{color:var(--red)}
.m{color:var(--mute);font-size:13px}
.lead{color:var(--mute)}
.row{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.row b{font-size:14px}
.btns{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* Knöpfe */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 16px;border-radius:6px;border:1px solid var(--red);background:var(--red);color:var(--onred);font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.btn.o{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn.q2{background:var(--bg);color:var(--mute);border-color:var(--line);font-weight:400;font-size:14px}
.btn.big{min-height:56px;font-size:17px}
.btn.sm{width:auto;min-height:38px;padding:7px 14px;font-size:14px}
.btn svg{width:18px;height:18px;fill:currentColor}
.lnk{background:none;border:0;padding:6px 0;color:var(--red);font-weight:700;font-size:14px;text-align:left}
.lnk.m{color:var(--mute);font-weight:400}
.back{background:none;border:0;padding:4px 0;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}

/* Segmente (eckig) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--bg);border:0;border-left:1px solid var(--line);padding:9px 4px;min-height:42px;font-size:14px;line-height:1.2}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--onink);font-weight:700}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.seg.wrap button{border-top:1px solid var(--line)}
.opts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.opts button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border:0;border-top:1px solid var(--line);padding:11px 12px;min-height:46px}
.opts button:first-child{border-top:0}
.opts button::before{content:"";width:16px;height:16px;border:1.5px solid var(--mute);border-radius:3px;flex:none}
.opts button[aria-pressed="true"]{font-weight:700}
.opts button[aria-pressed="true"]::before{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--bg)}

/* Felder */
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px 12px;font-size:16px;min-height:44px}
textarea{resize:vertical;line-height:1.45}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
label.q>span:first-child{font-weight:700;font-size:14px}

/* Boxen */
.box{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.box.acc{border-color:var(--red);border-left-width:3px}
.box.fill{background:var(--redsoft);border-color:var(--redsoft)}
.box.soft{background:var(--soft);border-color:var(--soft)}
.box .btn{margin-top:2px}

/* Balken */
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.bar.thick{height:14px;border-radius:4px}
.bar.thick i{border-radius:4px}
.typ{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.typ .m{text-align:right}
.bignum{font-size:40px;font-weight:300;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* Monatsleiste */
.mbar{position:relative;display:flex;gap:3px}
.mbar>div{height:8px;border-radius:2px;background:var(--line)}
.mbar>div.past{background:var(--redmid)}
.mbar>div.on{background:var(--red)}
.mlab{display:flex;gap:3px;font-size:12px;color:var(--mute)}
.mlab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlab span.on{color:var(--ink);font-weight:700}

/* Schritte Phase 1/3 */
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps5 button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 2px;font-size:12px;line-height:1.15;color:var(--mute);min-height:44px}
.steps5 button b{display:block;font-size:14px;color:var(--ink)}
.steps5 button.done{background:var(--soft)}
.steps5 button.done b::after{content:" ✓";color:var(--red)}
.steps5 button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
ol.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.list li::marker{color:var(--red);font-weight:700}

/* Einstieg */
.phs{display:flex;flex-direction:column;gap:16px}
.st{display:grid;grid-template-columns:28px 1fr;gap:12px}
.st .n{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.st .n.on{background:var(--red);color:var(--onred);border-color:var(--red)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:18px;height:3px;background:var(--line);border-radius:2px}
.dots i.on{background:var(--red)}
.logo{width:56px;height:56px;border-radius:12px;display:block}

/* Aufgaben */
.tl{display:flex;flex-direction:column}
.task{border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.trow{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.cb{width:22px;height:22px;flex:none;border:1.5px solid var(--ink);border-radius:4px;background:var(--bg);margin-top:1px;padding:0;position:relative}
.cb[aria-pressed="true"]{background:var(--ink)}
.cb[aria-pressed="true"]::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid var(--onink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tb{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.tb .t{overflow-wrap:anywhere}
.tb .s{font-size:12px;color:var(--mute)}
.tb .s .pr{color:var(--red);font-weight:700}
.task.done .tb .t{color:var(--mute);text-decoration:line-through}
.tedit{padding:0 0 14px 34px;display:flex;flex-direction:column;gap:10px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.pick:first-child{border-top:0}
.pick .pl{width:22px;height:22px;flex:none;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-weight:700;color:var(--red)}
.pick[aria-pressed="true"] .pl{background:var(--red);border-color:var(--red);color:var(--onred)}
.grp{display:flex;flex-direction:column}
.addrow{display:flex;gap:8px}.addrow input{flex:1;min-width:0}.addrow .btn{width:auto}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;width:34px;height:34px;flex:none}
details summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--mute);font-weight:400}
details[open] summary::after{content:"–"}
details>*:not(summary){margin-top:10px}

/* Gliederung */
.gl{display:grid;grid-template-columns:1fr 34px;gap:6px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.gl .seg{grid-column:1/-1}
.gl .seg button{padding:6px 8px;min-height:40px;font-size:12px}
.gl .seg button[aria-pressed="true"].a0{background:var(--line);color:var(--ink)}
.gl .seg button[aria-pressed="true"].a1{background:var(--redmid);color:var(--ink)}
.gl .seg button[aria-pressed="true"].a2{background:var(--red);color:var(--onred)}
.glbar{display:flex;gap:3px}
.glbar i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.glbar i.a1{background:var(--redmid)}.glbar i.a2{background:var(--red)}

/* Wochenbalken Statistik */
.days{position:relative;display:flex;align-items:flex-end;gap:7px;height:120px;border-bottom:1px solid var(--line)}
.days>div{flex:1;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.days i{display:block;width:100%;background:var(--redmid);border-radius:3px 3px 0 0}
.days i.ok{background:var(--red)}
.days em{position:absolute;left:-2px;right:-2px;border-top:2px solid var(--ink)}
.dlab{display:flex;gap:7px;font-size:11px;color:var(--mute)}
.dlab span{flex:1;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 10px 8px}
.tile b{display:block;font-size:22px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mute);line-height:1.25;display:block;margin-top:3px}

/* Timer */
.timer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:10px 0}
.ring{width:min(240px,64vw);height:min(240px,64vw)}
.ring .tr{stroke:var(--soft)}.ring .pg{stroke:var(--red);transition:stroke-dashoffset .9s linear}
.ring.pause .pg{stroke:var(--ink)}
.ring text{fill:var(--ink);font-family:"Source Sans 3",sans-serif;font-weight:300;font-variant-numeric:tabular-nums}
.timer .btn{max-width:240px}
.ttask{font-size:13px;color:var(--mute);max-width:280px}

/* Woche */
.week{display:grid;grid-template-columns:26px repeat(7,1fr);gap:3px;font-size:10px;color:var(--mute)}
.week .h{text-align:center;font-weight:700;color:var(--ink);font-size:11px;padding-bottom:2px}
.week .h.now{color:var(--red)}
.week .hrs{position:relative}
.week .hrs span{position:absolute;left:0;transform:translateY(-50%)}
.col{position:relative;background:var(--soft);border-radius:4px}
.ev{position:absolute;left:2px;right:2px;border-radius:3px;font-size:9px;padding:1px 2px;line-height:1.1;overflow:hidden;color:var(--mute)}
.ev.w{background:var(--red);color:var(--onred)}
.ev.w.d{background:var(--reddark);color:var(--bg)}
.ev.t{background:var(--bg);border:1px solid var(--line)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);align-items:center}
.leg i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px}
.blk{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.blk:first-child{border-top:0}
.blk .sw{width:10px;height:10px;border-radius:2px;flex:none;background:var(--red)}
.blk .sw.t{background:var(--bg);border:1px solid var(--mute)}
.blk span{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Hilfe */
.hl{display:flex;flex-direction:column}
.hl button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 0}
.hl button:first-child{border-top:0}
.hl button span{flex:1;display:flex;flex-direction:column;font-size:16px}
.hl button small{font-size:13px;color:var(--mute)}
.hl button::after{content:"›";color:var(--mute);font-size:20px}
.say{font-size:17px;font-weight:600;border-left:3px solid var(--red);padding-left:12px}
.foot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.foot a,.foot button{color:var(--mute);background:none;border:0;padding:4px 0;text-decoration:none;font-size:13px}
.foot a:hover,.foot button:hover{color:var(--ink)}
.tool{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px}
.tool:first-child{border-top:0}
.tool .m b{color:var(--red)}

/* Untere Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{background:none;border:0;padding:9px 0 10px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:7px;min-height:56px}
nav.tabs button::before{content:"";width:20px;height:2px;border-radius:2px;background:currentColor}
nav.tabs button[aria-current="page"]{color:var(--red);font-weight:700}
body.setup nav.tabs,body.full nav.tabs,body.writing nav.tabs{display:none}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--onink);padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{background:var(--redsoft);border-radius:6px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.demo .btn{width:auto;min-height:34px;padding:5px 10px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ckrow{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;align-items:flex-start}
.ckrow:first-child{border-top:0}
.ckrow[aria-pressed="true"]>span:last-child{color:var(--mute);text-decoration:line-through}
button.box{width:100%;font-size:15px;color:var(--ink)}

/* Info-Knopf und Pop-up */
.ib{display:inline-grid;place-items:center;width:28px;height:24px;margin:-4px -4px -4px 2px;padding:0;border:0;background:none;vertical-align:middle}
.ib::before{content:"i";width:17px;height:17px;border-radius:50%;border:1.5px solid var(--mute);color:var(--mute);font-size:11px;font-weight:700;line-height:14px;text-align:center;text-transform:none;letter-spacing:0;font-family:Georgia,serif;font-style:italic}
h1 .ib::before{width:19px;height:19px;line-height:16px;font-size:12px}
.pop{position:fixed;inset:0;z-index:20;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.pop[hidden]{display:none}
.pop .sh{background:var(--bg);width:100%;max-width:560px;border-radius:12px 12px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.pop p{white-space:pre-line}
</style>
</head><body>
<header class="top"><div class="in">
  <span class="ttl" id="ttl">Heute</span><span class="day" id="day"></span>
  <button class="hbtn" id="parkbtn" aria-label="Gedanken parken"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Gedanken parken</button>
  <button class="hbtn ico" id="ichbtn" aria-label="Ich und Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg></button>
</div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Bereiche"><div class="in"></div></nav>
<div class="toast" id="toast" role="status"></div>
<div class="pop" id="pop" hidden><div class="sh" role="dialog" aria-modal="true"><b></b><p></p><button class="btn o" id="popx">Verstanden</button></div></div>
<script>
// Fassung 2 (21.11.): Karten mit Kurztitel h, Kategorie kat, Übungsdauer min, fokus=Übung startet Fokuszeit
// Inhalte „Reset & Flow“ (früher Klarheit statt Chaos) (kein Forschungstagebuch, eigene App) · Fassung 1 vom 19.11.2026 (aus Konzept Fassung 3)
// Texte mit [Mascha] sind Platzhalter für ihre eigenen Impulse.
const INHALT={
 // ---------- Phase 1: Aufräumen ----------
 p1:[
  {t:"Braindump",dauer:"45 bis 60 Minuten",
   impuls:"Chaos ist kein Zeichen, dass du es nicht kannst. Es ist ein Zeichen, dass zu viel gleichzeitig in deinem Kopf war. Heute holen wir alles heraus, in den nächsten Tagen räumen wir auf.",
   schritte:["Kurz ankommen: Prüf dein Ziel und deine Frist oben und schreib in einem Satz auf, warum dir das wichtig ist.","Stell einen Timer auf 30 Minuten. Geh Kapitel für Kapitel durch und schreib alles auf, was noch offen ist. Nicht sortieren, nicht bewerten.","Danach alles Übrige: Formales, Organisation, Fragen an die Betreuung, der Abgabeweg.","Fertig ist der Braindump, wenn dir zehn Sekunden lang nichts mehr einfällt."],
   feld:"braindump"},

<script>

// Reset & Flow · Fassung 2 (21.11.2026): minimalistischer Umbau
// Morgen-Check-in mit Anweisung, Fokuszeit (zählt hoch), Fortschritt mit Gesamtbalken, Hilfe-Seite, optionaler Wochenplan, Einführung.

const TESTV=true;
const LINKS={gespraech:"https://drmaschakoerner.de/erstgespraech/#formular",gantt:"https://drmaschakoerner.de/gantt-vorlagen/",sos:"https://drmaschakoerner.de/schnelle-hilfe/",ki:"https://drmaschakoerner.de/ki-in-der-abschlussarbeit/",maxqda:"https://drmaschakoerner.mytentary.com/p/Bvukys",nl:"https://drmaschakoerner.de/#newsletter"};

const SCHLAF=["wenig","okay","gut"];
const ZEIT=["1 Std.","2 Std.","3 Std.","4+"];
const ZEITL=["1 Stunde","2 Stunden","3 Stunden","4 Stunden oder mehr"];
const ZIELMIN=[60,120,180,240];
const TEST_OPT=["trifft nicht zu","eher nicht","eher ja","voll"];
const R5=["1","2","3","4","5"];

const FOKUS=25,PAUSE=5;
const SHORT={p1:["Braindump","Aufräumen","Übertragen","Sortieren","Planen"],p3a:["Lesen","Überarb. 1","Überarb. 2","Formalia","Abgabe"],p3s:["Routine","Gliederung","Zeitplan","Betreuung","Weiter"]};
const CRISIS="Wenn du über längere Zeit erschöpft bist oder in einer Krise steckst, ist ärztliche oder psychologische Hilfe der richtige Weg, zum Beispiel die psychologische Beratung deiner Hochschule oder die Telefonseelsorge (0800 111 0 111, kostenlos, rund um die Uhr).";

function blank(){return {v:2,started:false,goal:null,start:today(),deadline:"",lage:[],ki:null,warum:"",braindump:"",bdDone:false,tasks:[],nid:1,park:[],gl:[],gid:1,days:{},pd:{},steps:{},sessions:[],timer:null,woche:false,blocks:[],bid:1,formalOff:false,fb:{},test:{a:{}},demo:false,created:today()}}
let S=blank();let storageOK=true;
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S=Object.assign(blank(),d);if(d.v!==2){S.v=2;S.days={};S.test={a:{}}}}}catch(e){storageOK=false}}
let saveT=null;
function save(){if(S.demo)return;clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
function saveNow(){if(S.demo)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

// ================= Datum =================
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function fmtDate(s,long){if(!s)return"";const d=new Date(s+"T12:00:00");return d.toLocaleDateString("de-DE",long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"})}
function fmtShort(s){return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"})}
function diffDays(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function wday(s){return (new Date(s+"T12:00:00").getDay()+6)%7}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function n1(v){return (Math.round(v*10)/10).toString().replace(".",",")}
function hm(min){min=Math.round(min);if(min<60)return min+" Min.";const h=Math.floor(min/60),m=min%60;return h+" Std."+(m?" "+m+" Min.":"")}
// Zeiten vor 5 Uhr zählen zur Nacht danach (Raster 5 bis 1 Uhr)
function tmin(t){const [h,m]=(t||"0:0").split(":").map(Number);const x=h*60+m;return x<300?x+1440:x}
function tfmt(t){const [h,m]=t.split(":");return +h+(m!=="00"?":"+m:"")}
const $=s=>document.querySelector(s);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2200)}
function pl(n,a,b){return n===1?a:b}

// ================= Der Monat =================
function plan(){const st=S.start||today();const end=S.goal==="abgeben"&&S.deadline?S.deadline:addDays(st,29);
  const N=Math.max(1,diffDays(st,end)+1);const p3=Math.min(5,N),p1=Math.min(5,Math.max(0,N-p3)),p2=N-p3-p1,buf=Math.min(2,p2);
  return {st,end,N,p1,p2,p3,buf,p2s:addDays(st,p1),p3s:addDays(st,p1+p2),roh:addDays(st,p1+p2-1),bufS:addDays(st,p1+p2-buf)}}
function where(date){const P=plan();const i=diffDays(P.st,date);
  if(i<0)return {pre:true,rest:-i,i};if(i>=P.N)return {post:true,i};
  if(i<P.p1)return {ph:1,n:i+1,of:P.p1,i};
  if(i<P.p1+P.p2){const n=i-P.p1+1;return {ph:2,n,of:P.p2,buf:n>P.p2-P.buf,i}}
  const n=i-P.p1-P.p2+1;return {ph:3,n,of:P.p3,c:n-1+(5-P.p3),i}}
function phName(ph){return ph===1?"Reset":ph===2?"Flow":(S.goal==="spur"?"In die Spur":"Abschluss")}
function stepsOf(ph){return ph===1?INHALT.p1:(S.goal==="spur"?INHALT.p3s:INHALT.p3a)}
function stepKey(ph,i){return ph===1?"p1_"+i:(S.goal==="spur"?"p3s_":"p3a_")+i}

// ================= Info-Knopf =================
let INFOS=[];
function info(txt,title){INFOS.push([title||"Info",txt]);return `<button class="ib" data-act="info" data-i="${INFOS.length-1}" aria-label="Info${title?": "+esc(title):""}"></button>`}
function kI(label,txt,cls){return `<span class="k ${cls||""}">${label}${info(txt,label.replace(/<[^>]+>/g,""))}</span>`}

// ================= Bindungen =================
let BIND={},bindId=0;
function bindObj(o){const id="o"+(++bindId);BIND[id]=o;return id}
function ta(o,key,label,hint,rows,ph){const id=bindObj(o);const fid="f_"+id+"_"+key;return `<label class="q" for="${fid}"><span>${label}</span>${hint?`<span class="m">${hint}</span>`:""}<textarea id="${fid}" rows="${rows||2}" placeholder="${esc(ph||"")}" data-b="${id}" data-k="${key}">${esc(o[key])}</textarea></label>`}
function inp(o,key,label,ph){const id=bindObj(o);const fid="f_"+id+"_"+key;return `<label class="q" for="${fid}"><span>${label}</span><input type="text" id="${fid}" placeholder="${esc(ph||"")}" data-b="${id}" data-k="${key}" value="${esc(o[key])}"></label>`}
function dateIn(o,key,label,hint){const id=bindObj(o);const fid="f_"+id+"_"+key;return `<label class="q" for="${fid}"><span>${label}</span>${hint?`<span class="m">${hint}</span>`:""}<input type="date" id="${fid}" data-b="${id}" data-k="${key}" data-re="1" value="${esc(o[key])}"></label>`}
// Auswahl: kurze Optionen als eckige Segmente, lange als Liste
function choice(o,key,opts,label,hint,wrap,inf){const id=bindObj(o);const short=opts.length<=5&&opts.every(t=>t.length<=12);
  const b=opts.map((t,i)=>`<button data-b="${id}" data-k="${key}" data-v="${i}" aria-pressed="${o[key]===i}">${t}</button>`).join("");
  return `<div class="q">${label?(inf?kI(label,inf):`<span class="k">${label}</span>`):""}<div class="${short?"seg"+(wrap?" wrap":""):"opts"}" role="group"${label?` aria-label="${esc(label)}"`:""}>${b}</div>${hint||""}</div>`}
function checklist(o,items){const id=bindObj(o);return `<div class="tl">${items.map((t,i)=>`<button class="trow ckrow" data-b="${id}" data-ck="${i}" aria-pressed="${!!o[i]}"><span class="cb" aria-pressed="${!!o[i]}"></span><span>${esc(t)}</span></button>`).join("")}</div>`}
function todos(o,key,label,n){if(!Array.isArray(o[key]))o[key]=[];while(o[key].length<n)o[key].push({t:"",d:false});const id=bindObj(o[key]);
  return `<div class="q"><span class="k">${label}</span>${o[key].map((t,i)=>`<div class="trow" style="align-items:center"><button class="cb" aria-label="erledigt" data-b="${id}" data-i="${i}" data-todo="1" aria-pressed="${!!t.d}"></button><input type="text" aria-label="${label} ${i+1}" data-b="${id}" data-i="${i}" data-todot="1" value="${esc(t.t)}"></div>`).join("")}</div>`}

document.addEventListener("input",e=>{const t=e.target;const o=BIND[t.dataset.b];if(!o)return;
  if(t.dataset.todot){o[+t.dataset.i].t=t.value}else if(t.dataset.k){o[t.dataset.k]=t.value}save()});

document.addEventListener("focusout",e=>{if(e.target.matches("textarea,input[type=text]"))document.body.classList.remove("writing")});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newtask"){e.preventDefault();ACT.addTask()}});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  const o=BIND[t.dataset.b];
  if(o){

});

const SUBT={pick:"Aufgaben wählen",karte:"Hilfe",test:"Selbsttest",werkzeug:"Werkzeugkasten",park:"Gedanken parken",feedback:"Feedback",nachtragen:"Zeit nachtragen"};

function installHelp(){return `<details class="box"><summary>Auf den Home-Bildschirm legen</summary><ol class="list"><li><b>iPhone (Safari):</b> unten auf das Teilen-Symbol, dann „Zum Home-Bildschirm“.</li><li><b>Android (Chrome):</b> oben rechts auf die drei Punkte, dann „App installieren“.</li><li>Öffne die App danach immer über das neue Symbol. Auf dem iPhone bleiben deine Daten nur so dauerhaft gespeichert.</li></ol></details>`}
const TOUR=[
 ["Morgens · 1 Minute","Check-in","Energie, Schlaf und Zeit antippen. Die App sagt dir, welche Art von Aufgaben heute passt und wie viele. Welche genau, wählst du selbst, weil nur du die Zusammenhänge kennst."],
 ["Arbeiten","Fokuszeit","Ein Knopf startet die Uhr. Der Kreis zeigt 25 Minuten, danach 5 Minuten Pause. Die Uhr läuft weiter, bis du stoppst. Jede Minute zählt für deine Statistik."],

function monthBar(date){const P=plan();const w=date?where(date):null;
  const seg=(ph,d)=>d?`<div class="${w&&w.ph===ph?"on":w&&(w.post||w.ph>ph)?"past":""}" style="flex:${d}"></div>`:"";
  const lab=(ph,d)=>d?`<span class="${w&&w.ph===ph?"on":""}" style="flex:${d}">${phName(ph)}</span>`:"";

  <div class="row m"><span>${fmtShort(P.st)}</span><span>${S.goal==="abgeben"?"Abgabe ":""}${fmtShort(P.end)}</span></div>`}
function countdown(){const P=plan(),t=today();const r=diffDays(t,P.end);
  return S.goal==="abgeben"?(r===0?"Heute ist Abgabe":`${r} ${pl(r,"Tag","Tage")} bis zur Abgabe`):`${r} ${pl(r,"Tag","Tage")} bis Monatsende`}

// ================= Zeit =================
function minsOn(d){return S.sessions.filter(s=>s.d===d).reduce((a,s)=>a+s.min,0)}
function blocksOn(d){return S.woche?S.blocks.filter(b=>b.wd===wday(d)).sort((a,b)=>tmin(a.s)-tmin(b.s)):[]}
function workBlocksOn(d){return blocksOn(d).filter(b=>b.typ==="w")}
function goalOn(d){const x=S.days[d];if(x&&x.zeit!=null)return ZIELMIN[x.zeit];const wb=workBlocksOn(d);return wb.length?wb.reduce((a,b)=>a+tmin(b.e)-tmin(b.s),0):0}

// ================= Heute =================
function dayObj(date){return S.days[date]||(S.days[date]={pick:[]})}
function pdObj(k){return S.pd[k]||(S.pd[k]={})}
// d.e ist der Index 0–4 (angezeigt 1–5)
function lvl(d){if(d.e==null)return 1;const E=d.e+1;if(E<=2||(E===3&&d.schlaf===0))return 0;if(E>=4&&d.schlaf!==0)return 2;return 1}
function anweisung(d,w){
  if(d.e==null||d.schlaf==null||d.zeit==null)return null;
  const L=lvl(d);const head=["Wenig Energie","Mittlere Energie","Gute Energie"][L]+", "+ZEITL[d.zeit]+".";
  if(w.ph!==2){const c=stepsOf(w.ph)[curStep(w)];const t=`Heute steht „${c.t}“ an${c.dauer?", etwa "+c.dauer:""}.`;
    return {head,text:t+(L===0?" Mach heute nur den ersten Teil. Der Rest darf morgen folgen.":"")+(d.schlaf===0?" Erst etwas essen und trinken.":""),nd:0,nr:0}}
  const T=[2,3,3,4][d.zeit];const openD=S.tasks.some(t=>!t.done&&t.art==="d");
  let nd,nr,text;
  if(L===0){nd=0;nr=Math.min(T,3);text=`Heute keine große Denkaufgabe. Wähle ${nr} Klärungs- oder Fleißaufgaben. Das ist kein verlorener Tag.`}
  else if(!openD){nd=0;nr=T;text=`Wähle ${T} Aufgaben aus deiner Liste.`}
  else{nd=L===2&&d.zeit>=2?2:1;nr=T-nd;text=`Wähle ${nd} ${pl(nd,"Denkaufgabe","Denkaufgaben")} für den Anfang${L===2?", solange du frisch bist,":""} und ${nr} Fleiß- oder ${pl(nr,"Klärungsaufgabe","Klärungsaufgaben")} für danach.`}
  if(d.schlaf===0&&L!==0)text+=" Wenig Schlaf: Plan eine echte Pause ein.";
  return {head,text,nd,nr,n:nd+nr}}
function curStep(w){const list=stepsOf(w.ph);const def=w.ph===1?w.n-1:w.c;return view.step!=null&&view.step<list.length?view.step:def}
function vHeute(){const date=today();const w=where(date);
  if(w.pre)return `<h1>Dein Monat startet ${w.rest===1?"morgen":"am "+fmtDate(plan().st,true)}.</h1><p>Bis dahin musst du nichts tun. Wenn dir schon etwas einfällt, park es mit „Gedanken parken“ oben. Es wartet dann in deiner Aufgabenliste.</p>${ta(S,"warum","Schon mal vorab: Warum ist mir das wichtig?",null,2)}`;

  const A=anweisung(d,w);
  const top=`<div class="q"><div class="row"><span class="k">Heute gearbeitet</span><b>${done} ${goal?"von "+goal+" ":""}Min.</b></div><div class="bar"><i style="width:${goal?Math.min(100,done/goal*100):done?100:0}%"></i></div></div>
  ${run||`<button class="btn big" data-act="startFokus"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>Fokuszeit starten</button>`}`;

  <div class="btns"><button class="btn q2" data-act="go" data-tab="hilfe">Kopf blockiert? Kurze Hilfe</button><button class="lnk m" data-act="sub" data-t="nachtragen" style="align-self:center">Ohne Timer gearbeitet? Zeit nachtragen</button></div>`}
function vCheckin(d,w){const h=new Date().getHours();const wb=workBlocksOn(today());
  if(d.zeit==null&&wb.length){const m=wb.reduce((a,b)=>a+tmin(b.e)-tmin(b.s),0);d.zeit=Math.max(0,Math.min(3,Math.round(m/60)-1))}

  ${choice(d,"zeit",ZEIT,"Zeit für die Arbeit heute",wb.length?`<p class="m">Laut Wochenplan: ${wb.map(b=>tfmt(b.s)+" bis "+tfmt(b.e)+" Uhr").join(", ")}</p>`:"")}
  ${A?`<div class="box acc"><span class="k r">Deine Anweisung für heute</span><p><b>${A.head}</b> ${A.text}</p></div>`:`<p class="m">Tippe alle drei an.</p>`}

function dayStep(w,d){const list=stepsOf(w.ph);const i=curStep(w);const c=list[i];const key=stepKey(w.ph,i);const sp=S.goal==="spur";

  :`<div class="q"><div class="row">${kI("Aufgaben gesamt","Tippe auf eine Aufgabe, um Art, Aufwand, Kapitel und Muss oder Kann festzulegen. Denkaufgaben brauchen einen klaren Kopf, Klärungsaufgaben sind in 10 bis 15 Minuten erledigt, Fleißaufgaben sind viel Arbeit mit wenig Kopf. „Zuerst“ holt eine Aufgabe nach oben.")}<b>${d} von ${n} · ${p} %</b></div><div class="bar thick"><i style="width:${p}%"></i></div></div>`}
function typeBars(){const r=Object.keys(ART).map(k=>{const a=S.tasks.filter(t=>t.art===k);return [ARTK[k],a.filter(t=>t.done).length,a.length]});const no=S.tasks.filter(t=>!t.art);if(no.length)r.push(["ohne Art",no.filter(t=>t.done).length,no.length]);
  return `<div class="q">${r.map(([l,d,n])=>`<div class="typ"><span>${l}</span><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><span class="m">${d}/${n}</span></div>`).join("")}</div>`}
function vAufgaben(){const F=view.f;
  let ts=S.tasks.slice();
  if(F.st==="offen")ts=ts.filter(t=>!t.done);else if(F.st==="erledigt")ts=ts.filter(t=>t.done);
  if(F.art==="ohne")ts=ts.filter(t=>!t.art||t.muss==null);else if(F.art!=="alle")ts=ts.filter(t=>t.art===F.art);
  ts.sort((a,b)=>(a.done-b.done)||((b.star?1:0)-(a.star?1:0))||a.id-b.id);
  const fseg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-act="filt" data-k="${k}" data-v="${v}" aria-pressed="${F[k]===v}">${l}</button>`).join("")}</div>`;
  return `${totalBox()}
  <div class="q"><div class="addrow"><input type="text" id="newtask" placeholder="Neue Aufgabe" aria-label="Neue Aufgabe"><button class="btn" data-act="addTask">Hinzufügen</button></div>
  <details ${view.bulk?"open":""}><summary>Mehrere auf einmal einfügen</summary><textarea id="bulk" rows="6" placeholder="Eine Aufgabe pro Zeile"></textarea><button class="btn o" data-act="bulkAdd">Alle hinzufügen</button></details></div>
  ${bdLines().length&&!S.bdDone?`<div class="box fill"><p>In deinem Braindump stehen ${bdLines().length} Zeilen. Als Aufgaben übernehmen?</p><button class="btn" data-act="importBD">Aus meinem Braindump übernehmen</button></div>`:""}
  ${parkBox()}${formalCard(true)}
  <div class="q">${fseg("st",[["offen","Offen"],["erledigt","Erledigt"],["alle","Alle"]])}${fseg("art",[["alle","Alle"],["d","Denken"],["k","Klären"],["f","Fleiß"],["ohne","Unsortiert"]])}</div>
  ${ts.length?`<div class="tl">${ts.map(t=>taskRow(t)).join("")}</div>`:`<p class="m">${S.tasks.length?"Keine Aufgaben für diesen Filter.":"Noch keine Aufgaben. Leg los mit deinem Braindump."}</p>`}`}
function parkBox(){if(!S.park.length)return"";return `<div class="box acc">${kI("Geparkte Gedanken · "+S.park.length,"Tippe die Art an, dann rückt der Gedanke als Aufgabe in deine Liste. Mit × löschst du ihn.","r")}${S.park.map((p,i)=>`<div class="q" style="padding-top:8px;border-top:1px solid var(--line)"><div class="row" style="align-items:center"><span style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(p.t)} <span class="m">· ${fmtShort(p.d)}</span></span><button class="x" data-act="parkDel" data-i="${i}" aria-label="Löschen">×</button></div><div class="seg">${Object.keys(ART).map(k=>`<button data-act="parkToTask" data-i="${i}" data-art="${k}">${ARTK[k]}</button>`).join("")}<button data-act="parkToTask" data-i="${i}" data-art="">weiß nicht</button></div></div>`).join("")}</div>`}
function formalCard(always){const miss=INHALT.formal.filter(f=>!S.tasks.some(t=>t.t===f));if(!miss.length||S.formalOff&&!always)return"";
  return `<details class="box"><summary>Vorschlag: formale Fleißaufgaben (${miss.length})</summary><p class="m">Wenn du sie schon jetzt einplanst, bleiben die letzten fünf Tage frei fürs Überarbeiten.</p><div class="grp">${miss.map(f=>`<button class="pick" data-act="addFormal" data-t="${esc(f)}"><span class="pl">+</span><span>${esc(f)}</span></button>`).join("")}</div><button class="btn o" data-act="addAllFormal">Alle übernehmen</button></details>`}

// ================= Fortschritt =================
function zeitCheck(){const P=plan(),t=today();const w=where(t);
  const om=S.tasks.filter(x=>!x.done&&x.muss!==false);const kann=S.tasks.filter(x=>!x.done&&x.muss===false).length;
  const u=x=>x.art==="d"?(x.auf==="+"?1:x.auf==="-"?.25:.5):x.art==="f"?.5:x.art==="k"?.1:.3;
  const need=om.reduce((s,x)=>s+u(x),0);
  const from=w.pre||w.ph===1?P.p2s:t;const to=addDays(P.bufS,-1);const avail=w.post||w.ph===3?0:Math.max(0,diffDays(from,to)+1);
  const level=!S.tasks.length?"leer":w.ph===3||w.post?"p3":need>avail?"eng":need>avail*.8?"knapp":"ok";
  return {need,avail,level,open:om.length,kann}}
function zeitBox(){const z=zeitCheck();
  if(z.level==="leer")return `<div class="box"><span class="k">Zeit-Check</span><p class="m">Sobald deine Aufgaben in der Liste stehen, schätzt die App hier, ob die Zeit reicht.</p></div>`;
  if(z.level==="p3")return `<div class="box"><span class="k">Zeit-Check</span><p>Du bist im Abschluss. Offen sind noch ${z.open} Muss-Aufgaben. Jetzt zählt Überarbeiten, nicht Neues.</p></div>`;
  const tx={ok:["Das passt.","Nach grober Schätzung reicht deine Zeit für die Muss-Aufgaben."],knapp:["Knapp, aber machbar.","Bleib bei den Muss-Aufgaben und nutz die Puffertage nur, wenn es nötig ist."],eng:["Das wird eng.","Sortier noch einmal ehrlich: Was ist wirklich Muss? Kann-Aufgaben schiebst du ans Ende. Sprich früh mit deiner Betreuung über eine Verlängerung, falls es sie gibt."]}[z.level];
  return `<div class="box ${z.level==="eng"?"acc":""}">${kI("Zeit-Check","Grobe Schätzung: große Denkaufgabe 1 Tag, mittlere Denkaufgabe und Fleißaufgabe je ½ Tag, kleine ¼ Tag, Klärungsaufgaben 10 pro Tag."+(z.kann?" "+z.kann+" Kann-Aufgaben sind nicht mitgezählt.":""),z.level==="eng"?"r":"")}<p><b>${tx[0]}</b> ${tx[1]}</p>
  <div class="two">${tile((Math.round(z.need*2)/2+"").replace(".",","),"Arbeitstage für offene Muss-Aufgaben")}${tile(z.avail,"Arbeitstage bis zum Puffer")}</div>
  ${z.level==="eng"?`<a class="btn o" href="${LINKS.gespraech}" target="_blank" rel="noopener">Endspurt-Coaching: Erstgespräch anfragen</a>`:""}</div>`}
function vFortschritt(){const t=today();const w=where(t);const P=plan();
  const last=Array.from({length:7},(_,i)=>addDays(t,i-6));const mx=Math.max(60,...last.map(d=>Math.max(minsOn(d),goalOn(d))));
  const chart=`<div class="days">${last.map(d=>{const m=minsOn(d),g=goalOn(d);return `<div title="${fmtDate(d)}: ${m} Min.">${g?`<em style="bottom:${g/mx*100}%"></em>`:""}<i class="${g&&m>=g?"ok":""}" style="height:${m/mx*100}%"></i></div>`}).join("")}</div><div class="dlab">${last.map(d=>`<span>${WD[wday(d)]}</span>`).join("")}</div>`;
  const tot=S.sessions.reduce((a,s)=>a+s.min,0),blocks=S.sessions.filter(s=>!s.manual).length;
  const past=Math.max(0,Math.min(P.N,diffDays(P.st,t)+1));const daysOn=new Set(S.sessions.map(s=>s.d)).size;
  const wk=addDays(t,-wday(t));const wkMin=Array.from({length:7},(_,i)=>minsOn(addDays(wk,i))).reduce((a,b)=>a+b,0);
  const ci=last.map(d=>S.days[d]).filter(x=>x&&x.e!=null);const eAvg=ci.length?ci.reduce((a,x)=>a+x.e+1,0)/ci.length:null;
  const sl=ci.filter(x=>x.schlaf!=null);const slMode=sl.length?SCHLAF[[0,1,2].sort((a,b)=>sl.filter(x=>x.schlaf===b).length-sl.filter(x=>x.schlaf===a).length)[0]]:null;
  const n=S.gl.length,cnt=[0,1,2].map(a=>S.gl.filter(g=>g.a===a).length);
  return `${totalBox(true)}${typeBars()}<hr>
  <div class="q"><span class="k">Dein Monat</span>${monthBar(t)}<p class="m">${w.pre?"Startet am "+fmtDate(P.st,true):w.post?"Vorbei":countdown()}</p></div><hr>
  <div class="q">${kI("Arbeitszeit · letzte 7 Tage","Jeder Balken zeigt deine Fokuszeit an einem Tag. Der schwarze Strich ist dein Ziel aus dem Morgen-Check-in. Hast du es erreicht, wird der Balken kräftig rot.")}${chart}</div>
  <div class="tiles">${tile(n1(tot/60),"Stunden gesamt")}${tile(blocks,"Fokusblöcke")}${tile(daysOn+"/"+past,"Tage dran")}</div>
  <p class="m">Diese Woche: ${hm(wkMin)}${eAvg!=null?` · Energie im Schnitt ${n1(eAvg)} von 5`:""}${slMode?` · Schlaf meist ${slMode}`:""}</p><hr>
  <div class="q">${kI("Gliederung · "+cnt[2]+" von "+n+" fertig","Trag deine Kapitel ein und gib jedem einen Stand. Im Balken ist grau offen, hell begonnen und rot fertig.")}
  ${n?`<div class="glbar">${S.gl.map(g=>`<i class="a${g.a}"></i>`).join("")}</div>`:""}
  ${S.gl.map((g,i)=>{const id=bindObj(g);return `<div class="gl"><input type="text" aria-label="Kapitel ${i+1}" placeholder="z. B. 2 Theorie" data-b="${id}" data-k="t" value="${esc(g.t)}"><button class="x" data-act="glDel" data-i="${i}" aria-label="Kapitel entfernen">×</button><div class="seg">${STAND.map((l,a)=>`<button class="a${a}" data-act="amp" data-i="${i}" data-v="${a}" aria-pressed="${g.a===a}">${l}</button>`).join("")}</div></div>`}).join("")}
  <button class="btn o" data-act="glAdd">+ Kapitel</button></div><hr>
  ${zeitBox()}`}

  const plannedMin=S.blocks.filter(b=>b.typ==="w").reduce((a,b)=>a+tmin(b.e)-tmin(b.s),0);const wkMin=ds.reduce((a,d)=>a+minsOn(d),0);

  <div class="box"><span class="k">Neuer Block</span>

  <div class="two"><label class="q"><span class="m">von</span><input type="time" data-b="${id}" data-k="s" value="${o.s}"></label><label class="q"><span class="m">bis</span><input type="time" data-b="${id}" data-k="e" value="${o.e}"></label></div>

 redoCheckin(){const d=dayObj(today());d.ci=false;go("heute")},
 step(t){view.step=+t.dataset.v;render()},
 stepDone(t){const k=t.dataset.k;S.steps[k]=!S.steps[k];save();keepScroll(render);if(S.steps[k])toast("Schritt erledigt.")},
 startFokus(){const p=todayPicks();startTimer("f",{task:p.length?p[0].id:null})},
 timerFor(t){if(S.timer&&S.timer.mode==="f"){S.timer.task=+t.dataset.id;save();sub("timer");return}startTimer("f",{task:+t.dataset.id})},
 openTimer(){sub("timer")},
 timerHide(){go("heute")},
 stopFokus(){const T=S.timer;const min=Math.floor(elapsed()/60000);const d=iso(new Date(T.start));S.timer=null;
  if(min<1){saveNow();toast("Unter einer Minute, nicht gezählt.");go("heute");return}
  S.sessions.push({d,min,task:T.task||null,at:T.start});saveNow();sub("done",{min,task:T.task})},
 startPause(){startTimer("p")},
 stopPause(){S.timer=null;saveNow();go("heute")},
 uebung(t){const k=INHALT.karten.find(x=>x.id===t.dataset.n);if(k.fokus)startTimer("f",{len:k.min});else startTimer("u",{len:k.min,card:k.id})},
 stopUebung(){S.timer=null;saveNow();toast("Gut gemacht.");go("heute")},
 doneTask(t){const x=findT(t.dataset.id);x.done=true;x.doneAt=today();save();doneToast();go("heute")},
 addManual(){const o=view.sub;const m=[15,30,45,60,90,120][o.m];S.sessions.push({d:addDays(today(),-o.d),min:m,task:null,manual:true});save();toast(m+" Minuten eingetragen.");go("heute")},
 testStart(){sub("test",{i:0})},
 testAns(t){const i=view.sub.i||0;S.test.a[i]=+t.dataset.v;save();view.sub.i=i+1;render();window.scrollTo(0,0)},
 testAgain(){S.test.a={};save();view.sub.i=0;render()},
 goBulk(){go("aufgaben",{bulk:true})},
 goFilter(t){view.f=Object.assign({},view.f,{art:t.dataset.art,st:"offen"});go("aufgaben")},
 importBD(){const ex=new Set(S.tasks.map(t=>t.t));let n=0;bdLines().forEach(l=>{if(!ex.has(l)){addTask(l);n++}});S.bdDone=true;save();toast(n+" Aufgaben übernommen");keepScroll(render)},
 addTask(){const el=$("#newtask");if(!el)return;if(addTask(el.value)){save();keepScroll(render);const n=$("#newtask");n&&n.focus();toast("Hinzugefügt")}},
 bulkAdd(){const el=$("#bulk");const ls=el.value.split("\n").map(x=>x.replace(/^[\s\-–•*·]+/,"").trim()).filter(Boolean);ls.forEach(addTask);save();view.bulk=false;keepScroll(render);toast(ls.length+" Aufgaben hinzugefügt")},
 togTask(t){const x=findT(t.dataset.id);x.done=!x.done;x.doneAt=x.done?today():null;save();keepScroll(render);if(x.done)doneToast()},
 star(t){const x=findT(t.dataset.id);x.star=!x.star;save();keepScroll(render)},
 openTask(t){view.open=view.open===+t.dataset.id?null:+t.dataset.id;keepScroll(render)},
 closeTask(){view.open=null;keepScroll(render)},
 delTask(t){const id=+t.dataset.id;S.tasks=S.tasks.filter(x=>x.id!==id);Object.values(S.days).forEach(d=>d.pick&&(d.pick=d.pick.filter(p=>p!==id)));view.open=null;save();keepScroll(render)},
 setT(t){const x=findT(t.dataset.id);const k=t.dataset.k;let v=t.dataset.v;if(k==="muss")v=v==="true";x[k]=x[k]===v?null:v;if(k==="art"&&v!=="d")x.auf=null;save();keepScroll(render)},
 filt(t){view.f[t.dataset.k]=t.dataset.v;keepScroll(render)},
 pick(t){const d=dayObj(today());const id=+t.dataset.id;d.pick=d.pick.includes(id)?d.pick.filter(x=>x!==id):d.pick.concat(id);save();keepScroll(render)},
 unpick(t){const d=dayObj(today());d.pick=d.pick.filter(x=>x!==+t.dataset.id);save();keepScroll(render)},
 addFormal(t){const x=addTask(t.dataset.t);x.art="f";x.muss=true;save();keepScroll(render)},
 addAllFormal(){INHALT.formal.filter(f=>!S.tasks.some(t=>t.t===f)).forEach(f=>{const x=addTask(f);x.art="f";x.muss=true});save();keepScroll(render);toast("Übernommen")},
 glAdd(){S.gl.push({id:S.gid++,t:"",a:0});save();keepScroll(render);const ins=document.querySelectorAll(".gl input");ins.length&&ins[ins.length-1].focus()},
 glDel(t){const g=S.gl[+t.dataset.i];S.gl.splice(+t.dataset.i,1);S.tasks.forEach(x=>{if(x.kap===g.id)x.kap=null});save();keepScroll(render)},
 amp(t){S.gl[+t.dataset.i].a=+t.dataset.v;save();keepScroll(render)},
 woche(t){S.woche=t.dataset.v==="1";save();if(S.woche)go("woche");else keepScroll(render)},
 blkAdd(){const o=view.nb;if(!o.s||!o.e||tmin(o.e)<=tmin(o.s)){toast("Bitte eine Endzeit nach der Startzeit.");return}
  S.blocks.push({id:S.bid++,wd:o.wd,s:o.s,e:o.e,typ:o.typ===1?"t":"w",t:(o.t||"").trim()});o.t="";save();keepScroll(render);toast("Eingetragen")},
 blkDel(t){S.blocks=S.blocks.filter(b=>b.id!==+t.dataset.id);save();keepScroll(render)},
 park(){sub("park");setTimeout(()=>{const p=$("#parktxt");p&&p.focus()},50)},
 parkArt(t){const o=view.sub;const ta=$("#parktxt");o.txt=ta?ta.value:"";o.art=o.art===t.dataset.v?null:t.dataset.v;render();const n=$("#parktxt");if(n){n.value=o.txt||""}},
 parkSave(){const v=$("#parktxt").value.trim();const art=view.sub.art;if(v){if(art){const x=addTask(v);x.art=art}else S.park.push({t:v,d:today()});save()}view.sub=null;render();toast(!v?"Nichts geparkt":art?"Als "+ART[art]+" in der Liste. Weiter geht’s.":"Geparkt. Weiter geht’s.")},
 parkToTask(t){const p=S.park.splice(+t.dataset.i,1)[0];const x=addTask(p.t);if(t.dataset.art)x.art=t.dataset.art;save();keepScroll(render);toast("In der Aufgabenliste")},
 parkDel(t){S.park.splice(+t.dataset.i,1);save();keepScroll(render)},
 ich(){go("ich")},
 info(t){const [h,x]=INFOS[+t.dataset.i]||["",""];const p=$("#pop");p.querySelector("b").textContent=h;p.querySelector("p").textContent=x;p.hidden=false;p.querySelector("button").focus()},
 fbSend(){S.fb.sent=today();save();location.href="mailto:kontakt@drmaschakoerner.de?subject="+encodeURIComponent("Feedback Testphase Reset & Flow")+"&body="+encodeURIComponent(fbText());setTimeout(()=>keepScroll(render),400)},
 export(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="reset-and-flow-sicherung-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)},
 import(){const f=$("#imp");f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==2||!Array.isArray(d.tasks))throw 0;S=Object.assign(blank(),d);S.demo=false;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}toast("Sicherung geladen");go("heute")}catch(e){toast("Diese Datei passt nicht.")}};r.readAsText(f.files[0])};f.click()},
 reset(){if(!confirm("Wirklich alles löschen? Das lässt sich nicht rückgängig machen."))return;try{localStorage.removeItem(KEY)}catch(e){}S=blank();view.setup=0;go("heute")},
};
