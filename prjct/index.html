<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>PRJCT</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRJCT">
<style>
/* PRJCT · College-Stil: Schwarz, Grau, Weiß, Bordeaux #7B1B38 #591427 #A94A63 #D27C91 (23.11.2026) */
@font-face{font-family:"Source Sans 3";src:url(fonts/source-sans-3-latin-wght-normal.woff2) format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Source Sans 3";src:url(fonts/source-sans-3-latin-ext-wght-normal.woff2) format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--bg:#FFFFFF;--ink:#111111;--mute:#666666;--line:#DCDCDC;--soft:#EFEFEF;--red:#591427;--redsoft:#F6E4E9;--redmid:#D27C91;--reddark:#591427;--b3:#A94A63;--onink:#FFFFFF;--onred:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--ink:#ECECEC;--mute:#9C9C9C;--line:#2E2E2E;--soft:#1E1E1E;--red:#D27C91;--redsoft:#2A1820;--redmid:#A94A63;--reddark:#F2C4CF;--b3:#A94A63;--onink:#141414;--onred:#111111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--ink:#ECECEC;--mute:#9C9C9C;--line:#2E2E2E;--soft:#1E1E1E;--red:#D27C91;--redsoft:#2A1820;--redmid:#A94A63;--reddark:#F2C4CF;--b3:#A94A63;--onink:#141414;--onred:#111111;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.setup,body.full{padding-bottom:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--red)}
b,strong{font-weight:700}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Kopfzeile */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
header.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
header.top .ttl{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .day{font-size:13px;color:var(--mute);white-space:nowrap}
.hbtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-height:34px;padding:4px 10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.hbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.hbtn.ico{width:34px;padding:0;justify-content:center}
body.setup header.top,body.full header.top{display:none}

/* Seite */
main.wrap{max-width:560px;margin:0 auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:18px}
body.setup main.wrap,body.full main.wrap{min-height:100svh;padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:18px}
.q{display:flex;flex-direction:column;gap:7px}
.k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.k.r{color:var(--red)}
.m{color:var(--mute);font-size:13px}
.lead{color:var(--mute)}
.row{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.row b{font-size:14px}
.btns{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* Knöpfe */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 16px;border-radius:6px;border:1px solid var(--red);background:var(--red);color:var(--onred);font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.btn.o{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn.q2{background:var(--bg);color:var(--mute);border-color:var(--line);font-weight:400;font-size:14px}
.btn.big{min-height:56px;font-size:17px}
.btn.sm{width:auto;min-height:38px;padding:7px 14px;font-size:14px}
.btn svg{width:18px;height:18px;fill:currentColor}
.lnk{background:none;border:0;padding:6px 0;color:var(--red);font-weight:700;font-size:14px;text-align:left}
.lnk.m{color:var(--mute);font-weight:400}
.back{background:none;border:0;padding:4px 0;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}

/* Segmente (eckig) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--bg);border:0;border-left:1px solid var(--line);padding:9px 4px;min-height:42px;font-size:14px;line-height:1.2}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--onink);font-weight:700}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.seg.wrap button{border-top:1px solid var(--line)}
.opts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.opts button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border:0;border-top:1px solid var(--line);padding:11px 12px;min-height:46px}
.opts button:first-child{border-top:0}
.opts button::before{content:"";width:16px;height:16px;border:1.5px solid var(--mute);border-radius:3px;flex:none}
.opts button[aria-pressed="true"]{font-weight:700}
.opts button[aria-pressed="true"]::before{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--bg)}

/* Felder */
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px 12px;font-size:16px;min-height:44px}
textarea{resize:vertical;line-height:1.45}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
label.q>span:first-child{font-weight:700;font-size:14px}

/* Boxen */
.box{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.box.acc{border-color:var(--red);border-left-width:3px}
.box.fill{background:var(--redsoft);border-color:var(--redsoft)}
.box.soft{background:var(--soft);border-color:var(--soft)}
.box .btn{margin-top:2px}

/* Balken */
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.bar.thick{height:14px;border-radius:4px}
.bar.thick i{border-radius:4px}
.typ{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.typ .m{text-align:right}
.bignum{font-size:40px;font-weight:300;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* Monatsleiste */
.mbar{position:relative;display:flex;gap:3px}
.mbar>div{height:8px;border-radius:2px;background:var(--line)}
.mbar>div.past{background:var(--redmid)}
.mbar>div.on{background:var(--red)}
.mlab{display:flex;gap:3px;font-size:12px;color:var(--mute)}
.mlab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlab span.on{color:var(--ink);font-weight:700}

/* Schritte Phase 1/3 */
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps5 button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 2px;font-size:12px;line-height:1.15;color:var(--mute);min-height:44px}
.steps5 button b{display:block;font-size:14px;color:var(--ink)}
.steps5 button.done{background:var(--soft)}
.steps5 button.done b::after{content:" ✓";color:var(--red)}
.steps5 button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
ol.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.list li::marker{color:var(--red);font-weight:700}

/* Einstieg */
.phs{display:flex;flex-direction:column;gap:16px}
.st{display:grid;grid-template-columns:28px 1fr;gap:12px}
.st .n{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.st .n.on{background:var(--red);color:var(--onred);border-color:var(--red)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:18px;height:3px;background:var(--line);border-radius:2px}
.dots i.on{background:var(--red)}
.logo{width:56px;height:56px;border-radius:12px;display:block}

/* Aufgaben */
.tl{display:flex;flex-direction:column}
.task{border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.trow{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.cb{width:22px;height:22px;flex:none;border:1.5px solid var(--ink);border-radius:4px;background:var(--bg);margin-top:1px;padding:0;position:relative}
.cb[aria-pressed="true"]{background:var(--ink)}
.cb[aria-pressed="true"]::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid var(--onink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tb{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.tb .t{overflow-wrap:anywhere}
.tb .s{font-size:12px;color:var(--mute)}
.tb .s .pr{color:var(--red);font-weight:700}
.task.done .tb .t{color:var(--mute);text-decoration:line-through}
.tedit{padding:0 0 14px 34px;display:flex;flex-direction:column;gap:10px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.pick:first-child{border-top:0}
.pick .pl{width:22px;height:22px;flex:none;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-weight:700;color:var(--red)}
.pick[aria-pressed="true"] .pl{background:var(--red);border-color:var(--red);color:var(--onred)}
.grp{display:flex;flex-direction:column}
.addrow{display:flex;gap:8px}.addrow input{flex:1;min-width:0}.addrow .btn{width:auto}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;width:34px;height:34px;flex:none}
details summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--mute);font-weight:400}
details[open] summary::after{content:"–"}
details>*:not(summary){margin-top:10px}

/* Gliederung */
.gl{display:grid;grid-template-columns:1fr 34px;gap:6px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.gl .seg{grid-column:1/-1}
.gl .seg button{padding:6px 8px;min-height:40px;font-size:12px}
.gl .seg button[aria-pressed="true"].a0{background:var(--line);color:var(--ink)}
.gl .seg button[aria-pressed="true"].a1{background:var(--redmid);color:var(--ink)}
.gl .seg button[aria-pressed="true"].a2{background:var(--red);color:var(--onred)}
.glbar{display:flex;gap:3px}
.glbar i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.glbar i.a1{background:var(--redmid)}.glbar i.a2{background:var(--red)}

/* Wochenbalken Statistik */
.days{position:relative;display:flex;align-items:flex-end;gap:7px;height:120px;border-bottom:1px solid var(--line)}
.days>div{flex:1;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.days i{display:block;width:100%;background:var(--redmid);border-radius:3px 3px 0 0}
.days i.ok{background:var(--red)}
.days em{position:absolute;left:-2px;right:-2px;border-top:2px solid var(--ink)}
.dlab{display:flex;gap:7px;font-size:11px;color:var(--mute)}
.dlab span{flex:1;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 10px 8px}
.tile b{display:block;font-size:22px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mute);line-height:1.25;display:block;margin-top:3px}

/* Timer */
.timer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:10px 0}
.ring{width:min(240px,64vw);height:min(240px,64vw)}
.ring .tr{stroke:var(--soft)}.ring .pg{stroke:var(--red);transition:stroke-dashoffset .9s linear}
.ring.pause .pg{stroke:var(--ink)}
.ring text{fill:var(--ink);font-family:"Source Sans 3",sans-serif;font-weight:300;font-variant-numeric:tabular-nums}
.timer .btn{max-width:240px}
.ttask{font-size:13px;color:var(--mute);max-width:280px}

/* Woche */
.week{display:grid;grid-template-columns:26px repeat(7,1fr);gap:3px;font-size:10px;color:var(--mute)}
.week .h{text-align:center;font-weight:700;color:var(--ink);font-size:11px;padding-bottom:2px}
.week .h.now{color:var(--red)}
.week .hrs{position:relative}
.week .hrs span{position:absolute;left:0;transform:translateY(-50%)}
.col{position:relative;background:var(--soft);border-radius:4px}
.ev{position:absolute;left:2px;right:2px;border-radius:3px;font-size:9px;padding:1px 2px;line-height:1.1;overflow:hidden;color:var(--mute)}
.ev.w{background:var(--red);color:var(--onred)}
.ev.w.d{background:var(--reddark);color:var(--bg)}
.ev.t{background:var(--bg);border:1px solid var(--line)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);align-items:center}
.leg i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px}
.blk{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.blk:first-child{border-top:0}
.blk .sw{width:10px;height:10px;border-radius:2px;flex:none;background:var(--red)}
.blk .sw.t{background:var(--bg);border:1px solid var(--mute)}
.blk span{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Hilfe */
.hl{display:flex;flex-direction:column}
.hl button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 0}
.hl button:first-child{border-top:0}
.hl button span{flex:1;display:flex;flex-direction:column;font-size:16px}
.hl button small{font-size:13px;color:var(--mute)}
.hl button::after{content:"›";color:var(--mute);font-size:20px}
.say{font-size:17px;font-weight:600;border-left:3px solid var(--red);padding-left:12px}
.foot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.foot a,.foot button{color:var(--mute);background:none;border:0;padding:4px 0;text-decoration:none;font-size:13px}
.foot a:hover,.foot button:hover{color:var(--ink)}
.tool{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px}
.tool:first-child{border-top:0}
.tool .m b{color:var(--red)}

/* Untere Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{background:none;border:0;padding:9px 0 10px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:7px;min-height:56px}
nav.tabs button::before{content:"";width:20px;height:2px;border-radius:2px;background:currentColor}
nav.tabs button[aria-current="page"]{color:var(--red);font-weight:700}
body.setup nav.tabs,body.full nav.tabs,body.writing nav.tabs{display:none}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--onink);padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{background:var(--redsoft);border-radius:6px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.demo .btn{width:auto;min-height:34px;padding:5px 10px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ckrow{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;align-items:flex-start}
.ckrow:first-child{border-top:0}
.ckrow[aria-pressed="true"]>span:last-child{color:var(--mute);text-decoration:line-through}
button.box{width:100%;font-size:15px;color:var(--ink)}

/* Info-Knopf und Pop-up */
.ib{display:inline-grid;place-items:center;width:28px;height:24px;margin:-4px -4px -4px 2px;padding:0;border:0;background:none;vertical-align:middle}
.ib::before{content:"i";width:17px;height:17px;border-radius:50%;border:1.5px solid var(--mute);color:var(--mute);font-size:11px;font-weight:700;line-height:14px;text-align:center;text-transform:none;letter-spacing:0;font-family:Georgia,serif;font-style:italic}
h1 .ib::before{width:19px;height:19px;line-height:16px;font-size:12px}
.pop{position:fixed;inset:0;z-index:20;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.pop[hidden]{display:none}
.pop .sh{background:var(--bg);width:100%;max-width:560px;border-radius:12px 12px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.pop p{white-space:pre-line}
.seg.klar button{display:flex;align-items:center;justify-content:center;min-height:48px;color:var(--ink)}
.seg.klar button[aria-pressed="true"]{color:var(--onink)}

/* Abschlussarbeit */
.frage{border-left:3px solid var(--red);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.frage p{font-size:16px;font-weight:600}
.phcard{display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.pht{font-size:19px;line-height:1.25}
.bignum small{font-size:18px;margin-left:1px}
.bar{position:relative}
.bar.two em,.gantt em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.plr{width:100%;background:none;border:0;border-top:1px solid var(--line);align-items:center;color:var(--ink)}
.plr:first-child{border-top:0}
.plr.old{opacity:.55}
.pn{width:28px;height:28px;flex:none;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
.pn.ok{background:var(--redsoft);color:var(--red);border-color:var(--redsoft)}
.plr.cur .pn{background:var(--red);color:var(--onred);border-color:var(--red)}
.gantt{position:relative;display:flex;flex-direction:column;gap:3px}
.gr{display:grid;grid-template-columns:18px 1fr;gap:4px;align-items:center;font-size:11px;color:var(--mute)}
.gr div{position:relative;height:9px;background:var(--soft);border-radius:2px}
.gr i{position:absolute;top:0;bottom:0;background:var(--redmid);border-radius:2px}
.gr i.on{background:var(--red)}.gr i.f{background:var(--line)}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.ul li::marker{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;font-size:13px;text-align:left}
.kl{color:var(--ink)}
.gi{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px}
.gi:first-child{border-top:0}
.add{display:grid;grid-template-columns:1fr 48px;gap:6px}
.add .btn{min-height:44px;padding:0}

<script>
"use strict";
// Inhalte „Abschlussarbeit mit rotem Faden“ (Arbeitstitel) · Entwurf 1 vom 23.11.2026
// Qualitative empirische Bachelor- und Masterarbeiten. 10 Phasen in Arbeitsreihenfolge (Stand 24.11.2026), w = Anteil an der Gesamtzeit (Wochen bei 5 Monaten).
const PHASEN=[
 {id:"start",t:"Fundament",kurz:"Fundament",w:0.5,kap:"Arbeitsversion von Forschungsfrage, Titel und Gliederung",
  def:{t:"Was ist eigentlich eine Forschungsfrage?",x:"Eine Forschungsfrage ist die eine Frage, die deine ganze Arbeit beantworten will. Sie legt fest, was du genau wissen willst, bei wem und in welchem Zusammenhang. Ein Thema ist noch keine Frage: „Pflegekräfte und Stress“ ist ein Thema. „Wie erleben Pflegekräfte auf Intensivstationen den Umgang mit Stress im Schichtdienst?“ ist eine Forschungsfrage. Qualitative Fragen beginnen oft mit „Wie“ oder „Welche“, weil sie nach Erleben, Deutungen und Abläufen fragen und nicht nach Häufigkeiten. Und keine Sorge: Deine Frage darf sich im Laufe der Arbeit noch verändern."},
  ziel:"Du legst fest, in welche Richtung du dein Thema ausarbeitest. Hast du ein Exposé geschrieben, bist du schon gut eingearbeitet: Forschungsfrage, Arbeitsplan, meist auch eine erste Gliederung und ein Zeitplan stehen. Dann gehst du diese Phase zügig durch und prüfst nur, was sich seitdem verändert hat. Bei vielen Bachelor- und Masterarbeiten ist aber gar kein Exposé nötig. Du hast dein Thema bekommen, und jetzt entwickelst du daraus eine Arbeitsversion deiner Forschungsfrage.",
  ergebnis:"Eine Arbeitsversion deiner Forschungsfrage und deines Titels, eine erste Gliederung und ein Zeitplan bis zur Abgabe.",
  schritte:["Falls vorhanden: Exposé noch einmal lesen und markieren, was sich seitdem verändert hat","Erkenntnisinteressen sammeln: Was interessiert mich an diesem Thema wirklich? Alles aufschreiben, ohne zu bewerten","Überschlagen, welche Ausrichtungen das Thema zulässt, und eine davon wählen","Forschungsfrage und Titel als Arbeitsversion aufschreiben","Erste Gliederung anlegen, in Word mit Formatvorlagen","Zeitplan rückwärts vom Abgabedatum prüfen: Die App verteilt die Phasen, du ergänzt Puffer, Sondersituationen und feste Arbeitszeiten in der Woche","Mit der Betreuung klären: Erwartungen, Erreichbarkeit, nächster Termin"],
  stolper:["Die Forschungsfrage ist zu groß. Lieber eine klar umrissene Frage gründlich beantworten als mehrere Fragen nur oberflächlich.","Auf die perfekte Frage warten und deshalb nicht anfangen. Am Anfang reicht eine Arbeitsversion.","Der Zeitplan hat keinen Puffer. Rechne damit, dass Interviews ausfallen und Rückmeldungen dauern."],
  blick:["Passt die Forschungsfrage zu einer qualitativen Herangehensweise? Fragen nach dem Wie und Warum, nach Erleben und Deutungen eignen sich, Fragen nach dem Wie viel nicht.","Zieht sich die Forschungsfrage durch die ganze Arbeit? Genau das ist der rote Faden."],
  tipp:"Gerade in der qualitativen Forschung ist es in Ordnung, wenn Forschungsfrage und Titel am Anfang erst ein Arbeitsentwurf sind. Beides schärft sich mit der weiteren Recherche, aber auch durch die Erhebung und die Ergebnisse selbst. Oft werden erst dort neue Facetten oder ein anderer Schwerpunkt sichtbar. Spürst du noch Unsicherheit und kannst die Frage noch nicht klar ausformulieren, dann starte mit Phase 2: Tauch mindestens eine, besser zwei Wochen tief in die Literatur ein und formuliere die Frage danach neu.",
  vert:[{t:"Forschungsfrage ausformulieren: Worauf es ankommt",
   intro:"Ein Thema zu haben ist ein guter Anfang. Eine Forschungsfrage ist es noch nicht. „Wie wirkt sich Social Media auf Jugendliche aus?“ ist ein nicht abgegrenztes Thema: zu groß, zu offen und damit kaum zu beantworten.",
   punkte:["**Die Wortwahl verrät die Methode.** Formulierungen wie „Wie wirkt sich … aus?“, „Welchen Einfluss hat …?“, „Wie häufig …?“ oder „Gibt es einen Zusammenhang …?“ legen Ursache und Wirkung, Häufigkeiten oder Zusammenhänge nahe. Das untersucht man eher quantitativ.","**Qualitative Forschung will verstehen, nicht messen.** Sie fragt nach der subjektiven Perspektive: „Wie erleben …?“, „Wie deuten …?“, „Welche Bedeutung schreiben … zu?“, „Wie gehen … mit … um?“, „Welche Strategien entwickeln …?“","**Offen heißt nicht vage.** Auch eine qualitative Frage ist ziemlich genau. Sie benennt, wer genau gemeint ist, in welchem Kontext und, wenn nötig, in welchem Zeitraum.","**Ein Beispiel:** „Wie erleben Jugendliche zwischen 14 und 16 Jahren den Vergleich mit anderen auf Instagram, und welche Bedeutung schreiben sie ihm für ihr Selbstbild zu?“","**Die Methode folgt aus der Frage, nicht umgekehrt.** Erhebungsform, Stichprobe und Auswertung leitest du aus deiner Frage ab und begründest sie damit.","**Kurzer Check:** Braucht deine Frage eine ausführliche Antwort statt eines Ja oder Nein? Ist sie offen für Ergebnisse, die dich überraschen? Kannst du sie mit Interviews in deiner Zeit beantworten? Lautet deine Antwort dreimal Ja, hast du eine gute Basis für deine qualitative Forschungsfrage."]},
   {t:"Zeitplan: rückwärts von der Abgabe denken",
   intro:"Plane dein Projekt gleich zu Beginn, zumindest in groben Phasen, und zwar vom Abgabedatum aus rückwärts. Genau das macht diese App für dich: Sie verteilt alle Phasen auf die Zeit bis zur Abgabe und zeigt dir, wo du gerade stehen solltest.",
   punkte:["**Puffer einplanen:** Rechne mit Verzögerungen. Interviews fallen aus, Rückmeldungen dauern, die Betreuung ist im Urlaub. Die letzte Phase enthält deshalb bewusst Puffer.","**Sondersituationen mitdenken:** Krankheit, Prüfungen, Job, Familie, Feiertage. Trag bekannte Termine gleich ein und plan für Unerwartetes ein paar Tage Luft ein.","**Feste Arbeitszeiten:** Leg fest, an welchen Tagen und zu welchen Zeiten du an deiner Arbeit sitzt. Kleine, verlässliche Zeitfenster bringen dich weiter als der eine freie Tag, der nie kommt, weil sie eine Routine schaffen, die auch an schlechten Tagen hält. Wie du solche Zeitblöcke planst, zeigt dir meine kostenlose Time-Blocking-Vorlage (unten unter Material). Weitere Tipps dazu gibt es auf meinem Instagram-Kanal @forschung.mit.rotem.faden.","**Sichtbar machen:** Mit den kostenlosen Gantt-Vorlagen überträgst du den Plan aus der App auf Papier, vom Groben ins Feine bis zum einzelnen Monat. So hast du ihn immer vor Augen, zum Beispiel über dem Schreibtisch.","**Nur ein Orientierungsrahmen:** Die App kennt deine Lebenssituation, deine Arbeitskapazitäten und deine Kraft in den einzelnen Phasen nicht. Ihr Plan ist deshalb eine Empfehlung. Brauchst du für eine Phase weniger oder mehr Zeit, ist das in Ordnung. Wichtig ist, dass du es bei den folgenden Phasen berücksichtigst.","**Nachjustieren erlaubt:** Schließt du eine Phase ab, verteilt die App die restlichen Phasen automatisch ab heute neu bis zur Abgabe, enger oder großzügiger. Über „Plan neu verteilen“ kannst du das auch jederzeit selbst anstoßen."]}],
  info:[{t:"Ich hasse mein Thema",x:"Gerade bei Bachelor- und Masterarbeiten ist das Thema oft vorgegeben. Deine Arbeit muss nicht dein Herzensprojekt sein. Plan deine Schritte, geh es professionell an und warte nicht auf die Motivation, die kommt oft erst beim Arbeiten. Und die zähen Phasen sind die größten Lernmomente."}],
  coach:"Du bist unsicher, ob deine Forschungsfrage so passt, ob sie zu groß oder zu vage ist? Schick sie mir gern, oft reicht ein gemeinsamer Blick.",
  mat:["gantt","timeblocking","insta"]},
 {id:"theorie",t:"Literatur und Theorie",kurz:"Theorie",w:3,kap:"Theorie und Forschungsstand, erste Fassung",
  def:{t:"Was ist eigentlich eine Theorie?",x:"Eine Theorie ist ein begründetes Gefüge aus Begriffen und Aussagen, das einen Ausschnitt der Wirklichkeit beschreibt und erklärt: was zusammenhängt, wie und warum. Du kannst sie dir wie eine Brille vorstellen, durch die du auf dein Thema schaust. Sie lenkt deinen Blick auf bestimmte Dinge und gibt ihnen einen Namen. Ein Beispiel: Das transaktionale Stressmodell nach Lazarus sagt, dass Stress nicht durch eine Situation allein entsteht, sondern dadurch, wie ein Mensch sie bewertet und welche Möglichkeiten er sieht, damit umzugehen. Wer mit dieser Brille Interviews liest, achtet auf Bewertungen und Bewältigungsstrategien."},
  ziel:"Warum braucht eine empirische Arbeit überhaupt Theorie? Weil Theorie dir Begriffe und Erklärungsansätze gibt, mit denen du dein Thema verstehst, deine Forschungsfrage begründest, deinen Leitfaden entwickelst und am Ende deine Ergebnisse einordnest. Der Forschungsstand zeigt, was andere schon herausgefunden haben und wo die Lücke liegt, die deine Arbeit bearbeitet. Was Theorie nicht kann: deine Ergebnisse vorwegnehmen. Qualitative Forschung bleibt offen für das, was dein Material zeigt. Mit jedem Artikel, jeder Studie und jeder theoretischen Auseinandersetzung wird deine Forschungsfrage schärfer.",
  ergebnis:"Eine geschärfte Forschungsfrage, eine gut gefüllte Literaturverwaltung, ein erster theoretischer Rahmen, ein Überblick über den Forschungsstand und eine Vorstellung davon, welche Lücke deine Arbeit bearbeitet.",
  schritte:["Literaturverwaltung einrichten (Zotero oder Citavi) und ab jetzt parallel führen","Klären, welchen Zitierstil deine Hochschule oder dein Fachbereich verlangt, und ihn im Programm einstellen","Suchbegriffe festlegen, auch auf Englisch, mit Synonymen","Eine bis zwei Wochen tief in die Literatur eintauchen: möglichst systematisch recherchieren und die Suchen kurz dokumentieren","Literatur sichten und auswählen: Was brauche ich wirklich für meine Frage?","Forschungsfrage mit dem neuen Wissen schärfen","Vorgaben klären: ein Hauptmodell oder mehrere theoretische Ansätze? Gehört der Forschungsstand zum theoretischen Rahmen oder in ein eigenes Kapitel?","Zentrale Begriffe definieren","Theoretischen Rahmen festlegen und als Skizze aufzeichnen","Forschungsstand nach Themen ordnen und die Forschungslücke benennen"],
  stolper:["Endlos lesen, ohne Notizen und ohne Struktur. Lesen fühlt sich produktiv an. Es soll dein Schreiben aber vorbereiten und dich in die nächste Phase bringen, nicht ersetzen.","Wahllos lesen und vom Hölzchen aufs Stöckchen kommen. Am Ende weißt du nicht mehr, wo du angefangen hast. Frag dich immer wieder: Was hat dieser Text mit meinem Thema und meiner Forschungsfrage zu tun?","Alles zusammenfassen, was es zum Thema gibt. Gefragt ist eine Auswahl, die zu deiner Frage passt.","Quellen erst am Ende einpflegen. Dann suchst du Seitenzahlen und Angaben mühsam wieder zusammen.","Eine Studie nach der anderen nacherzählen, statt den Forschungsstand nach Themen zu ordnen."],
  blick:["Passen Ergebnis, Forschungsfrage und theoretischer Rahmen genau zueinander? Diese Passgenauigkeit schaue ich mir als Gutachterin besonders an.","Wird bei jeder Quelle klar, warum sie für deine Fragestellung wichtig ist? Quellen, die nur aneinandergereiht werden, zeigen kein eigenes Denken.","Ist jede inhaltliche Aussage eindeutig einer Quelle zuzuordnen? Das ist auch der beste Schutz vor dem Vorwurf eines Plagiats."],
  tipp:"Der theoretische Rahmen ist eine der herausforderndsten Stellen der ganzen Arbeit, weil Theorie oft sehr abstrakt ist. Was hilft: Zeichne auf, wie die theoretischen Bausteine mit deinem Thema und deiner Frage zusammenhängen und wo sich daraus eine Folge für deine Untersuchung ableiten lässt. Und nichts davon ist in Stein gemeißelt. Wenn deine Ergebnisse da sind, schaust du noch einmal zurück und schärfst nach. Und noch ein Tipp für die Recherche: Hast du eine Studie gefunden, die sehr genau zu deinem Thema passt, schau dir ihr Literaturverzeichnis an. Dort findest du oft spannende Texte, die dir in Suchmaschinen und Datenbanken bisher nicht begegnet sind.",
  vert:[{t:"Wozu Theorie? Nutzen, Einsatz und Grenzen",
   intro:"Eine der häufigsten Fragen: Was bringt mir Theorie, wenn ich doch selbst Daten erhebe? Die kurze Antwort: Ohne Theorie bleiben deine Ergebnisse Beschreibungen. Mit Theorie werden sie verständlich und anschlussfähig.",
   punkte:["**Was Theorie kann:** Sie liefert Begriffe, mit denen du genau benennst, was du untersuchst. Sie bietet Erklärungsansätze, warum Menschen so denken und handeln, wie sie es tun. Und sie verbindet deine Arbeit mit dem, was die Wissenschaft schon weiß.","**Wo du sie einsetzt:** Sie begründet und begrenzt deine Forschungsfrage, gibt deinem Leitfaden die Themenblöcke, hilft beim Bilden von Kategorien und ist in der Diskussion der Maßstab, an dem du deine Ergebnisse spiegelst: Was bestätigt sich, was ist neu, was widerspricht?","**Forschungsstand:** Er zeigt, was andere Studien schon herausgefunden haben. Daraus leitest du die Lücke ab, die deine Arbeit schließt, und damit die Begründung, warum es deine Untersuchung braucht.","**Was Theorie nicht kann:** Sie nimmt deine Ergebnisse nicht vorweg und ersetzt keine Daten. In der qualitativen Forschung prüfst du keine Hypothesen, sondern bleibst offen für das, was dein Material zeigt.","**Grenzen und Fallstricke:** Keine Theorie erklärt alles. Ist der Rahmen zu groß, wird er unscharf. Hältst du zu eng an ihm fest, siehst du nur, was er dir vorgibt. Und Theorie, die du später in der Diskussion nicht wieder aufgreifst, ist Ballast statt Werkzeug."]},
   {t:"Systematisch recherchieren, ganz ohne großes Review",
   intro:"Für eine Abschlussarbeit brauchst du kein vollständiges Scoping Review. Ein paar Anhaltspunkte daraus machen deine Recherche aber deutlich gründlicher und nachvollziehbarer.",
   punkte:["**Wo du suchst:** Startpunkt ist der Katalog deiner Hochschulbibliothek, der oft auch Zeitschriftenartikel und E-Books findet. Dazu kommt Google Scholar für einen breiten Überblick. Gründlicher wird es in den Fachdatenbanken deines Fachs, die du meist über das Netz der Hochschule nutzen kannst. Welche das sind, steht auf der Website deiner Bibliothek, oft sortiert nach Fächern.","**Rahmen klären:** Wer (Personengruppe), was (Gegenstand) und wo (Kontext, Setting)? Daraus leitest du deine Suchbegriffe ab.","**Grenzen festlegen:** Welche Sprachen, welcher Zeitraum, welche Textarten (Studien, Theorie, Fachpraxis)? Und was gehört ausdrücklich nicht dazu?","**Probesuche:** In ein bis zwei Datenbanken suchen und schauen, welche Begriffe und Schlagwörter in passenden Treffern stehen. Diese übernimmst du.","**Suchbegriffe verknüpfen:** Synonyme eines Begriffs mit ODER, verschiedene Begriffe mit UND. Deutsch und Englisch getrennt suchen.","**Testen:** Notier dir drei bis fünf Texte, die auf jeden Fall auftauchen müssen. Findet deine Suche sie?","**Handsuche:** Geh die Literaturlisten der besten Texte durch. So findest du, was die Datenbanken übersehen.","**Dokumentieren:** Datum, Datenbank, Suchbegriffe, Trefferzahl in einer kleinen Tabelle. Das hilft dir später beim Schreiben des Forschungsstands.","**Sichten in zwei Stufen:** Erst Titel und Abstract, dann nur die passenden Volltexte.","**Hol dir Hilfe:** Viele Hochschulbibliotheken bieten Rechercheberatung an, oft kostenlos und schnell."]},
   {t:"Literaturverwaltung von Anfang an",
   intro:"Führ ab dem ersten Text eine Literaturverwaltung mit, zum Beispiel Zotero (kostenlos) oder Citavi (oft über die Hochschule kostenlos). Beide Programme holen sich die Angaben selbst, sobald sie einen eindeutigen Schlüssel haben: die DOI bei Artikeln, die ISBN bei Büchern. Und wenn du schon Literatur gesammelt hast, ganz ohne Programm? Kein Problem, dafür gibt es einfache Lösungen:",
   punkte:["**Ordner voller PDFs:** In Zotero die PDFs einfach ins Programm ziehen, in Citavi über Datei › Importieren › Aus PDF-Dateien. Die Programme lesen die Angaben selbst aus.","**Literaturliste ohne Dateien:** Lass eine KI wie Claude oder ChatGPT die Liste in DOIs und ISBNs oder in eine RIS-Datei umwandeln. Die importierst du dann mit einem Klick.","**Ab jetzt direkt sauber:** Mit dem Browser-Zusatz (Zotero Connector oder Citavi Picker) speicherst du neue Quellen beim Recherchieren direkt mit allen Angaben.","**Zitierstil einstellen:** Frag früh nach, welchen Stil deine Hochschule erwartet (zum Beispiel APA oder eine Hausvorgabe), und stell ihn im Programm ein. Dann stimmt jede Angabe von Anfang an.","**Immer prüfen:** Automatisch erkannte Angaben sind nicht fehlerfrei. Nimm dir nach jedem größeren Import zehn Minuten und sieh Autor:innen, Jahr, Titel und Eintragstyp durch."]},
   {t:"Theoretischer Rahmen: ein Modell oder mehrere?",
   intro:"Hier gibt es keine allgemeine Regel. Orientier dich an den Vorgaben deiner Hochschule und vor allem an deiner Betreuung.",
   punkte:["**Ein Hauptmodell:** Manchmal ist es gern gesehen, dass du ein einziges theoretisches Modell als Rahmung nutzt und deine Arbeit konsequent daran ausrichtest.","**Mehrere Ansätze:** Je nach Thema kann es nötig sein, verschiedene theoretische Konstrukte und Modelle mitzudenken. Dann wird umso wichtiger, wie sie zusammenhängen.","**Zeichnen statt nur beschreiben:** Eine kleine Skizze zeigt dir, wie die Bausteine miteinander verbunden sind und was daraus für deine Frage folgt. Sie eignet sich oft auch für die Arbeit selbst.","**Begriffe klären:** Manche zählen den Forschungsstand zum theoretischen Rahmen, quasi als empirischen Rahmen. Andere fassen den Rahmen enger, nur mit Erklärungsmodellen und Konstrukten, und geben dem Forschungsstand ein eigenes Kapitel. Beides ist richtig. Sprich mit deiner Betreuung ab, was in deinem Fachbereich üblich ist.","**Rückschau einplanen:** Wenn die Ergebnisse da sind, prüfst du, ob die Theorie noch passt. Lässt sich etwas aus deinen Ergebnissen noch nicht erklären? Oder ist die Rahmung zu weit und zu wenig spezifisch? Dann schärfst und reduzierst du."]},
   {t:"Zitieren und Plagiat: was du wissen musst",
   intro:"Beim Zitieren geht es um eine Frage: Kann man jede inhaltliche Aussage eindeutig ihrer Quelle zuordnen?",
   punkte:["**Direkt und indirekt unterscheiden:** Ein direktes Zitat übernimmst du wörtlich und in Anführungszeichen, ein indirektes gibst du in eigenen Worten wieder. Wie genau das gekennzeichnet wird, regelt dein Zitierstil.","**Jede Aussage belegen:** Auch eine sinngemäße Wiedergabe braucht eine Quelle. Fehlt sie, ist das schnell ein Plagiat, auch ohne Absicht.","**KI und Plagiat:** Lies deine Eigenständigkeitserklärung genau und schau, was deine Hochschule zu KI erlaubt. Inhalte, Argumente und Quellen müssen von dir kommen, und jede Quelle prüfst du selbst.","**Unsicher?** Wo genau die Grenze zum Plagiat liegt, besonders mit KI, ist eine der häufigsten Fragen in meiner Forschungsbegleitung. Melde dich gern direkt bei mir."]}],
  info:[{t:"Gefunden ist nie alles",x:"Viele Studierende haben Angst, nicht alles gefunden zu haben, und recherchieren deshalb bis zum Sankt-Nimmerleins-Tag. Die gute Nachricht: Niemand findet alle Quellen, und das erwartet auch keine Gutachterin. Erwartet wird, dass du die zentralen Werke kennst und deine Auswahl begründen kannst. Ein gutes Zeichen: Wenn in neuen Texten immer wieder dieselben Namen auftauchen, hast du den Kern des Forschungsstands erfasst."}],
  coach:"Du bist unsicher beim theoretischen Rahmen, bei der Forschungsfrage oder bei der Frage, wo mit KI das Plagiat beginnt? Das ist komplex, und genau dafür bin ich da.",
  lit:["Esselborn-Krumbiegel, H. Von der Idee zum Text. Eine Anleitung zum wissenschaftlichen Schreiben. UTB (aktuelle Auflage).","Für eine besonders systematische Recherche: von Elm, E., Schreiber, G. & Haupt, C. C. (2019). Methodische Anleitung für Scoping Reviews (JBI-Methodologie). ZEFQ, 143, 1–7."],
  mat:["ki"]},
 {id:"design",t:"Forschungsdesign und Leitfaden",kurz:"Forschungsdesign",w:2,kap:"Methodenteil: Forschungsdesign",
  def:{t:"Was ist eigentlich ein Forschungsdesign?",x:"Das Forschungsdesign ist dein Bauplan für den empirischen Teil. Es beschreibt, wie du vorgehst, um deine Forschungsfrage zu beantworten: mit welcher Methode du Daten erhebst (zum Beispiel Interviews), mit wem (deine Stichprobe, auch Sample genannt) und wie du die Daten auswertest. Entscheidend ist, dass alles zusammenpasst und du jede Entscheidung begründen kannst. Die Frage dahinter ist immer: Warum ist genau dieser Weg der richtige für genau meine Frage?"},
  ziel:"Du entscheidest, wie du deine Frage empirisch beantwortest: welche Erhebungsform, welche Menschen, welche Auswertungsmethode. Und du begründest jede Entscheidung. Vorher steht ein Schritt, der oft übersprungen wird: Du stellst dein Denken auf qualitativ um. Es geht nicht darum, Ursache und Wirkung zu messen, und viele gleiche Aussagen bedeuten noch keine Relevanz. Es geht darum, Sinn, Deutungen und Erleben zu verstehen.",
  ergebnis:"Ein begründetes Forschungsdesign, ein getesteter Interviewleitfaden, eine Einwilligungserklärung und eine kleine Übersicht deines Forschungsdesigns, die du später in den Methodenteil übernimmst.",
  par:"Diese Phase und die nächste füllen selten jeden Tag ganz aus. Hier eine Mail, da ein Pretest: Nutz die Lücken für die Theorie.",
  schritte:["Methodologisch verorten: Was heißt qualitativ forschen für meine Frage?","Erhebungsform wählen und begründen (zum Beispiel problemzentriertes Interview, Expert:inneninterview, teilnehmende Beobachtung)","Sampling festlegen: Wer kann zu meiner Frage Auskunft geben, warum, wie viele?","Bei belastenden Themen: Kosten und Nutzen abwägen und prüfen, ob andere Personen anstelle der Betroffenen dieselben Informationen geben können, zum Beispiel Fachkräfte statt Betroffene selbst","Auswertungsmethode festlegen (zum Beispiel qualitative Inhaltsanalyse)","Eigene Rolle reflektieren: Als wer trete ich auf, und was erwartet mein Gegenüber deshalb von mir?","Interviewleitfaden entwickeln","Pretest durchführen und den Leitfaden anpassen","Einwilligungserklärung und Datenschutz vorbereiten","Forschungsdesign als kleine Übersicht festhalten und Entscheidungen im Logbuch notieren"],
  stolper:["Die Methode wird gewählt, weil sie bekannt ist, nicht weil sie zur Frage passt.","Im Kopf bleibt die quantitative Logik: Man will Wirkungen nachweisen oder zählt, wie oft etwas gesagt wurde.","Der Leitfaden wird zum Fragebogen: zu viele, zu geschlossene Fragen."],
  blick:["Passen Forschungsfrage, Erhebung und Auswertung zusammen? Brüche fallen hier sofort auf.","Ich will nicht nur ein zitiertes Methodenlehrbuch sehen, sondern dass die Methode an dein Forschungsdesign angepasst wurde, und wo und warum.","Wird die eigene Rolle als Forscher:in reflektiert? Dein Einfluss lässt sich nicht verhindern, aber transparent machen."],
  tipp:"Mach dein Forschungsdesign im Methodenteil auf einen Blick sichtbar, zum Beispiel mit einer kleinen Grafik: Zeitraum, Interviewpartner:innen, Zugang, Erhebungsform, Auswertungsform, zentrale Inhalte. Das hilft dir beim Schreiben und mir beim Lesen.",
  vert:[{t:"Qualitativ denken: das interpretative Paradigma",
   intro:"Qualitative Forschung geht davon aus, dass soziale Wirklichkeit nicht einfach objektiv vorliegt, sondern von Menschen gedeutet und im Austausch hergestellt wird. Daraus folgt einiges für dein Vorgehen.",
   punkte:["**Verstehen statt messen:** Du willst herausfinden, welchen Sinn Menschen etwas geben, nicht wie oft etwas vorkommt.","**Deutung zweiten Grades:** Deine Befragten deuten ihre Welt, und du deutest ihre Deutungen. Deshalb gehört auch deine Rolle in den Methodenteil.","**Verstehen beginnt im Interview:** Nicht erst in der Auswertung, sondern schon im Gespräch, wenn du nachfragst und zusammenfasst.","**Offenheit mit Struktur:** Ein Leitfaden gibt Themen vor, lässt aber Raum für das, was dein Gegenüber wichtig findet."]},
   {t:"Stichprobe: wer kann Auskunft geben?",
   intro:"In der qualitativen Forschung geht es nicht um Repräsentativität, sondern darum, wer zu deiner Frage etwas Gehaltvolles sagen kann.",
   punkte:["**Kriterien vorher festlegen und begründen,** zum Beispiel eine Mindestzahl an Jahren Berufserfahrung oder an eigenen Fällen.","**Kontraste einplanen:** Stadt und Land, große und kleine Einrichtungen, verschiedene Regionen. So siehst du, was typisch ist und was nicht.","**Zugangswege:** bestehende Kontakte, Vermittlung über Schlüsselpersonen, Weiterempfehlung durch Befragte, Fachtagungen, direkte Anfragen.","**Verantwortung bei Belastung:** Forschst du mit Menschen, die Belastendes oder sogar Straftaten erlebt haben, kann das erneute Erzählen sie wieder belasten oder retraumatisieren. Wäg Kosten und Nutzen ab und prüf, ob Fachkräfte, Beratungsstellen oder andere Professionelle die Informationen ebenso gut, oft sogar mit mehr Abstand und Überblick, geben können. Das hängt vom Einzelfall ab, sprich mich dazu gern an."]},
   {t:"Nicht nur Interviews: teilnehmende Beobachtung",
   intro:"Neben Interviews gehören auch teilnehmende Beobachtung und Dokumentenanalyse zur qualitativen Forschung. Die teilnehmende Beobachtung ist die zweithäufigste Form.",
   punkte:["**Wann sie passt:** Wenn dich interessiert, was Menschen tun und wie Abläufe tatsächlich aussehen, nicht nur, wie sie darüber sprechen. Das muss nicht der Alltag sein. Auch bestimmte Anlässe, in denen Interaktion stattfindet, lassen sich beobachten, zum Beispiel ein Elterngespräch in der Kita oder eine polizeiliche Vernehmung.","**Rolle klären:** Wie offen beobachtest du, wie stark nimmst du teil? Beides beeinflusst, was du siehst, und gehört in den Methodenteil.","**Feldnotizen und Beobachtungsprotokoll:** Halte direkt im Anschluss fest, was du beobachtet hast, getrennt von deinen eigenen Deutungen und Gefühlen. Bei wiederkehrenden Situationen hilft ein strukturiertes Beobachtungsprotokoll, das du vorher entwickelst: Worauf achtest du jedes Mal, etwa Ablauf, Beteiligte, Gesprächsanteile, Wendepunkte? So bleiben deine Beobachtungen vergleichbar.","**Zugang und Einwilligung:** Gerade in Einrichtungen braucht es die Erlaubnis der Leitung und eine klare Information der Beteiligten.","**Kombinieren:** Oft ergänzt eine Beobachtung Interviews sehr gut, zum Beispiel um Gesagtes und Getanes nebeneinanderzulegen."]}],
  info:[{t:"Methode anwenden heißt Methode anpassen",x:"Wenn du eine Interviewform an deinen Gegenstand anpasst, erfindest du keine neue Methode. Du stellst die nötige Passung her. Wichtig ist nur, dass du die Anpassung offenlegst und begründest."}],
  coach:"Du bist unsicher, ob deine Methode zu deiner Frage passt, oder du forschst mit Menschen in belastenden Situationen? Lass uns gemeinsam draufschauen, bevor du ins Feld gehst.",
  lit:["Helfferich, C. (2011). Die Qualität qualitativer Daten. Manual für die Durchführung qualitativer Interviews (4. Aufl.). VS Verlag.","Witzel, A. (2000). Das problemzentrierte Interview. Forum Qualitative Sozialforschung, 1(1), Art. 22.","Bogner, A. & Menz, W. (2001). „Deutungswissen“ und Interaktion. Zu Methodologie und Methodik des theoriegenerierenden Experteninterviews. Soziale Welt, 52(4), 477–500.","Liebold, R. & Trinczek, R. (2009). Experteninterview. In S. Kühl, P. Strodtholz & A. Taffertshofer (Hrsg.), Handbuch Methoden der Organisationsforschung (S. 32–56). VS Verlag.","von Unger, H., Narimani, P. & M’Bayo, R. (Hrsg.) (2014). Forschungsethik in der qualitativen Forschung. Springer VS.","Breidenstein, G., Hirschauer, S., Kalthoff, H. & Nieswand, B. (2020). Ethnografie. Die Praxis der Feldforschung (3. Aufl.). UVK.","Flick, U. (2016). Qualitative Sozialforschung. Eine Einführung (7. Aufl.). Rowohlt."],
  mat:["finder"]},
 {id:"feld",t:"Feldzugang und Erhebung",kurz:"Erhebung",w:3,kap:"Methodenteil: Durchführung der Erhebung",
  def:{t:"Was ist eigentlich das „Feld“?",x:"Mit „Feld“ ist in der qualitativen Forschung einfach der Ausschnitt der Welt gemeint, in dem du forschst: die Menschen, Einrichtungen oder Gruppen, die etwas über deine Frage wissen. Das kann eine Beratungsstelle sein, eine Schule oder eine Gruppe von Studierenden. Feldzugang heißt, dass du Kontakt aufnimmst und Menschen findest, die bereit sind, mit dir zu sprechen. Oft läuft das über Schlüsselpersonen, sogenannte Gatekeeper, also zum Beispiel eine Leitung, die dir Türen öffnet."},
  ziel:"Jetzt gehst du ins Feld. Du gewinnst Interviewpartner:innen, führst die Gespräche und hältst direkt danach fest, was dir aufgefallen ist. Sobald die ersten Interviews geführt sind, beginnt parallel schon die Aufbereitung.",
  ergebnis:"Alle geplanten Interviews als Aufnahme, unterschriebene Einwilligungen, zu jedem Interview ein Postskript und eine Übersicht über dein Sample.",
  par:"Diese Phase läuft parallel zu anderen. Zwischen Anfragen und Terminen bleibt Zeit, und sobald ein Interview geführt ist, startest du schon mit dem Transkribieren.",
  schritte:["Interviewpartner:innen ansprechen (Anschreiben, Schlüsselpersonen, Netzwerke)","Einwilligungserklärung vorab schicken und unterschrieben zurückbekommen","Termine vereinbaren und Technik testen, zwei Aufnahmegeräte einplanen","Interviews führen","Nach jedem Interview ein Postskript schreiben","Die ersten zwei Interviews selbst transkribieren und die eigene Gesprächsführung reflektieren","Leitfaden oder Gesprächsführung bei Bedarf anpassen","Sample-Übersicht führen (anonymisiert)"],
  stolper:["Zu spät mit der Suche nach Interviewpartner:innen anfangen. Der Feldzugang dauert fast immer länger als gedacht: Rückmeldungen kommen nicht sofort, Leute sind im Urlaub, der Zugang ist schwerer, und du schreibst mehr Einrichtungen an, als dir lieb ist.","Die Einwilligung erst beim Termin klären. Sagt jemand dann Nein, bist du umsonst hingefahren.","Nur mit einem Gerät aufnehmen. Fällt es aus, ist das Interview verloren.","Den Leitfaden wie einen Fragebogen vorlesen, statt das Gespräch zu leiten und flexibel zu reagieren."],
  blick:["Wird konkret erläutert, wie der Feldzugang hergestellt wurde? Ein eigenes Kapitel braucht er dafür nicht, er kann im Forschungsdesign aufgehen.","Wird reflektiert, worauf du in der Gesprächsführung geachtet hast, was gut lief und was weniger?"],
  tipp:"Aushalten, wenn es still wird. Pausen fühlen sich für dich viel länger an, als sie sind. Für dein Gegenüber sind es Denkpausen, und danach kommt oft noch etwas Wichtiges. Zähl innerlich langsam mit, achte auf Abschlusssignale wie ein „genau“ am Satzende, und lad nach einer Erzählung erst noch einmal zum Erzählen ein: „Was fällt Ihnen darüber hinaus noch dazu ein?“",
  vert:[{t:"Datenschutz und Einwilligung",
   intro:"Orientier dich an den Vorgaben deiner Hochschule. Vorlagen findest du oft auch dort oder im Internet. Wichtig ist, dass deine Einwilligungserklärung diese Punkte klar regelt:",
   punkte:["**Zweck:** Wofür werden die Daten genutzt?","**Dauer:** Wie lange werden sie aufbewahrt, und wann werden sie gelöscht?","**Zugang:** Wer kann die Daten einsehen?","**Aufbewahrung:** Wie und wo werden sie gespeichert, und wie wird anonymisiert?","**Widerruf:** Die Person kann ihre Einwilligung jederzeit zurückziehen.","**Vorher klären:** Schick die Erklärung vor dem Termin und lass sie dir unterschrieben zurückgeben. So erlebst du vor Ort keine böse Überraschung."]},
   {t:"Deine Rolle als Forscher:in: wo du Einfluss nimmst",
   intro:"Dein Einfluss auf das Gespräch lässt sich nicht verhindern. Er muss aber transparent gemacht und reflektiert werden. Ein paar typische Stellen:",
   punkte:["**Als wer trittst du auf?** Als Student:in, als Mitarbeiter:in einer Einrichtung, als Kolleg:in oder Ehrenamtliche:r? Dein Gegenüber stellt sich darauf ein und antwortet entsprechend.","**In welcher Rolle wirst du wahrgenommen?** Je nachdem, wie dein Gegenüber dich sieht, antwortet es anders. Typische Rollen (nach Bogner & Menz 2001): Wirst du als **Co-Expert:in** gesehen, setzt die interviewte Person geteiltes Wissen voraus und erklärt weniger. Vieles bleibt dann unausgesprochen. Als **Laie oder Laiin** bekommst du viel erklärt, manchmal auch Belangloses, und das Gespräch geht nicht immer in die Tiefe. Als **Autorität**, etwa wenn du aus einer Leitungsebene oder der Hochschule kommst, wird eher sozial erwünscht geantwortet. Als **Kompliz:in** vertraut dir dein Gegenüber und erzählt offen, kritische Nachfragen wirken dann aber schnell wie Verrat.","**Bekannte Interviewpartner:innen:** Der Wechsel vom Austausch ins Interview fällt schwer. Sag vorher klar, dass es jetzt um ihr Wissen geht und du selbst wenig redest.","**Sprache übernehmen:** Greif die Begriffe deines Gegenübers auf, statt eigene vorzugeben. Ein Begriff, den du einführst, kann die Antworten schon lenken.","**Eigene Thesen einbringen:** Kann ein Gespräch anregen, kann Positionen aber auch künstlich verstärken. Reflektier, wann du das getan hast."]},
   {t:"Postskripte: was die Aufnahme nicht zeigt",
   intro:"Ein Postskript schreibst du direkt nach dem Interview, solange die Eindrücke frisch sind. Es ist kurz, aber für Auswertung und Methodenteil Gold wert.",
   punkte:["**Rahmen:** Ort, Setting, Dauer, Störungen, besondere Umstände.","**Was vor und nach der Aufnahme gesagt wurde:** Oft fallen die offensten Sätze, wenn das Gerät schon aus ist.","**Atmosphäre und Körpersprache:** Wie wirkte dein Gegenüber, wie hast du dich gefühlt?","**Eigene Irritationen und Ideen:** Was hat dich überrascht? Was möchtest du im nächsten Interview anders machen?","**Nutzen:** Postskripte helfen dir, Aussagen später richtig einzuordnen, deine Rolle zu reflektieren und dein Vorgehen im Methodenteil nachvollziehbar zu machen."]}],
  info:[{t:"Online oder vor Ort?",x:"Seit Covid gibt es viel Erfahrung mit Videointerviews, und die Studien sind sich weitgehend einig: Online geführte Interviews liefern im Kern vergleichbare Daten. Vor Ort bekommst du mehr Eindrücke von Körpersprache und Umgebung, und der Kontakt entsteht oft leichter. Online sparst du Zeit und Wege und erreichst Menschen in ganz Deutschland, manche fühlen sich zu Hause auch wohler. Achte online auf eine stabile Verbindung, eine Plattform mit Hochschullizenz und einen ruhigen Raum auf beiden Seiten. Bei sehr belastenden Themen ist vor Ort oft besser, weil du dein Gegenüber eher auffangen kannst. Wichtig ist vor allem: Begründe deine Entscheidung im Methodenteil."},{t:"Immer doppelt aufnehmen",x:"Ein Aufnahmegerät kann immer ausfallen, der Akku leer sein oder der Speicher voll. Nimm deshalb jedes Interview parallel mit einem zweiten Gerät auf, zum Beispiel mit Diktiergerät und Handy."}],
  coach:"Der Feldzugang stockt, oder du bist unsicher, wie du nach den ersten Interviews deine Gesprächsführung verbesserst? Schreib mir gern.",
  lit:["Helfferich, C. (2011). Die Qualität qualitativer Daten (4. Aufl.). VS Verlag.","Lobe, B., Morgan, D. L. & Hoffman, K. (2022). A Systematic Comparison of In-Person and Video-Based Online Interviewing. International Journal of Qualitative Methods, 21."],
  mat:["interview"]},
 {id:"aufb",t:"Aufbereitung",kurz:"Aufbereitung",w:1.5,kap:"Methodenteil: Aufbereitung der Daten",
  def:{t:"Was ist eigentlich ein Transkript?",x:"Ein Transkript ist die Verschriftlichung deiner Aufnahme. Aus dem gesprochenen Interview wird ein Text, mit dem du arbeiten, zitieren und auswerten kannst. Wie genau du verschriftlichst, legen Transkriptionsregeln fest: zum Beispiel, ob Pausen, Lachen oder Füllwörter wie „ähm“ notiert werden. Für die meisten Abschlussarbeiten reicht ein einfaches Transkript, bei dem der Inhalt im Mittelpunkt steht."},
  ziel:"Aus Aufnahmen werden Texte, mit denen du arbeiten kannst. Du transkribierst nach festen Regeln und anonymisierst alles, was Rückschlüsse auf Personen erlaubt. Die Aufbereitung beginnt schon während der Erhebung.",
  ergebnis:"Vollständige, anonymisierte Transkripte mit Absatznummern nach einheitlichen Regeln, ein kurzes Anonymisierungskonzept und eine Notiz zu deinem Vorgehen.",
  par:"Läuft parallel zur Erhebung: Transkribier jedes Interview möglichst bald nach dem Termin.",
  schritte:["Transkriptionsregeln vorher festlegen: so viel wie nötig, so wenig wie möglich, und für alle Interviews gleich","Transkribieren oder Transkripte prüfen, wenn Software oder KI geholfen hat","Anonymisierungskonzept anlegen: Was wird anonymisiert, warum und wie?","Anonymisieren: Namen, Orte, Einrichtungen und Konstellationen, die Personen erkennbar machen","Transkripte sicher speichern, Aufnahmen nach den Vorgaben löschen","Vorgehen kurz für den Methodenteil festhalten"],
  stolper:["Automatische Transkripte ungeprüft übernehmen. Gerade bei Dialekt, leiser oder entfernter Stimme passieren viele Fehler.","Die Nachkorrektur unterschätzen. Mit KI geht es schneller, aber die Prüfung dauert oft länger als gedacht.","Nur Namen anonymisieren. Auch eine Kombination aus Beruf, Ort und Ereignis kann eine Person erkennbar machen."],
  blick:["Sind Transkriptionsregeln und Anonymisierung nachvollziehbar? Dafür reichen ein paar Sätze im Methodenteil und der Anhang, kein eigenes Kapitel.","Wurde Datenschutz ernst genommen, vor allem bei KI-Transkription?"],
  tipp:"Ja, du darfst KI für die Transkription nutzen, mit einem Augenzwinkern. Früher haben wir das Transkribieren verflucht, aber nebenbei das Material richtig gut kennengelernt und die besten Zitate schon im Kopf abgelegt. Diesen Effekt holst du dir zurück, wenn du jedes Transkript gründlich gegenliest.",
  vert:[{t:"Anonymisieren: mehr als Namen ersetzen",
   intro:"Anonymisieren heißt, dass niemand aus deinen Transkripten auf eine Person schließen kann, auch nicht durch die Kombination mehrerer Hinweise. Bewährt hat sich ein kurzes Konzept als Tabelle: Was wird anonymisiert, warum und wie?",
   punkte:["**Personen:** durch ihre Rolle ersetzen, zum Beispiel [Beraterin] oder [Kollege]. So bleiben Zusammenhänge verständlich.","**Orte:** stark abstrahieren, zum Beispiel [Stadt] oder [Fluss]. Lässt sich ein Satz nicht flüssig umschreiben, ersetzt du den Teil durch [entfernt].","**Einrichtungen und Gruppen:** abstrahieren, zum Beispiel [Beratungsstelle] oder [Verein], vor allem wenn es davon in einer Region nur wenige gibt.","**Konstellationen:** Prüf, ob mehrere Angaben zusammen eine Person verraten, etwa die einzige Einrichtung dieser Art im Bundesland. Dann abstrahierst du stärker.","**Kennzeichnen:** Markier anonymisierte Stellen einheitlich, zum Beispiel mit eckigen Klammern, und beschreib dein Vorgehen im Anhang."]}],
  info:[{t:"Absatznummern von Anfang an",x:"Lass deine Transkripte mit Absatz- oder Zeilennummern ausgeben. Im Ergebnisteil belegst du deine Zitate später mit Interview und Absatz, zum Beispiel (Int3, Abs. 12). Seitenzahlen verschieben sich mit jeder Formatierung."}],
  lit:["Dresing, T. & Pehl, T. (2018). Praxisbuch Interview, Transkription & Analyse (8. Aufl.). Eigenverlag, Marburg. Kostenlos online verfügbar.","Meyermann, A. & Porzelt, M. (2014). Hinweise zur Anonymisierung von qualitativen Daten. forschungsdaten bildung informiert, 1."],
  mat:["maxqda","ki"]},
 {id:"ausw",t:"Auswertung",kurz:"Auswertung",w:3,kap:"Methodenteil: Auswertung und die *Story* deiner Ergebnisse",
  def:{t:"Was sind eigentlich Codes und Kategorien?",x:"Ein Code ist ein kurzes Etikett, das du einer Textstelle gibst, um festzuhalten, worum es darin geht. Sagt jemand „Nach der Nachtschicht kann ich einfach nicht abschalten“, könnte der Code „Abschalten nach der Arbeit“ heißen. Eine Kategorie fasst mehrere ähnliche Codes zu einem übergeordneten Thema zusammen, etwa „Erholung“. So entsteht nach und nach ein Kategoriensystem: eine geordnete Übersicht darüber, was in deinem Material steckt. Codes und Kategorien sind Werkzeuge zum Sortieren und Verstehen, nicht schon das Ergebnis."},
  ziel:"Du arbeitest systematisch heraus, was in deinem Material steckt, und machst sichtbar, was deine Forschungsfrage beantwortet. Du fängst dabei nicht im luftleeren Raum an: Theorie, Leitfaden und das, was du beim Führen und Transkribieren schon erfahren hast, fließen ein. Am Ende dieser Phase steht die *Story* deines Ergebniskapitels.",
  ergebnis:"Ein Kategoriensystem mit Definitionen und Ankerbeispielen, vollständig codiertes Material, Memos zu den wichtigsten Erkenntnissen und eine Gliederung des Ergebniskapitels, die eine *Story* erzählt.",
  schritte:["Auswertungsmethode noch einmal prüfen: Inhaltsanalyse, thematische Analyse, Grounded Theory oder ein anderes Verfahren?","Vorarbeit leisten: Vorwissen sammeln, clustern, erste Kategorien kurz definieren","Kategoriensystem mit Definition, Ankerbeispiel und Codierregel festhalten","Probecodierung an zwei bis drei Interviews und das System anpassen","Gesamtes Material codieren","Codebaum prüfen: sehr kleine und sehr große Codes ansehen, sortieren","Memos schreiben: Was fällt auf, was hängt zusammen?","Deine *Diamanten* bestimmen: die Ergebnisse, die deine Frage wirklich beantworten","Die *Story* fürs Ergebniskapitel entwerfen und als Gliederung festhalten"],
  stolper:["Zu viele, zu kleine Codes. Am Ende hat man 300 Codes und keinen Überblick.","Die Software wird mit der Methode verwechselt. MAXQDA ordnet, das Denken machst du.","Häufigkeit mit Bedeutung verwechseln. Was oft gesagt wird, ist nicht automatisch das Wichtigste."],
  blick:["Ist das Vorgehen so beschrieben, dass andere es verstehen und prüfen können?","Gibt es ein Kategoriensystem mit Definitionen, am besten im Anhang? Jeder Zwischenschritt des Codesystems muss dort aber nicht hinein."],
  tipp:"Entwickle dein Kategoriensystem erst außerhalb von MAXQDA, wie eine Gliederung mit Haupt- und Subkategorien. Dann codierst du direkt auf Subcode-Ebene und sortierst den gewachsenen Codebaum mit Papier und Schere. Die zweite Runde ist oft schon die letzte. Wie ich dabei genau vorgehe, steht im MAXQDA-Paket.",
  vert:[{t:"Nicht im luftleeren Raum: Vorarbeit fürs Kategoriensystem",
   intro:"Viele sitzen vor ihren Transkripten und wissen nicht, wo sie anfangen sollen. Dabei weißt du schon eine Menge.",
   punkte:["**Vorwissen sammeln:** Schreib auf ein großes Blatt, was dir aus Theorie, Leitfaden und den Gesprächen schon aufgefallen ist.","**Clustern:** Ordne die Punkte zu Gruppen und gib jeder Gruppe eine vorläufige Überschrift.","**Zwei Arten von Kategorien:** Inhaltliche Kategorien fragen „Worum geht es?“, analytische fragen „Was passiert hier?“, zum Beispiel Deutungen, Zuschreibungen oder Machtverhältnisse. Analytische laufen oft quer zu den inhaltlichen.","**Kurz definieren:** Ein Satz pro Kategorie reicht für den Anfang. Erst dann geht es in MAXQDA.","**Je nach Methode:** Bei Grounded Theory und thematischer Analyse bleibst du bewusst offener. Dein Vorwissen legst du trotzdem offen, statt so zu tun, als gäbe es keins."]},
   {t:"Mayring oder Kuckartz?",
   intro:"Beide stehen für die qualitative Inhaltsanalyse, setzen aber unterschiedliche Schwerpunkte. Frag deine Betreuung, was in deinem Fachbereich üblich ist.",
   punkte:["**Mayring:** stark regelgeleitet, mit festen Ablaufmodellen und Techniken wie Zusammenfassung, Explikation und Strukturierung. Kategorien mit Definition, Ankerbeispiel und Codierregel, Häufigkeitsanalysen sind möglich. Kritik: recht nah an quantitativer Logik und aufwendig.","**Kuckartz & Rädiker:** drei Grundformen (inhaltlich strukturierend, evaluativ, typenbildend), flexibler im Wechsel von deduktiv und induktiv, eng mit Software wie MAXQDA verbunden, auch fallbezogene Auswertungen. Kritik: weniger feste Regeln, deshalb musst du dein Vorgehen besonders gut dokumentieren.","**Nicht wild mischen:** Entscheide dich für ein Lehrbuch und folge ihm. Weichst du ab, begründest du, wo und warum.","**Lehrbuch und Praxis:** Im MAXQDA-Paket zeige ich, wie ich Kuckartz in der Praxis umsetze und wo ich bewusst anders vorgehe."]},
   {t:"Reflexive thematische Analyse nach Braun & Clarke",
   intro:"International eines der verbreitetsten Verfahren und für Abschlussarbeiten gut machbar. Es sucht nach Themen, also nach Bedeutungsmustern über das ganze Material hinweg.",
   punkte:["**Sechs Phasen:** mit dem Material vertraut werden, codieren, Themen entwickeln, Themen prüfen, Themen definieren und benennen, schreiben.","**Themen entstehen nicht von selbst:** Du entwickelst sie aktiv. Deine Perspektive gilt hier als Stärke, solange du sie offenlegst.","**Unterschied zur Inhaltsanalyse:** Die Inhaltsanalyse ordnet Aussagen in ein Kategoriensystem. Die thematische Analyse fragt stärker, welche übergreifende Bedeutung sich durch die Interviews zieht.","**Wann sie passt:** wenn du Erleben und Deutungen verstehen willst und dein Fach kein bestimmtes Verfahren vorgibt."]},
   {t:"Grounded Theory: Theorie aus den Daten",
   intro:"Die Grounded Theory eignet sich, wenn ein Phänomen neu oder kaum erforscht ist und du eine gegenstandsbezogene Theorie entwickeln willst, also nicht nur beschreiben, sondern erklären.",
   punkte:["**Erhebung und Auswertung im Wechsel:** Du wertest schon während der Erhebung aus und entscheidest danach, wen du als Nächstes befragst (Theoretical Sampling).","**Drei Codierschritte nach Strauss & Corbin:** offen (nah am Material, oft mit Begriffen der Befragten), axial (Bedingungen, Kontext, Strategien und Konsequenzen verbinden), selektiv (um eine Kernkategorie ordnen).","**Ständig vergleichen und Memos schreiben:** Das ist das Herz der Methode.","**Häufiges Missverständnis:** Grounded Theory heißt nicht, ganz ohne Literatur zu starten. Dein Vorwissen gibt es, also leg es offen.","**Sättigung ehrlich benennen:** In einer Abschlussarbeit erreichst du sie oft nicht ganz. Das darfst du sagen und begründen."]},
   {t:"Expert:inneninterviews auswerten nach Meuser & Nagel",
   intro:"Wenn du Expert:innen zu ihrem Fach- und Erfahrungswissen befragt hast, bietet sich dieses Vorgehen an. Es vergleicht die Interviews thematisch statt Fall für Fall.",
   punkte:["**Schritte:** Transkription, Paraphrase (in eigenen Worten und im Gesprächsverlauf), Überschriften für die Passagen, thematischer Vergleich über alle Interviews, Verknüpfung mit fachlichen Begriffen, theoretische Verallgemeinerung.","**Was du erfährst:** nicht nur Faktenwissen, sondern auch Prozess- und Deutungswissen, also Erfahrungen und Erklärungsmuster.","**Für Abschlussarbeiten:** Oft reicht es, bis zum thematischen Vergleich und zur Verknüpfung mit Begriffen zu gehen."]}],
  info:[{t:"Was sagt eine Zahl?",x:"MAXQDA zeigt dir schnell, wie oft ein Code vorkommt. Das ist ein Hinweis, aber kein Ergebnis. Frag dich bei jeder Zahl, was sie für deine Forschungsfrage bedeutet, und denk mit, statt nur zu zählen."}],
  coach:"Du kommst mit deinem Kategoriensystem nicht weiter oder weißt nicht, welche *Story* dein Material erzählt? Genau da schauen wir in der Forschungsbegleitung gemeinsam drauf.",
  lit:["Kuckartz, U. & Rädiker, S. (2024). Qualitative Inhaltsanalyse. Methoden, Praxis, Umsetzung mit Software und künstlicher Intelligenz (6. Aufl.). Beltz Juventa.","Mayring, P. (2022). Qualitative Inhaltsanalyse. Grundlagen und Techniken (13. Aufl.). Beltz.","Braun, V. & Clarke, V. (2022). Thematic Analysis. A Practical Guide. Sage.","Braun, V. & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.","Strauss, A. & Corbin, J. (1996). Grounded Theory. Grundlagen qualitativer Sozialforschung. Beltz PVU.","Strübing, J. (2021). Grounded Theory (4. Aufl.). Springer VS.","Meuser, M. & Nagel, U. (1991). ExpertInneninterviews – vielfach erprobt, wenig bedacht. In D. Garz & K. Kraimer (Hrsg.), Qualitativ-empirische Sozialforschung (S. 441–471). Westdeutscher Verlag."],
  mat:["maxqda"]},
 {id:"schreib1",t:"Schreibphase 1: Deine Empirie",kurz:"Empirie schreiben",w:2.5,kap:"Methodenteil und Ergebnisse",
  def:{t:"Was ist eigentlich der Unterschied zwischen Ergebnis und Interpretation?",x:"Im Ergebnisteil zeigst du, was in deinem Material steckt: Was sagen deine Interviewpartner:innen, welche Muster zeigen sich, welche Unterschiede gibt es? Belegt wird mit Zitaten. Die Interpretation geht einen Schritt weiter. Sie fragt, was das bedeutet und wie es sich zu Theorie und Forschungsstand verhält. Das gehört in die Diskussion. Als Faustregel: Im Ergebnisteil sprechen vor allem deine Daten, in der Diskussion sprichst du."},
  ziel:"Jetzt schreibst du, und zwar zuerst das, was du am besten kennst: deinen Methodenteil und deine Ergebnisse. Der Methodenteil ist ein guter Einstieg. Du brauchst wenig Literatur, weißt genau, was du gemacht hast, der Umfang ist absehbar, und beim Schreiben durchdringst du noch einmal alles. Danach folgt der Ergebnisteil, die Grundlage für alles andere.",
  ergebnis:"Ein fertiger Methodenteil und eine Rohfassung des Ergebniskapitels, die deiner *Story* folgt und sauber belegt ist.",
  schritte:["Methodenteil schreiben: Forschungsdesign, Sampling, Feldzugang, Erhebung, Aufbereitung, Auswertung","Bei jeder Entscheidung ein „weil“: Warum genau so, wo und warum angepasst?","Eigene Rolle und Gesprächsführung reflektieren","Grafik zum Forschungsdesign einfügen","Ergebnisteil schreiben, entlang deiner *Story*","Zitate auswählen und mit Interview und Absatz belegen","Kurze Zwischenfazits am Ende der Unterkapitel","Prüfen: Wird schon interpretiert oder andere Literatur zitiert? Dann in die Diskussion verschieben","Notieren, was in Theorie und Forschungsstand jetzt noch fehlt"],
  stolper:["Nur das Methodenlehrbuch nacherzählen, statt das eigene Vorgehen zu zeigen.","Feldzugang und Transkription in epischer Breite beschreiben. Es reicht zu sagen, wie der Zugang lief und dass die Aufnahmen verschriftlicht wurden, damit sie auswertbar sind.","Alle Kategorien der Reihe nach abarbeiten, statt eine *Story* zu erzählen.","Zitate aneinanderreihen, ohne sie einzuordnen. Ein Zitat belegt deine Aussage, es ersetzt sie nicht."],
  blick:["Ist der methodische Teil genau nachvollziehbar, und wird sichtbar, wo du die Methode an dein Forschungsdesign angepasst hast?","Sind Zitate im Ergebnisteil eindeutig belegt, mit Interview und Absatz statt Seitenzahl? So kann ich im Transkript im Anhang nachlesen, direkt wie indirekt zitiert.","Erzählen die Ergebnisse eine *Story*, oder ist es eine Sammlung von Einzelbefunden?"],
  tipp:"Mein Merksatz für den Ergebnisteil: Hier sprechen nur deine eigenen Daten. Andere Literatur kommt erst in der Diskussion dazu.",
  vert:[{t:"Die Story im Ergebnisteil sichtbar machen",
   intro:"Deine Leser:innen sollen nachvollziehen können, warum welche Teile vorkommen, in welcher Tiefe und in welcher Reihenfolge.",
   punkte:["**Eine Abbildung vorweg:** Du kannst das Kapitel mit einer Grafik beginnen, in der alle Elemente deiner Ergebnisse auftauchen, und dich dann daran entlang bewegen. Das ist ein möglicher Weg, nicht der einzige.","**Vor jedem Unterkapitel ein Satz:** Was soll die Leserin danach wissen? Schreib diesen Satz zuerst, alles andere ist Beleg.","**Gewichten:** Deine *Diamanten* bekommen Raum, Randthemen dürfen kurz bleiben.","**Übergänge:** Ein Satz am Ende jedes Abschnitts, der zum nächsten führt, hält den roten Faden."]}],
  coach:"Du sitzt vor deinem Material und weißt nicht, wie du die *Story* aufs Papier bekommst? Melde dich gern.",
  mat:["maxqda"]},
 {id:"schreib2",t:"Schreibphase 2: Theorie und Forschungsstand",kurz:"Theorie schreiben",w:2,kap:"Theoretischer Rahmen, Forschungsstand und Einführung",
  def:{t:"Was ist eigentlich der Unterschied zwischen Theorie und Forschungsstand?",x:"Theorie liefert Begriffe und Erklärungsansätze, also die Brille, durch die du auf dein Thema schaust. Der Forschungsstand zeigt, was andere zu deiner Frage oder zu ähnlichen Fragen schon empirisch untersucht und herausgefunden haben. Die Theorie sagt also, wie man etwas verstehen kann. Der Forschungsstand sagt, was man darüber schon weiß und wo noch etwas fehlt. Genau dort liegt die Lücke, an der deine Arbeit ansetzt."},
  ziel:"Mit deinen Ergebnissen vor Augen schreibst du jetzt Theorie und Forschungsstand fertig. Du siehst genau, was relevant ist, und recherchierst nach, wo deine Ergebnisse Dinge zeigen, die du vorher nicht auf dem Schirm hattest. Das Kapitel endet mit einem Resümee, das zu deinen Forschungsfragen und zur Methode überleitet.",
  ergebnis:"Ein fertiger theoretischer Rahmen mit Forschungsstand, eine Einführung ins Problemfeld und ein Resümee mit Forschungslücke und Forschungsfragen.",
  par:"Die Einführung ins Thema, also Problemfeld und Begriffe, kannst du parallel schreiben. Sie ist vergleichsweise einfach und passt gut an Tagen, an denen komplexes Schreiben nicht geht.",
  schritte:["Theorie mit Blick auf deine Ergebnisse prüfen: Fehlt etwas, ist etwas zu weit gefasst?","Gezielt nachrecherchieren","Theoretischen Rahmen schreiben","Forschungsstand nach thematischen Überschriften schreiben, mehrere Studien je Aussage","Bei jeder Quelle den Bezug zu deiner Fragestellung herausarbeiten","Resümee schreiben: Forschungsstand, Forschungslücke und wie du sie schließen willst","Forschungsfragen ausformulieren und zur Methode überleiten","Einführung ins Problemfeld und Begriffsklärung schreiben"],
  stolper:["Eine Studie nach der anderen darstellen. Ordne nach Themen und lass die Studien miteinander ins Gespräch kommen.","Theorie, die später nicht wieder aufgegriffen wird. Was nicht in der Diskussion vorkommt, kann oft raus."],
  blick:["Wird bei jeder Quelle klar, warum sie für deine Fragestellung relevant ist?","Gibt es einen klaren Übergang vom Forschungsstand über die Lücke zu deinen Fragen und zur Wahl der Methode?"],
  tipp:"Formulier für jede thematische Überschrift im Forschungsstand zuerst eine Aussage, zum Beispiel „Studien zeigen übereinstimmend, dass …“ oder „Uneinig ist die Forschung bei …“. Dann ordnest du die Studien dieser Aussage zu. So entsteht eine Erörterung statt einer Aufzählung.",
  coach:"Dein theoretischer Rahmen fühlt sich zu groß oder zu dünn an? Lass uns gemeinsam schärfen.",
  mat:["ki"]},
 {id:"schreib3",t:"Schreibphase 3: Diskussion und Fazit",kurz:"Diskussion",w:2,kap:"Diskussion, Fazit und Ausblick",
  def:{t:"Was ist eigentlich eine Diskussion?",x:"In der Diskussion bringst du deine Ergebnisse mit Theorie und Forschungsstand ins Gespräch. Du fragst: Was bestätigt sich, was ist neu, was widerspricht dem, was man bisher wusste, und warum könnte das so sein? Am Ende beantwortest du deine Forschungsfrage klar und benennst die Grenzen deiner Untersuchung. Eine Diskussion ist keine Zusammenfassung, sondern der Ort, an dem du zeigst, was deine Arbeit Neues sichtbar macht."},
  ziel:"Jetzt wird es richtig spannend: Du führst alles zusammen. Deine Ergebnisse kommen mit Theorie und Forschungsstand ins Gespräch, und du beantwortest deine Forschungsfrage. Hier darfst du mehr wagen.",
  ergebnis:"Eine Diskussion, die Ergebnisse, Theorie und Forschungsstand verknüpft und eine klare Position zeigt, eine ausdrückliche Antwort auf die Forschungsfrage und ein Fazit mit Implikationen, Limitationen und Ausblick.",
  schritte:["Ergebnisse mit dem Forschungsstand vergleichen: Was bestätigt sich, was ist neu, was widerspricht?","Ergebnisse mit dem theoretischen Rahmen verknüpfen und interpretieren","Eine klare Position zu deiner Fragestellung beziehen, gestützt auf Quellen","Forschungsfrage ausdrücklich beantworten","Fazit: Ergebnis kurz auf den Punkt bringen","Implikationen für Praxis und Forschung ableiten","Limitationen benennen: Wo ist die Aussagekraft begrenzt, und warum?"],
  stolper:["Die Diskussion wiederholt nur die Ergebnisse.","Die Forschungsfrage wird nie ausdrücklich beantwortet.","Aus Vorsicht keine Position beziehen. Mut ist hier gefragt, nicht haltlos, sondern begründet."],
  blick:["Wird die Forschungsfrage klar beantwortet? Für viele Gutachter:innen ist das der wichtigste Punkt der ganzen Arbeit.","Werden Ergebnisse, Theorie und Forschungsstand wirklich verknüpft und anhand der Quellen interpretiert?","Werden Limitationen offen benannt? Das ist keine Schwäche, sondern Transparenz und eine Stärke."],
  tipp:"Leg dein Theoriekapitel und dein Ergebniskapitel nebeneinander und zieh Linien. Jede Verbindung ist ein Absatz in deiner Diskussion.",
  coach:"Du traust dich nicht, eine Position zu beziehen, oder weißt nicht, wie du alles zusammenführst? Melde dich gern.",
  mat:["sos"]},
 {id:"abgabe",t:"Einleitung, Überarbeitung und Abgabe",kurz:"Abgabe",w:2,kap:"Einleitung und die ganze Arbeit",
  def:{t:"Was macht eigentlich eine Einleitung?",x:"Die Einleitung holt deine Leser:innen ab. Sie zeigt, warum dein Thema wichtig ist, nennt deine Forschungsfrage und das Ziel deiner Arbeit und gibt einen kurzen Überblick, wie die Arbeit aufgebaut ist. Sie ist wie die Tür zu deiner Arbeit: Wer sie gelesen hat, weiß, was kommt und warum es sich lohnt, weiterzulesen. Deshalb schreibst du sie am Schluss, denn erst jetzt weißt du genau, was du einleitest."},
  ziel:"Jetzt schreibst du die Einleitung, denn erst jetzt weißt du, was du einleitest. Danach überarbeitest du, prüfst Formalia und den Anhang und gibst ab. In dieser Phase steckt auch dein Puffer.",
